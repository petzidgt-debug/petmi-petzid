<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Tienda — PetMi</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Arial,sans-serif;background:#f8f7f4;min-height:100vh;padding-bottom:170px}

.hero{background:linear-gradient(135deg,#00B4B4,#00838f);padding:32px 20px;text-align:center}
.hero h1{font-size:24px;font-weight:900;color:#fff;font-family:'Arial Black',Arial,sans-serif;margin-bottom:4px}
.hero p{font-size:13.5px;color:rgba(255,255,255,.8)}

.filtros{padding:14px 20px 0;display:flex;gap:8px;overflow-x:auto;-ms-overflow-style:none;scrollbar-width:none}
.filtros::-webkit-scrollbar{display:none}
.filtro-btn{padding:8px 16px;border-radius:24px;border:1.5px solid #ddd;font-size:13px;font-weight:600;color:#888;cursor:pointer;background:#fff;white-space:nowrap;flex-shrink:0}
.filtro-btn.active{border-color:#00B4B4;background:#e0f7f7;color:#007a7a}

.grid{max-width:900px;margin:0 auto;padding:16px 20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.prod-card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.prod-foto{width:100%;aspect-ratio:1;object-fit:cover;background:#e8ddd0}
.prod-foto-ph{width:100%;aspect-ratio:1;background:#e8ddd0;display:flex;align-items:center;justify-content:center;font-size:36px}
.prod-info{padding:12px}
.prod-nombre{font-size:13.5px;font-weight:700;color:#1a1a2e;margin-bottom:3px;line-height:1.3}
.prod-desc{font-size:11.5px;color:#888;margin-bottom:8px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.prod-precio{font-size:15px;font-weight:900;color:#00B4B4;margin-bottom:8px}
.prod-btn{display:block;background:#25D366;color:#fff;text-align:center;padding:9px;border-radius:99px;font-size:12px;font-weight:700;text-decoration:none}

.vacio{text-align:center;padding:60px 20px;color:#aaa}

/* ── Carrito ─────────────────────────────────────────────── */
.carrito-fab{position:fixed;bottom:90px;right:18px;z-index:150;background:#1a1a2e;color:#fff;border:none;border-radius:50%;width:56px;height:56px;box-shadow:0 4px 14px rgba(0,0,0,.25);font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.carrito-badge{position:absolute;top:-4px;right:-4px;background:#E05090;color:#fff;font-size:11px;font-weight:900;min-width:20px;height:20px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 5px}
.carrito-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:210;align-items:flex-end;justify-content:center}
.carrito-overlay.open{display:flex}
.carrito-panel{background:#fff;border-radius:20px 20px 0 0;max-width:480px;width:100%;max-height:85vh;display:flex;flex-direction:column;animation:slideUp .25s ease}
.carrito-header{padding:18px 20px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center}
.carrito-header h2{font-size:17px;font-weight:900;color:#1a1a2e}
.carrito-close{background:#f0f0f0;border:none;width:30px;height:30px;border-radius:50%;font-size:14px;cursor:pointer;color:#555}
.carrito-lista{flex:1;overflow-y:auto;padding:8px 20px}
.carrito-item{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid #f2f2f2}
.carrito-item-foto{width:56px;height:56px;border-radius:10px;object-fit:cover;background:#e8ddd0;flex-shrink:0}
.carrito-item-info{flex:1;min-width:0}
.carrito-item-nombre{font-size:13.5px;font-weight:700;color:#1a1a2e;margin-bottom:2px}
.carrito-item-precio{font-size:12.5px;color:#00B4B4;font-weight:700}
.carrito-item-controles{display:flex;align-items:center;gap:10px;margin-top:6px}
.carrito-qty-btn{width:26px;height:26px;border-radius:50%;border:1.5px solid #ddd;background:#fff;font-size:14px;font-weight:700;cursor:pointer;color:#555;display:flex;align-items:center;justify-content:center}
.carrito-qty-num{font-size:13px;font-weight:700;min-width:16px;text-align:center}
.carrito-item-quitar{font-size:11px;color:#c0392b;background:none;border:none;cursor:pointer;margin-left:auto;font-weight:700}
.carrito-footer{padding:16px 20px;border-top:1px solid #eee}
.carrito-subtotal{display:flex;justify-content:space-between;font-size:15px;font-weight:900;color:#1a1a2e;margin-bottom:12px}
.carrito-pagar-btn{display:block;width:100%;background:#00B4B4;color:#fff;border:none;padding:14px;border-radius:99px;font-size:14.5px;font-weight:900;cursor:pointer}
.carrito-pagar-btn:disabled{background:#ccc;cursor:not-allowed}
.carrito-error{background:#fdecea;color:#c0392b;font-size:12.5px;padding:10px 12px;border-radius:10px;margin-bottom:12px;display:none}
.carrito-email-wrap{margin-bottom:12px}
.carrito-email-wrap input{width:100%;padding:11px 14px;border:1.5px solid #ddd;border-radius:10px;font-size:13.5px}
.agregar-carrito-btn{display:block;width:100%;background:#1a1a2e;color:#fff;text-align:center;padding:9px;border-radius:99px;font-size:12px;font-weight:700;border:none;cursor:pointer;margin-top:6px}
.stock-bajo{font-size:10.5px;color:#c0392b;font-weight:700;margin:-4px 0 8px}
.sin-stock{font-size:10.5px;color:#999;font-weight:700;margin:-4px 0 8px}

.prod-card{cursor:pointer}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:flex-end;justify-content:center}
.modal-overlay.open{display:flex}
.modal-prod{background:#fff;border-radius:20px 20px 0 0;max-width:480px;width:100%;max-height:88vh;overflow-y:auto;animation:slideUp .25s ease}
@keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-prod-close{position:absolute;top:14px;right:14px;background:rgba(0,0,0,.5);color:#fff;border:none;width:32px;height:32px;border-radius:50%;font-size:16px;cursor:pointer;z-index:2}
.modal-prod-foto{width:100%;aspect-ratio:1;object-fit:cover;background:#e8ddd0;display:block}
.modal-prod-foto-ph{width:100%;aspect-ratio:1;background:#e8ddd0;display:flex;align-items:center;justify-content:center;font-size:56px}
.modal-prod-body{padding:20px}
.modal-prod-nombre{font-size:19px;font-weight:900;color:#1a1a2e;margin-bottom:6px}
.modal-prod-precio{font-size:20px;font-weight:900;color:#00B4B4;margin-bottom:10px}
.modal-prod-desc{font-size:14px;color:#555;line-height:1.6;margin-bottom:16px;white-space:pre-wrap}
</style>
</head>
<body>

<div class="hero" id="heroWrap">
  <h1>🛍️ Tienda PetMi</h1>
  <p>Pide por WhatsApp, así de fácil</p>
</div>

<div id="yaComeWrap"></div>
<div class="filtros" id="filtrosWrap"></div>
<div class="grid" id="grid"><div class="vacio">Cargando...</div></div>

<script>
var WHATSAPP_NUMERO = '50237673927';
var productos = [];
var categoriaActiva = 'Todos';
var uidMascota = new URLSearchParams(window.location.search).get('uid');
var mascotaPersonal = null;
var especiesFamilia = [];
var alimentosCatalogo = {};
var sessionEmail = localStorage.getItem('petzid_email') || '';

// ── Carrito (localStorage, por dispositivo) ────────────────────
var CARRITO_KEY = 'petmi_carrito';
var carrito = JSON.parse(localStorage.getItem(CARRITO_KEY) || '[]');

function guardarCarrito(){
  localStorage.setItem(CARRITO_KEY, JSON.stringify(carrito));
  actualizarBadgeCarrito();
}

function actualizarBadgeCarrito(){
  var badge = document.getElementById('carritoBadge');
  if(!badge) return; // el elemento vive al final del HTML, todavía no existe al cargar
  var total = carrito.reduce(function(s,i){return s+i.cantidad;}, 0);
  if(total > 0){ badge.style.display='flex'; badge.textContent = total; }
  else badge.style.display='none';
}

function agregarAlCarrito(p, ev){
  if(ev) ev.stopPropagation();
  var existente = carrito.find(function(i){ return String(i.producto_id) === String(p.id); });
  var stockDisponible = p.stock == null ? Infinity : p.stock;
  if(existente){
    if(existente.cantidad >= stockDisponible){ alert('No hay más stock disponible de "'+p.nombre+'".'); return; }
    existente.cantidad++;
  } else {
    if(stockDisponible < 1){ alert('"'+p.nombre+'" está agotado.'); return; }
    carrito.push({ producto_id: p.id, nombre: p.nombre, precio: Number(p.precio), imagen: p.imagen||'', stock: p.stock, cantidad: 1 });
  }
  guardarCarrito();
  renderCarrito();
}

function cambiarCantidad(producto_id, delta){
  var item = carrito.find(function(i){ return String(i.producto_id) === String(producto_id); });
  if(!item) return;
  var stockDisponible = item.stock == null ? Infinity : item.stock;
  item.cantidad += delta;
  if(item.cantidad > stockDisponible) item.cantidad = stockDisponible;
  if(item.cantidad <= 0){ carrito = carrito.filter(function(i){ return String(i.producto_id) !== String(producto_id); }); }
  guardarCarrito();
  renderCarrito();
}

function quitarDelCarrito(producto_id){
  carrito = carrito.filter(function(i){ return String(i.producto_id) !== String(producto_id); });
  guardarCarrito();
  renderCarrito();
}

function abrirCarrito(){
  renderCarrito();
  document.getElementById('carritoOverlay').classList.add('open');
}
function cerrarCarrito(){
  document.getElementById('carritoOverlay').classList.remove('open');
}

function renderCarrito(){
  var lista = document.getElementById('carritoLista');
  var footer = document.getElementById('carritoFooter');
  if(!carrito.length){
    lista.innerHTML = '<div class="vacio" style="padding:40px 10px">Tu carrito está vacío</div>';
    footer.style.display = 'none';
    return;
  }
  footer.style.display = 'block';
  lista.innerHTML = carrito.map(function(i){
    var foto = i.imagen ? '<img class="carrito-item-foto" src="'+i.imagen+'">' : '<div class="carrito-item-foto" style="display:flex;align-items:center;justify-content:center;font-size:22px">🐾</div>';
    return '<div class="carrito-item">'
      + foto
      + '<div class="carrito-item-info">'
      + '<div class="carrito-item-nombre">'+i.nombre+'</div>'
      + '<div class="carrito-item-precio">Q'+i.precio.toFixed(2)+'</div>'
      + '<div class="carrito-item-controles">'
      + '<button class="carrito-qty-btn" onclick="cambiarCantidad(\''+i.producto_id+'\',-1)">−</button>'
      + '<span class="carrito-qty-num">'+i.cantidad+'</span>'
      + '<button class="carrito-qty-btn" onclick="cambiarCantidad(\''+i.producto_id+'\',1)">+</button>'
      + '<button class="carrito-item-quitar" onclick="quitarDelCarrito(\''+i.producto_id+'\')">Quitar</button>'
      + '</div></div></div>';
  }).join('');

  var subtotal = carrito.reduce(function(s,i){return s+(i.precio*i.cantidad);}, 0);
  document.getElementById('carritoSubtotalMonto').textContent = 'Q'+subtotal.toFixed(2);

  var emailGuardado = sessionEmail || localStorage.getItem('petzid_carrito_email') || '';
  document.getElementById('carritoEmailWrap').style.display = emailGuardado ? 'none' : 'block';
  document.getElementById('carritoErrorMsg').style.display = 'none';
}

var cuponActual = '';
function aplicarCupon(){
  var val = document.getElementById('carritoCuponInput').value.trim().toUpperCase();
  var msg = document.getElementById('carritoCuponMsg');
  if(!val){ cuponActual=''; msg.style.display='none'; return; }
  cuponActual = val;
  msg.style.display = 'block';
  msg.style.color = '#00838f';
  msg.textContent = 'Cupón "'+val+'" listo — se valida al momento de pagar.';
}

function irAPagar(){
  var btn = document.getElementById('carritoPagarBtn');
  var errorMsg = document.getElementById('carritoErrorMsg');
  errorMsg.style.display = 'none';

  var email = sessionEmail || localStorage.getItem('petzid_carrito_email') || document.getElementById('carritoEmailInput').value.trim().toLowerCase();
  if(!email || email.indexOf('@') < 0){
    errorMsg.textContent = 'Escribe un correo válido para poder mandarte la confirmación de tu compra.';
    errorMsg.style.display = 'block';
    return;
  }
  if(!sessionEmail) localStorage.setItem('petzid_carrito_email', email);

  btn.disabled = true;
  btn.textContent = 'Generando link de pago...';

  var itemsPayload = carrito.map(function(i){ return { producto_id: i.producto_id, cantidad: i.cantidad }; });

  fetch('/api/crear-checkout', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ email: email, items: itemsPayload, cupon: cuponActual || undefined })
  }).then(function(r){ return r.json(); })
  .then(function(d){
    if(d.ok && d.checkout_url){
      window.location.href = d.checkout_url;
    } else {
      errorMsg.textContent = d.error || 'No se pudo generar el pago. Intenta de nuevo.';
      errorMsg.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Pagar en línea';
    }
  }).catch(function(){
    errorMsg.textContent = 'Error de conexión. Intenta de nuevo.';
    errorMsg.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Pagar en línea';
  });
}

// Si venimos de un pago exitoso de Recurrente, vacía el carrito y avisa
(function chequearRetornoPago(){
  var params = new URLSearchParams(window.location.search);
  if(params.get('pago') === 'exito'){
    carrito = [];
    guardarCarrito();
    setTimeout(function(){ alert('¡Gracias por tu compra! Te llegará un correo con la confirmación.'); }, 300);
  }
})();

document.addEventListener('DOMContentLoaded', actualizarBadgeCarrito);

function iniciar(){
  actualizarBadgeCarrito();
  Promise.all([
    sessionEmail ? fetch('/api/galeria?action=checkEmail',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:sessionEmail})}).then(function(r){return r.json();}).catch(function(){return {mascotas:[]};}) : Promise.resolve({mascotas:[]}),
    fetch('/api/galeria?action=getAlimentosCatalogo').then(function(r){return r.json();}).catch(function(){return {alimentos:[]};})
  ]).then(function(res){
    var mascotas = (res[0] && res[0].mascotas) || [];
    especiesFamilia = [...new Set(mascotas.map(function(m){return m.especie;}).filter(Boolean))];
    if(uidMascota) mascotaPersonal = mascotas.find(function(m){ return m.uid === uidMascota; }) || null;

    (res[1].alimentos || []).forEach(function(a){ alimentosCatalogo[a.nombre.toLowerCase().trim()+'||'+(a.especie||'Todos')] = a.foto; });
    (res[1].sinonimos || []).forEach(function(s){
      // Los sinónimos aplican a cualquier especie del alimento canónico que exista en el catálogo
      ['Perro','Gato','Todos'].forEach(function(esp){
        var fotoCanon = alimentosCatalogo[s.alimento_canonico.toLowerCase().trim()+'||'+esp];
        if(fotoCanon) alimentosCatalogo[s.variante.toLowerCase().trim()+'||'+esp] = fotoCanon;
      });
    });

    if(mascotaPersonal) aplicarPersonalizacion();
    cargarProductos();
  });
}

function aplicarPersonalizacion(){
  document.getElementById('heroWrap').innerHTML =
    '<h1>🛍️ Tienda de '+mascotaPersonal.nombre+'</h1>'
    + '<p>'+(mascotaPersonal.especie||'')+(mascotaPersonal.raza?' · '+mascotaPersonal.raza:'')+'</p>';

  if(mascotaPersonal.alimento){
    var fotoAlimento = alimentosCatalogo[(mascotaPersonal.alimento||'').toLowerCase().trim()+'||'+(mascotaPersonal.especie||'Todos')];
    var msj = encodeURIComponent('Hola! Quiero pedir más: ' + mascotaPersonal.alimento + ' para ' + mascotaPersonal.nombre);
    document.getElementById('yaComeWrap').innerHTML =
      '<div style="max-width:900px;margin:16px auto 0;padding:0 20px">'
      + '<div style="background:#fff8e8;border-radius:14px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px">'
      + '<div style="display:flex;align-items:center;gap:12px">'
      + (fotoAlimento ? '<img src="'+fotoAlimento+'" style="width:52px;height:52px;border-radius:10px;object-fit:cover">' : '')
      + '<div><div style="font-size:11px;color:#a08030;font-weight:700;text-transform:uppercase">'+mascotaPersonal.nombre+' come</div>'
      + '<div style="font-size:14px;font-weight:700;color:#1a1a2e">'+mascotaPersonal.alimento+'</div></div>'
      + '</div>'
      + '<a href="https://wa.me/'+WHATSAPP_NUMERO+'?text='+msj+'" target="_blank" onclick="registrarPedido(\''+mascotaPersonal.alimento.replace(/'/g,"\\'")+'\',\''+mascotaPersonal.nombre.replace(/'/g,"\\'")+'\',\'alimento\')" style="background:#25D366;color:#fff;padding:9px 16px;border-radius:99px;font-size:12.5px;font-weight:700;text-decoration:none">💬 Pedir más</a>'
      + '</div>'
      + '<a href="https://www.revistapetmi.com/guía-de-alimentación-para-perros-y-gatos-por-etapa-de-vida" target="_blank" style="display:flex;align-items:center;gap:8px;background:#e8f4f4;border-radius:10px;padding:10px 12px;text-decoration:none;margin-top:10px">'
      + '<span style="font-size:16px">📖</span>'
      + '<div><div style="font-size:11.5px;font-weight:700;color:#007a7a">Guía de alimentación por etapa de vida</div>'
      + '<div style="font-size:9.5px;color:#5a9a9a">Artículo del blog →</div></div>'
      + '</a>'
      + '</div>';
  }
}

function registrarPedido(item, mascotaNombre, tipo){
  fetch('/api/galeria?action=registrarPedido',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({uid_mascota: mascotaPersonal?mascotaPersonal.uid:'', nombre_mascota:mascotaNombre||'', email:sessionEmail, producto:item, origen:tipo||'tienda'})}).catch(function(){});
}

function cargarProductos(){
  fetch('/api/galeria?action=getProductosTienda')
  .then(function(r){return r.json();})
  .then(function(d){
    productos = d.productos || [];
    var especiesRelevantes = mascotaPersonal ? [mascotaPersonal.especie] : especiesFamilia;
    if(especiesRelevantes.length){
      var filtrados = productos.filter(function(p){ return !p.especie || p.especie === 'Todos' || especiesRelevantes.indexOf(p.especie) >= 0; });
      if(filtrados.length) productos = filtrados;
    }
    renderFiltros();
    renderGrid();
  }).catch(function(){
    document.getElementById('grid').innerHTML = '<div class="vacio">No se pudo cargar la tienda. Intenta de nuevo.</div>';
  });
}

iniciar();

function renderFiltros(){
  var categorias = ['Todos'].concat([...new Set(productos.map(function(p){return p.categoria;}))]);
  document.getElementById('filtrosWrap').innerHTML = categorias.map(function(c){
    return '<button class="filtro-btn'+(c===categoriaActiva?' active':'')+'" onclick="filtrarCategoria(\''+c.replace(/'/g,"\\'")+'\')">'+c+'</button>';
  }).join('');
}

function filtrarCategoria(c){
  categoriaActiva = c;
  renderFiltros();
  renderGrid();
}

function renderGrid(){
  var lista = categoriaActiva === 'Todos' ? productos : productos.filter(function(p){return p.categoria === categoriaActiva;});
  if(!lista.length){
    document.getElementById('grid').innerHTML = '<div class="vacio">Sin productos en esta categoría todavía.</div>';
    return;
  }
  document.getElementById('grid').innerHTML = lista.map(function(p){
    var foto = p.imagen && p.imagen.indexOf('http')>=0
      ? '<img class="prod-foto" src="'+p.imagen+'">'
      : '<div class="prod-foto-ph">🐾</div>';
    var usadoBadge = p.condicion === 'Usado'
      ? '<div style="position:absolute;top:8px;left:8px;background:#1a1a2e;color:#fff;font-size:10px;font-weight:700;padding:3px 9px;border-radius:99px">Usado</div>'
      : '<div style="position:absolute;top:8px;left:8px;background:#2e7d32;color:#fff;font-size:10px;font-weight:700;padding:3px 9px;border-radius:99px">Nuevo</div>';
    var precioTxt = p.precio ? ('Q'+Number(p.precio).toFixed(2)) : 'Consultar precio';
    var envioTxt = p.envio_incluido
      ? '<div style="font-size:10.5px;color:#00838f;font-weight:700;margin:-4px 0 8px">🚚 Envío incluido</div>'
      : (p.costo_envio ? '<div style="font-size:10.5px;color:#888;margin:-4px 0 8px">🚚 Envío: '+p.costo_envio+'</div>' : '');
    var stockTxt = '';
    var agotado = p.stock != null && p.stock <= 0;
    if(p.stock != null && p.stock > 0 && p.stock <= 3) stockTxt = '<div class="stock-bajo">¡Solo quedan '+p.stock+'!</div>';
    else if(agotado) stockTxt = '<div class="sin-stock">Agotado</div>';
    var mensaje = encodeURIComponent('Hola! Quiero pedir: ' + p.nombre);
    var carritoBtn = p.precio && !agotado
      ? '<button class="agregar-carrito-btn" onclick=\'agregarAlCarrito('+JSON.stringify(p)+',event)\'><img src="/img/cart.png" alt="" style="width:14px;height:14px;vertical-align:-2px;margin-right:4px">Agregar al carrito</button>'
      : '';
    return '<div class="prod-card" onclick=\'abrirModalProducto('+JSON.stringify(p)+')\'>'
      + '<div style="position:relative">'+foto+usadoBadge+'</div>'
      + '<div class="prod-info">'
      + '<div class="prod-nombre">'+p.nombre+'</div>'
      + (p.descripcion ? '<div class="prod-desc">'+p.descripcion+'</div>' : '')
      + '<div class="prod-precio">'+precioTxt+'</div>'
      + envioTxt + stockTxt
      + '<a class="prod-btn" href="https://wa.me/'+WHATSAPP_NUMERO+'?text='+mensaje+'" target="_blank" onclick="event.stopPropagation();registrarPedido(\''+p.nombre.replace(/'/g,"\\'")+'\',\''+(mascotaPersonal?mascotaPersonal.nombre:'').replace(/'/g,"\\'")+'\',\'producto\')">💬 WhatsApp</a>'
      + carritoBtn
      + '</div></div>';
  }).join('');
}

function abrirModalProducto(p){
  var foto = p.imagen && p.imagen.indexOf('http')>=0
    ? '<img class="modal-prod-foto" src="'+p.imagen+'">'
    : '<div class="modal-prod-foto-ph">🐾</div>';
  var usadoBadge = p.condicion === 'Usado'
    ? '<div style="position:absolute;top:14px;left:14px;background:#1a1a2e;color:#fff;font-size:11px;font-weight:700;padding:4px 11px;border-radius:99px">Usado</div>'
    : '<div style="position:absolute;top:14px;left:14px;background:#2e7d32;color:#fff;font-size:11px;font-weight:700;padding:4px 11px;border-radius:99px">Nuevo</div>';
  var precioTxt = p.precio ? ('Q'+Number(p.precio).toFixed(2)) : 'Consultar precio';
  var envioTxt = p.envio_incluido
    ? '<div style="font-size:12px;color:#00838f;font-weight:700;margin-bottom:14px">🚚 Envío incluido</div>'
    : (p.costo_envio ? '<div style="font-size:12px;color:#888;margin-bottom:14px">🚚 Envío: '+p.costo_envio+'</div>' : '<div style="margin-bottom:14px"></div>');
  var mensaje = encodeURIComponent('Hola! Quiero pedir: ' + p.nombre);
  var stockTxtModal = '';
  var agotadoModal = p.stock != null && p.stock <= 0;
  if(p.stock != null && p.stock > 0 && p.stock <= 3) stockTxtModal = '<div class="stock-bajo" style="margin-bottom:10px">¡Solo quedan '+p.stock+'!</div>';
  else if(agotadoModal) stockTxtModal = '<div class="sin-stock" style="margin-bottom:10px">Agotado</div>';
  var carritoBtnModal = p.precio && !agotadoModal
    ? '<button class="agregar-carrito-btn" style="padding:13px;margin-top:10px" onclick=\'agregarAlCarrito('+JSON.stringify(p)+');cerrarModalProducto();abrirCarrito()\'><img src="/img/cart.png" alt="" style="width:16px;height:16px;vertical-align:-3px;margin-right:5px">Agregar al carrito</button>'
    : '';
  document.getElementById('modalProdContent').innerHTML =
    '<div style="position:relative">'
    + '<button class="modal-prod-close" onclick="cerrarModalProducto()">✕</button>'
    + foto + usadoBadge
    + '</div>'
    + '<div class="modal-prod-body">'
    + '<div class="modal-prod-nombre">'+p.nombre+'</div>'
    + '<div class="modal-prod-precio">'+precioTxt+'</div>'
    + envioTxt + stockTxtModal
    + (p.descripcion ? '<div class="modal-prod-desc">'+p.descripcion+'</div>' : '')
    + '<a class="prod-btn" style="display:block;padding:13px" href="https://wa.me/'+WHATSAPP_NUMERO+'?text='+mensaje+'" target="_blank" onclick="registrarPedido(\''+p.nombre.replace(/'/g,"\\'")+'\',\''+(mascotaPersonal?mascotaPersonal.nombre:'').replace(/'/g,"\\'")+'\',\'producto\')">💬 WhatsApp</a>'
    + carritoBtnModal
    + '</div>';
  document.getElementById('modalProdOverlay').classList.add('open');
}

function cerrarModalProducto(){
  document.getElementById('modalProdOverlay').classList.remove('open');
}
</script>
<div class="modal-overlay" id="modalProdOverlay" onclick="if(event.target===this)cerrarModalProducto()">
  <div class="modal-prod" id="modalProdContent"></div>
</div>

<button class="carrito-fab" onclick="abrirCarrito()">
  <img src="/img/cart.png" alt="Carrito" style="width:26px;height:26px;object-fit:contain"><span class="carrito-badge" id="carritoBadge" style="display:none">0</span>
</button>

<div class="carrito-overlay" id="carritoOverlay" onclick="if(event.target===this)cerrarCarrito()">
  <div class="carrito-panel">
    <div class="carrito-header">
      <h2>Tu carrito</h2>
      <button class="carrito-close" onclick="cerrarCarrito()">✕</button>
    </div>
    <div class="carrito-lista" id="carritoLista"></div>
    <div class="carrito-footer" id="carritoFooter">
      <div class="carrito-error" id="carritoErrorMsg"></div>
      <div class="carrito-email-wrap" id="carritoEmailWrap">
        <input type="email" id="carritoEmailInput" placeholder="Tu correo (para la confirmación)">
      </div>
      <div class="carrito-email-wrap" style="display:flex;gap:8px">
        <input type="text" id="carritoCuponInput" placeholder="¿Tienes un cupón?" style="text-transform:uppercase">
        <button onclick="aplicarCupon()" style="background:#1a1a2e;color:#fff;border:none;border-radius:10px;padding:0 16px;font-size:12.5px;font-weight:700;cursor:pointer">Aplicar</button>
      </div>
      <div id="carritoCuponMsg" style="font-size:12px;margin-bottom:10px;display:none"></div>
      <div class="carrito-subtotal"><span>Subtotal</span><span id="carritoSubtotalMonto">Q0.00</span></div>
      <button class="carrito-pagar-btn" id="carritoPagarBtn" onclick="irAPagar()">Pagar en línea</button>
    </div>
  </div>
</div>

<script src="/header.js"></script>
</body>
</html>
