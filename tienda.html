<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Tienda — PetMi</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Arial,sans-serif;background:#f8f7f4;min-height:100vh;padding-bottom:110px}

.hero{background:linear-gradient(135deg,#00B4B4,#00838f);padding:32px 20px;text-align:center}
.hero h1{font-size:24px;font-weight:900;color:#fff;font-family:'Arial Black',Arial,sans-serif;margin-bottom:4px}
.hero p{font-size:13.5px;color:rgba(255,255,255,.8)}

.filtros{padding:14px 20px 0;display:flex;gap:8px;overflow-x:auto;-ms-overflow-style:none;scrollbar-width:none}
.filtros::-webkit-scrollbar{display:none}
.filtro-btn{padding:8px 16px;border-radius:24px;border:1.5px solid #ddd;font-size:13px;font-weight:600;color:#888;cursor:pointer;background:#fff;white-space:nowrap;flex-shrink:0}
.filtro-btn.active{border-color:#00B4B4;background:#e0f7f7;color:#007a7a}

.grid{max-width:900px;margin:0 auto;padding:16px 20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.prod-card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.prod-foto{width:100%;aspect-ratio:1;object-fit:cover;background:#e8ddd0}
.prod-foto-ph{width:100%;aspect-ratio:1;background:#e8ddd0;display:flex;align-items:center;justify-content:center;font-size:36px}
.prod-info{padding:12px}
.prod-nombre{font-size:13.5px;font-weight:700;color:#1a1a2e;margin-bottom:3px;line-height:1.3}
.prod-desc{font-size:11.5px;color:#888;margin-bottom:8px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.prod-precio{font-size:15px;font-weight:900;color:#00B4B4;margin-bottom:8px}
.prod-btn{display:block;background:#25D366;color:#fff;text-align:center;padding:9px;border-radius:99px;font-size:12px;font-weight:700;text-decoration:none}

.vacio{text-align:center;padding:60px 20px;color:#aaa}
</style>
</head>
<body>

<div class="hero" id="heroWrap">
  <h1>🛍️ Tienda PetMi</h1>
  <p>Pide por WhatsApp, así de fácil</p>
</div>

<div id="yaComeWrap"></div>
<div class="filtros" id="filtrosWrap"></div>
<div class="grid" id="grid"><div class="vacio">Cargando...</div></div>

<script>
var WHATSAPP_NUMERO = '50237673927';
var productos = [];
var categoriaActiva = 'Todos';
var uidMascota = new URLSearchParams(window.location.search).get('uid');
var mascotaPersonal = null;
var especiesFamilia = [];
var alimentosCatalogo = {};
var sessionEmail = localStorage.getItem('petzid_email') || '';

function iniciar(){
  Promise.all([
    sessionEmail ? fetch('/api/galeria?action=checkEmail',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:sessionEmail})}).then(function(r){return r.json();}).catch(function(){return {mascotas:[]};}) : Promise.resolve({mascotas:[]}),
    fetch('/api/galeria?action=getAlimentosCatalogo').then(function(r){return r.json();}).catch(function(){return {alimentos:[]};})
  ]).then(function(res){
    var mascotas = (res[0] && res[0].mascotas) || [];
    especiesFamilia = [...new Set(mascotas.map(function(m){return m.especie;}).filter(Boolean))];
    if(uidMascota) mascotaPersonal = mascotas.find(function(m){ return m.uid === uidMascota; }) || null;

    (res[1].alimentos || []).forEach(function(a){ alimentosCatalogo[a.nombre.toLowerCase().trim()] = a.foto; });
    (res[1].sinonimos || []).forEach(function(s){
      var fotoCanon = alimentosCatalogo[s.alimento_canonico.toLowerCase().trim()];
      if(fotoCanon) alimentosCatalogo[s.variante.toLowerCase().trim()] = fotoCanon;
    });

    if(mascotaPersonal) aplicarPersonalizacion();
    cargarProductos();
  });
}

function aplicarPersonalizacion(){
  document.getElementById('heroWrap').innerHTML =
    '<h1>🛍️ Tienda de '+mascotaPersonal.nombre+'</h1>'
    + '<p>'+(mascotaPersonal.especie||'')+(mascotaPersonal.raza?' · '+mascotaPersonal.raza:'')+'</p>';

  if(mascotaPersonal.alimento){
    var fotoAlimento = alimentosCatalogo[(mascotaPersonal.alimento||'').toLowerCase().trim()];
    var msj = encodeURIComponent('Hola! Quiero pedir más: ' + mascotaPersonal.alimento + ' para ' + mascotaPersonal.nombre);
    document.getElementById('yaComeWrap').innerHTML =
      '<div style="max-width:900px;margin:16px auto 0;padding:0 20px">'
      + '<div style="background:#fff8e8;border-radius:14px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px">'
      + '<div style="display:flex;align-items:center;gap:12px">'
      + (fotoAlimento ? '<img src="'+fotoAlimento+'" style="width:52px;height:52px;border-radius:10px;object-fit:cover">' : '')
      + '<div><div style="font-size:11px;color:#a08030;font-weight:700;text-transform:uppercase">'+mascotaPersonal.nombre+' come</div>'
      + '<div style="font-size:14px;font-weight:700;color:#1a1a2e">'+mascotaPersonal.alimento+'</div></div>'
      + '</div>'
      + '<a href="https://wa.me/'+WHATSAPP_NUMERO+'?text='+msj+'" target="_blank" onclick="registrarPedido(\''+mascotaPersonal.alimento.replace(/'/g,"\\'")+'\',\''+mascotaPersonal.nombre.replace(/'/g,"\\'")+'\',\'alimento\')" style="background:#25D366;color:#fff;padding:9px 16px;border-radius:99px;font-size:12.5px;font-weight:700;text-decoration:none">💬 Pedir más</a>'
      + '</div></div>';
  }
}

function registrarPedido(item, mascotaNombre, tipo){
  fetch('/api/galeria?action=registrarPedido',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({uid_mascota: mascotaPersonal?mascotaPersonal.uid:'', nombre_mascota:mascotaNombre||'', email:sessionEmail, producto:item, origen:tipo||'tienda'})}).catch(function(){});
}

function cargarProductos(){
  fetch('/api/galeria?action=getProductosTienda')
  .then(function(r){return r.json();})
  .then(function(d){
    productos = d.productos || [];
    var especiesRelevantes = mascotaPersonal ? [mascotaPersonal.especie] : especiesFamilia;
    if(especiesRelevantes.length){
      var filtrados = productos.filter(function(p){ return !p.especie || p.especie === 'Todos' || especiesRelevantes.indexOf(p.especie) >= 0; });
      if(filtrados.length) productos = filtrados;
    }
    renderFiltros();
    renderGrid();
  }).catch(function(){
    document.getElementById('grid').innerHTML = '<div class="vacio">No se pudo cargar la tienda. Intenta de nuevo.</div>';
  });
}

iniciar();

function renderFiltros(){
  var categorias = ['Todos'].concat([...new Set(productos.map(function(p){return p.categoria;}))]);
  document.getElementById('filtrosWrap').innerHTML = categorias.map(function(c){
    return '<button class="filtro-btn'+(c===categoriaActiva?' active':'')+'" onclick="filtrarCategoria(\''+c.replace(/'/g,"\\'")+'\')">'+c+'</button>';
  }).join('');
}

function filtrarCategoria(c){
  categoriaActiva = c;
  renderFiltros();
  renderGrid();
}

function renderGrid(){
  var lista = categoriaActiva === 'Todos' ? productos : productos.filter(function(p){return p.categoria === categoriaActiva;});
  if(!lista.length){
    document.getElementById('grid').innerHTML = '<div class="vacio">Sin productos en esta categoría todavía.</div>';
    return;
  }
  document.getElementById('grid').innerHTML = lista.map(function(p){
    var foto = p.imagen && p.imagen.indexOf('http')>=0
      ? '<img class="prod-foto" src="'+p.imagen+'">'
      : '<div class="prod-foto-ph">🐾</div>';
    var precioTxt = p.precio ? ('Q'+Number(p.precio).toFixed(2)) : 'Consultar precio';
    var mensaje = encodeURIComponent('Hola! Quiero pedir: ' + p.nombre);
    return '<div class="prod-card">'
      + foto
      + '<div class="prod-info">'
      + '<div class="prod-nombre">'+p.nombre+'</div>'
      + (p.descripcion ? '<div class="prod-desc">'+p.descripcion+'</div>' : '')
      + '<div class="prod-precio">'+precioTxt+'</div>'
      + '<a class="prod-btn" href="https://wa.me/'+WHATSAPP_NUMERO+'?text='+mensaje+'" target="_blank" onclick="registrarPedido(\''+p.nombre.replace(/'/g,"\\'")+'\',\''+(mascotaPersonal?mascotaPersonal.nombre:'').replace(/'/g,"\\'")+'\',\'producto\')">💬 Pedir por WhatsApp</a>'
      + '</div></div>';
  }).join('');
}
</script>
<script src="/header.js"></script>
</body>
</html>
