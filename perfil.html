<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link rel="icon" href="/favico.jpg" type="image/jpeg">
<title>Perfil PetzID — PetMi</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Arial,sans-serif;background:#f0f0ee;min-height:100vh}

/* HEADER */
.site-header{background:#fff;border-bottom:1px solid #eee;padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:60px;position:sticky;top:0;z-index:100;box-shadow:0 1px 6px rgba(0,0,0,.07)}
.header-logo img{height:38px;display:block}
.header-btns{display:flex;gap:8px;align-items:center}
.btn-volver{padding:7px 14px;border:1.5px solid #ddd;border-radius:20px;font-size:13px;font-weight:600;color:#888;background:#fff;cursor:pointer;text-decoration:none}
.btn-editar{padding:7px 14px;border:none;border-radius:20px;font-size:13px;font-weight:700;color:#fff;background:#00B4B4;cursor:pointer;text-decoration:none;display:none}

/* HERO */
.perfil-hero{position:relative;background:#00B4B4;overflow:hidden}
.perfil-hero.angelito{background:linear-gradient(135deg,#667eea,#764ba2)}
.perfil-foto-wrap{position:relative;width:100%;max-height:380px;overflow:hidden}
.perfil-foto{width:100%;max-height:380px;object-fit:cover;display:block}
.perfil-foto-placeholder{width:100%;height:280px;display:flex;align-items:center;justify-content:center;font-size:80px;background:rgba(255,255,255,.15)}
.perfil-overlay{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.5));padding:20px}
.perfil-nombre{font-size:28px;font-weight:900;font-family:'Arial Black',Arial,sans-serif;color:#fff;letter-spacing:1px}
.perfil-apodo{display:inline-block;background:#F4A0B0;color:#7a1a2e;font-size:11px;font-weight:700;padding:3px 12px;border-radius:20px;margin-top:6px}
.angel-badge-hero{position:absolute;top:16px;right:16px;font-size:32px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.3))}

/* CONTENIDO */
.wrap{max-width:560px;margin:0 auto;padding:16px}

/* STATS */
.stats-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px}
.stat-card{background:#fff;border-radius:12px;padding:12px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.stat-lbl{font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#bbb;margin-bottom:4px}
.stat-val{font-size:15px;font-weight:900;color:#222}

/* SECCIONES */
.seccion{background:#fff;border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.sec-titulo{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#00B4B4;margin-bottom:12px}
.sec-titulo.purple{color:#764ba2}

/* CAMPOS */
.campos-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.campo-lbl{font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#bbb;margin-bottom:3px}
.campo-val{font-size:14px;font-weight:700;color:#222}

/* CHIPS */
.chips-wrap{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip-tag{display:inline-block;background:#e0f7f7;color:#007a7a;font-size:12px;font-weight:600;padding:5px 12px;border-radius:20px}

/* MENSAJES */
.mensaje-item{background:#f8f8f8;border-radius:10px;padding:12px;margin-bottom:8px}
.mensaje-autor{font-size:12px;font-weight:700;color:#333}
.mensaje-fecha{font-size:10px;color:#bbb;margin-left:8px}
.mensaje-txt{font-size:13px;color:#555;margin-top:4px;line-height:1.5}
.mensaje-empty{text-align:center;padding:20px;color:#bbb;font-size:13px}
.input-mensaje{display:flex;gap:8px;margin-top:12px}
.input-autor{width:35%;padding:10px 12px;border:1.5px solid #e0e0e0;border-radius:10px;font-size:13px;outline:none}
.input-autor:focus{border-color:#00B4B4}
.input-txt{flex:1;padding:10px 12px;border:1.5px solid #e0e0e0;border-radius:10px;font-size:13px;outline:none}
.input-txt:focus{border-color:#00B4B4}
.btn-enviar{padding:10px 14px;background:#00B4B4;color:#fff;border:none;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}

/* LOADING */
.loading-wrap{text-align:center;padding:80px 20px}
.spinner{width:40px;height:40px;border:3px solid #f0f0f0;border-top-color:#00B4B4;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:12px 24px;border-radius:24px;font-size:14px;font-weight:600;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}

/* FOOTER */
.footer{background:#1a1a2e;padding:20px;text-align:center;margin-top:20px}
.footer-brand{font-size:16px;font-weight:900;font-family:'Arial Black',Arial,sans-serif;color:#fff}
.footer-brand span{color:#F5C842}
.footer-sub{font-size:11px;color:rgba(255,255,255,.4);margin-top:4px}
</style>
</head>
<body>



<div id="mainContent">
  <div class="loading-wrap">
    <div class="spinner"></div>
    <p style="color:#888;font-size:14px">Cargando perfil...</p>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var sessionEmail = localStorage.getItem('petzid_email') || '';
var mascota      = null;
var uid          = new URLSearchParams(window.location.search).get('uid');

if (!uid) window.location.href = '/galeria.html';

// Cargar datos desde Supabase
fetch('https://ilcreewilnkchvozicyp.supabase.co/rest/v1/mascotas?uid=eq.' + encodeURIComponent(uid) + '&select=*', {
    headers: {
      'apikey': 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlsY3JlZXdpbG5rY2h2b3ppY3lwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwMDU3NTIsImV4cCI6MjA5MzU4MTc1Mn0.X5QoGsMIKU0oWd0q0qvKYxlbb1tZfMvttBxOwL0BCoM',
      'Authorization': 'Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlsY3JlZXdpbG5rY2h2b3ppY3lwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwMDU3NTIsImV4cCI6MjA5MzU4MTc1Mn0.X5QoGsMIKU0oWd0q0qvKYxlbb1tZfMvttBxOwL0BCoM'
    }
  })
  .then(function(r){ return r.json(); })
  .then(function(data){
    if(!data||!data.length){
      document.getElementById('mainContent').innerHTML = '<div style="text-align:center;padding:60px;color:#888">Perfil no encontrado</div>';
      return;
    }
    var m = data[0];
    mascota = {
      uid:         m.uid||'',
      nombre:      m.nombre||'',
      apodo:       m.apodo||'',
      especie:     m.especie||'',
      sexo:        m.sexo||'',
      raza:        m.raza||'',
      tipoFecha:   m.tipo_fecha||'',
      fecha:       m.fecha||'',
      zona:        m.zona||'',
      dueno:       m.dueno||'',
      email:       m.email||'',
      veterinario: m.veterinario||'',
      instagram:   m.instagram||'',
      alimento:    m.alimento||'',
      actividades: m.actividades||'',
      especial:    m.especial||'',
      foto:        m.foto||'',
      angelito:    m.angelito===true,
      fechaAngel:  m.fecha_angelito||''
    };

    renderPerfil();
    cargarMensajes();

    // Mostrar botón editar si es el dueño
    if (sessionEmail && mascota.email && mascota.email.toLowerCase() === sessionEmail.toLowerCase()) {
      var btnEditar = document.getElementById('btnEditar');
      if(btnEditar){ btnEditar.style.display = 'block'; btnEditar.href = '/editar.html?uid=' + uid; }
    }
  })
  .catch(function(e){
    document.getElementById('mainContent').innerHTML = '<div style="text-align:center;padding:60px;color:#888">Error al cargar el perfil</div>';
  });

function renderPerfil(){
  var m       = mascota;
  var esGato  = m.especie.toLowerCase().indexOf('gato') >= 0;
  var emoji   = esGato ? '🐱' : '🐶';
  var heroClass = m.angelito ? 'perfil-hero angelito' : 'perfil-hero';

  // Calcular años angelito
  var aniosAngel = '';
  if (m.angelito && m.fecha && m.fechaAngel) {
    var ny = new Date(m.fecha.indexOf('/')>=0 ? m.fecha.split('/')[2]+'-'+m.fecha.split('/')[1]+'-'+m.fecha.split('/')[0] : m.fecha).getFullYear();
    var ay = new Date(m.fechaAngel).getFullYear();
    if (!isNaN(ny) && !isNaN(ay)) aniosAngel = ny + ' - ' + ay;
  }

  // Mes cumpleaños
  var mesActual = new Date().getMonth();
  var esCumple  = false;
  if (m.fecha) {
    var df = new Date(m.fecha.indexOf('/')>=0 ? m.fecha.split('/')[2]+'-'+m.fecha.split('/')[1]+'-'+m.fecha.split('/')[0] : m.fecha);
    esCumple = !isNaN(df.getTime()) && df.getMonth() === mesActual;
  }

  var fotoHTML = m.foto && m.foto.indexOf('http') >= 0
    ? '<img src="' + m.foto + '" class="perfil-foto" style="' + (m.angelito ? 'filter:grayscale(20%)' : '') + '">'
    : '<div class="perfil-foto-placeholder">' + emoji + '</div>';

  var actividadesHTML = '';
  if (m.actividades) {
    var acts = m.actividades.split(',').map(function(a){ return a.trim(); }).filter(Boolean);
    actividadesHTML = '<div class="chips-wrap">' + acts.map(function(a){
      return '<span class="chip-tag">'+a+'</span>';
    }).join('') + '</div>';
  }

  var cumpleBanner = esCumple && !m.angelito
    ? '<div style="background:#F5C842;border-radius:12px;padding:12px 16px;margin-bottom:14px;display:flex;align-items:center;gap:10px"><div style="font-size:24px">🎂</div><div style="font-size:14px;font-weight:700;color:#1a1a1a">Este mes cumple años o llegó a casa</div></div>'
    : '';

  var mostrarMensajes = m.angelito || esCumple;
  var secTituloClass  = m.angelito ? 'purple' : '';

  var html = '';
  html += '<div class="'+heroClass+'">';
  html += '<div class="perfil-foto-wrap">';
  html += fotoHTML;
  html += '<div class="perfil-overlay">';
  html += '<div class="perfil-nombre">"'+m.nombre.toUpperCase()+'"</div>';
  if(m.apodo) html += '<div class="perfil-apodo">'+m.apodo+'</div>';
  if(aniosAngel) html += '<div style="font-size:13px;color:rgba(255,255,255,.8);margin-top:6px">'+aniosAngel+'</div>';
  html += '</div>';
  if(m.angelito) html += '<div class="angel-badge-hero">🐾</div>';
  html += '</div></div>';

  html += '<div class="wrap">';
  html += cumpleBanner;

  html += '<div class="stats-row">';
  html += '<div class="stat-card"><div class="stat-lbl">Especie</div><div class="stat-val">'+emoji+' '+(m.especie||'-')+'</div></div>';
  html += '<div class="stat-card"><div class="stat-lbl">Sexo</div><div class="stat-val">'+(m.sexo||'-')+'</div></div>';
  html += '<div class="stat-card"><div class="stat-lbl">'+(m.tipoFecha==='llegada'?'Llegó a casa':'Nacimiento')+'</div><div class="stat-val" style="font-size:12px">'+formatFecha(m.fecha)+'</div></div>';
  html += '</div>';

  html += '<div class="seccion"><div class="sec-titulo">🏠 Datos</div><div class="campos-grid">';
  html += '<div><div class="campo-lbl">Raza</div><div class="campo-val">'+(m.raza||'-')+'</div></div>';
  html += '<div><div class="campo-lbl">Responsable</div><div class="campo-val">'+(m.dueno||'-')+'</div></div>';
  if(m.veterinario) html += '<div><div class="campo-lbl">Veterinario</div><div class="campo-val">'+m.veterinario+'</div></div>';
  if(m.zona) html += '<div><div class="campo-lbl">Zona</div><div class="campo-val">'+m.zona+'</div></div>';
  html += '</div></div>';

  if(m.actividades){
    html += '<div class="seccion"><div class="sec-titulo">🎾 Le gusta</div>';
    html += actividadesHTML+'</div>';
  }
  if(m.alimento){
    html += '<div class="seccion"><div class="sec-titulo">🍖 Alimento</div>';
    html += '<div style="font-size:14px;color:#333">'+m.alimento+'</div></div>';
  }
  if(m.especial){
    html += '<div class="seccion" style="border-left:4px solid #F5C842"><div class="sec-titulo">✨ Algo especial</div>';
    html += '<div style="font-size:14px;color:#555;line-height:1.6">'+m.especial+'</div></div>';
  }
  if(m.instagram){
    html += '<div class="seccion"><div class="sec-titulo">📸 Instagram</div>';
    html += '<a href="https://instagram.com/'+m.instagram.replace('@','')+'" target="_blank" style="font-size:14px;color:#00B4B4;font-weight:700">'+m.instagram+'</a></div>';
  }

  html += '<div class="seccion" id="mensajesSeccion" style="'+(mostrarMensajes?'':'display:none')+'">';
  html += '<div class="sec-titulo '+secTituloClass+'">💬 Mensajes</div>';
  html += '<div id="mensajesLista"><div class="mensaje-empty">Cargando...</div></div>';
  html += '<div class="input-mensaje">';
  html += '<input type="text" class="input-autor" id="msgAutor" placeholder="Tu nombre">';
  html += '<input type="text" class="input-txt" id="msgTxt" placeholder="Deja un mensaje...">';
  html += '<button class="btn-enviar" onclick="enviarMensaje()">✉️</button>';
  html += '</div></div>';

  html += '</div>';
  // Sección de conversación privada (solo si son amigos)
  html += '<div id="convSection" style="display:none">';
  html += '<div class="seccion" style="border-left:4px solid #00B4B4">';
  html += '<div class="sec-titulo">💬 Mensaje privado <button onclick="debugConv()" style="font-size:10px;padding:2px 8px;background:#f0f0ee;border:none;border-radius:8px;cursor:pointer;margin-left:8px">debug</button></div>';
  html += '<div id="debugMsg" style="font-size:11px;color:#888;padding:4px 0;margin-bottom:8px"></div>';
  html += '<div id="convLista" style="max-height:300px;overflow-y:auto;margin-bottom:12px"></div>';
  html += '<div style="display:flex;gap:8px">';
  html += '<input type="text" id="convInput" placeholder="Escribe un mensaje..." style="flex:1;padding:10px 12px;border:1.5px solid #e0e0e0;border-radius:10px;font-size:13px;outline:none">';
  html += '<button onclick="enviarMensajePrivado()" style="padding:10px 14px;background:#00B4B4;color:#fff;border:none;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer">✉️</button>';
  html += '</div></div></div>';

  html += '<div class="footer"><div class="footer-brand">petz<span>ID</span></div>';
  html += '<div class="footer-sub">PetMi Guatemala — Comunidad de mascotas</div></div>';

  document.getElementById('mainContent').innerHTML = html;

  // Verificar amistad y cargar conversación
  verificarAmistad();
}

function formatFecha(val){
  if(!val||val==='-')return'-';
  var d, p=String(val).split('/');
  if(p.length===3) d=new Date(p[2]+'-'+p[1]+'-'+p[0]);
  else d=new Date(val);
  if(isNaN(d.getTime()))return String(val);
  return d.toLocaleDateString('es-GT',{year:'numeric',month:'short',day:'numeric'});
}

function cargarMensajes(){
  if(!mascota||(!mascota.angelito)){
    // Verificar si es cumpleañero
    var mesActual=new Date().getMonth();
    var esCumple=false;
    if(mascota&&mascota.fecha){
      var df=new Date(mascota.fecha.indexOf('/')>=0?mascota.fecha.split('/')[2]+'-'+mascota.fecha.split('/')[1]+'-'+mascota.fecha.split('/')[0]:mascota.fecha);
      esCumple=!isNaN(df.getTime())&&df.getMonth()===mesActual;
    }
    if(!esCumple) return;
  }

  fetch('/api/galeria?action=getMensajes&uid='+encodeURIComponent(uid))
    .then(function(r){return r.json();})
    .then(function(d){
      var msgs = d.mensajes||[];
      var lista = document.getElementById('mensajesLista');
      if(!lista) return;
      if(msgs.length===0){
        lista.innerHTML='<div class="mensaje-empty">Sé el primero en dejar un mensaje 🐾</div>';
        return;
      }
      lista.innerHTML = msgs.map(function(m){
        var fecha = m.fecha ? new Date(m.fecha).toLocaleDateString('es-GT') : '';
        return '<div class="mensaje-item">'
          +'<span class="mensaje-autor">'+m.autor+'</span>'
          +'<span class="mensaje-fecha">'+fecha+'</span>'
          +'<div class="mensaje-txt">'+m.mensaje+'</div></div>';
      }).join('');
    }).catch(function(){});
}

function enviarMensaje(){
  var autor   = document.getElementById('msgAutor').value.trim();
  var mensaje = document.getElementById('msgTxt').value.trim();
  if(!autor||!mensaje){ alert('Por favor ingresa tu nombre y un mensaje'); return; }

  fetch('/api/admin?action=updateRow',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      action:'addMensaje',
      uid:uid,
      autor:autor,
      mensaje:mensaje,
      nombreMascota:mascota?mascota.nombre:''
    })
  }).then(function(r){return r.json();})
  .then(function(d){
    if(d.ok){
      document.getElementById('msgTxt').value='';
      mostrarToast('Mensaje enviado 🐾');
      cargarMensajes();
    }
  }).catch(function(){alert('Error al enviar.');});
}

function debugConv(){
  var dbg = document.getElementById('debugMsg');
  dbg.textContent = 'miMascotaUID='+miMascotaUID+' | mascota='+( mascota?mascota.uid:'null');
  cargarConversacion(miMascotaUID, mascota.uid);
  fetch('/api/galeria?action=enviarMensajePrivado',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({uid_emisor:miMascotaUID,uid_receptor:mascota.uid,mensaje:'test debug'})
  }).then(function(r){return r.json();})
  .then(function(d){dbg.textContent+=' | envio:'+JSON.stringify(d);})
  .catch(function(e){dbg.textContent+=' | error:'+e.message;});
}

function mostrarToast(msg){
  var el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('show');
  setTimeout(function(){el.classList.remove('show');},2500);
}

// ── Conversaciones privadas ───────────────────────────────────
var miMascotaUID = null;

function verificarAmistad(){
  var sessionEmail = localStorage.getItem('petzid_email')||'';
  if(!sessionEmail||!mascota) return;

  fetch('/api/galeria?action=checkEmail',{
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({action:'checkEmail',email:sessionEmail})
  }).then(function(r){return r.json();})
  .then(function(d){
    if(!d.found||!d.mascotas.length) return;
    var miMascota = d.mascotas[0];
    miMascotaUID  = miMascota.uid;
    if(miMascota.uid === mascota.uid) return; // es mi propio perfil

    // Verificar si son amigos - consulta directa Supabase
    var sbUrl='https://ilcreewilnkchvozicyp.supabase.co';
    var sbKey='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlsY3JlZXdpbG5rY2h2b3ppY3lwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwMDU3NTIsImV4cCI6MjA5MzU4MTc1Mn0.X5QoGsMIKU0oWd0q0qvKYxlbb1tZfMvttBxOwL0BCoM';
    fetch(sbUrl+'/rest/v1/amigos?or=(and(uid_solicitante.eq.'+encodeURIComponent(miMascota.uid)+',uid_receptor.eq.'+encodeURIComponent(mascota.uid)+'),and(uid_solicitante.eq.'+encodeURIComponent(mascota.uid)+',uid_receptor.eq.'+encodeURIComponent(miMascota.uid)+'))&estado=eq.aceptado&select=id',{
      headers:{'apikey':sbKey,'Authorization':'Bearer '+sbKey}
    }).then(function(r){return r.json();})
    .then(function(da){
        var sonAmigos = da && da.length > 0;
        if(sonAmigos){
          document.getElementById('convSection').style.display='block';
          cargarConversacion(miMascota.uid, mascota.uid);
          // Marcar como leídos
          fetch('/api/galeria?action=marcarLeidos',{
            method:'POST', headers:{'Content-Type':'application/json'},
            body:JSON.stringify({uid_emisor:mascota.uid, uid_receptor:miMascota.uid})
          });
        }
      });
  });
}

function cargarConversacion(uid1, uid2){
  fetch('/api/galeria?action=getConversacion&uid1='+encodeURIComponent(uid1)+'&uid2='+encodeURIComponent(uid2))
    .then(function(r){return r.json();})
    .then(function(d){
      var msgs = d.mensajes||[];
      var lista = document.getElementById('convLista');
      if(!lista) return;
      if(!msgs.length){
        lista.innerHTML='<div style="text-align:center;color:#bbb;font-size:13px;padding:16px">Envía el primer mensaje 🐾</div>';
        return;
      }
      lista.innerHTML = msgs.map(function(m){
        var esMio = m.uid_emisor === miMascotaUID;
        var fecha = m.created_at ? new Date(m.created_at).toLocaleTimeString('es-GT',{hour:'2-digit',minute:'2-digit'}) : '';
        return '<div style="display:flex;justify-content:'+(esMio?'flex-end':'flex-start')+';margin-bottom:8px">'
          +'<div style="max-width:75%;background:'+(esMio?'#00B4B4':'#f0f0ee')+';color:'+(esMio?'#fff':'#333')+';padding:8px 12px;border-radius:'+(esMio?'14px 14px 4px 14px':'14px 14px 14px 4px')+';font-size:13px;line-height:1.5">'
          +m.mensaje
          +'<div style="font-size:10px;color:'+(esMio?'rgba(255,255,255,.6)':'#bbb')+';margin-top:3px;text-align:right">'+fecha+'</div>'
          +'</div></div>';
      }).join('');
      lista.scrollTop = lista.scrollHeight;
    });
}

function enviarMensajePrivado(){
  var input   = document.getElementById('convInput');
  var mensaje = input.value.trim();
  if(!mensaje||!miMascotaUID||!mascota) return;

  fetch('/api/galeria?action=enviarMensajePrivado',{
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({uid_emisor:miMascotaUID, uid_receptor:mascota.uid, mensaje:mensaje})
  }).then(function(r){return r.json();})
  .then(function(d){
    if(d.ok){
      input.value='';
      cargarConversacion(miMascotaUID, mascota.uid);
    }
  });
}
</script>
