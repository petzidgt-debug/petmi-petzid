<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link rel="icon" href="/favico.jpg" type="image/jpeg">
<title>Portal Partner — PetMi</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Arial,sans-serif;background:#f0f0ee;min-height:100vh}

/* ── LOGIN ─────────────────────────────────────────────── */
.login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#00B4B4,#007a7a)}
.login-box{background:#fff;border-radius:24px;padding:36px 28px;width:100%;max-width:360px;box-shadow:0 8px 40px rgba(0,0,0,.15)}
.login-logo{font-size:26px;font-weight:900;color:#1a1a1a;margin-bottom:4px}
.login-logo span{color:#E05090}
.login-sub{font-size:13px;color:#aaa;margin-bottom:28px}
.login-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:#aaa;margin-bottom:6px}
.login-input{width:100%;padding:13px 14px;border:1.5px solid #e0e0e0;border-radius:12px;font-size:15px;outline:none;font-family:Arial;margin-bottom:14px}
.login-input:focus{border-color:#00B4B4}
.login-btn{width:100%;padding:14px;background:#00B4B4;color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer}
.login-btn:disabled{background:#aaa}
.login-err{font-size:13px;color:#c0392b;background:#fbeaf0;padding:10px 14px;border-radius:10px;margin-top:12px;display:none}
.login-contacto{font-size:12px;color:#aaa;text-align:center;margin-top:16px}
.login-contacto a{color:#00B4B4;font-weight:700;text-decoration:none}

/* ── APP SHELL ──────────────────────────────────────────── */
.app{display:none}
.topbar{background:linear-gradient(135deg,#0a3d3d,#00B4B4);padding:20px 20px 0;color:#fff}
.topbar-inner{max-width:700px;margin:0 auto}
.topbar-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.topbar-logo{font-size:18px;font-weight:900}
.topbar-logo span{color:#F5C842}
.btn-logout{background:rgba(255,255,255,.15);border:none;color:#fff;padding:6px 14px;border-radius:20px;font-size:12px;cursor:pointer;font-weight:600}
.topbar-nombre{font-size:20px;font-weight:900;font-family:'Arial Black',Arial;margin-bottom:2px}
.topbar-email{font-size:12px;color:rgba(255,255,255,.7)}

/* PLAN BADGE */
.plan-pill{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:700;margin-top:8px}
.plan-basico{background:rgba(255,255,255,.15);color:#fff}
.plan-silver{background:rgba(220,220,220,.25);color:#fff}
.plan-gold{background:rgba(245,200,66,.25);color:#F5C842}

/* TABS */
.tabs-bar{background:#fff;border-bottom:2px solid #f0f0f0;display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;max-width:700px;margin:0 auto}
.tabs-bar::-webkit-scrollbar{display:none}
.tab-btn{flex-shrink:0;padding:14px 18px;border:none;background:none;font-size:13px;font-weight:600;color:#aaa;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;font-family:Arial}
.tab-btn.active{color:#00B4B4;border-bottom-color:#00B4B4}

/* CONTENT */
.content{max-width:700px;margin:0 auto;padding:16px 16px 80px}

/* ── CARDS ──────────────────────────────────────────────── */
.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.card-titulo{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:#aaa;margin-bottom:14px}

/* ── STATS ──────────────────────────────────────────────── */
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat-box{background:#fff;border-radius:14px;padding:14px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.stat-n{font-size:26px;font-weight:900;font-family:'Arial Black',Arial;color:#00B4B4}
.stat-n.warn{color:#E05090}
.stat-n.ok{color:#2e7d32}
.stat-l{font-size:10px;color:#aaa;text-transform:uppercase;letter-spacing:.5px;margin-top:3px}

/* PROGRESO CUOTA */
.cuota-wrap{margin-bottom:14px}
.cuota-label{display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px}
.cuota-label span:first-child{font-weight:700;color:#333}
.cuota-label span:last-child{color:#aaa}
.prog-bar{height:8px;background:#f0f0ee;border-radius:99px;overflow:hidden}
.prog-fill{height:100%;border-radius:99px;background:#00B4B4;transition:width .4s}
.prog-fill.lleno{background:#E05090}
.cuota-reset{font-size:11px;color:#aaa;margin-top:5px}

/* VENCIMIENTO */
.vence-banner{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;margin-bottom:14px;font-size:13px}
.vence-banner.ok{background:#e0f7f7;color:#007a7a}
.vence-banner.warn{background:#FFF9E6;color:#856404}
.vence-banner.peligro{background:#fbeaf0;color:#c0392b}

/* ── PUBLICACIONES ──────────────────────────────────────── */
.pub-card{background:#fff;border-radius:14px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.06);overflow:hidden;border:1px solid #f0f0f0}
.pub-img{width:100%;height:140px;object-fit:cover;display:block}
.pub-body{padding:12px 14px}
.pub-badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.badge{display:inline-block;font-size:10px;font-weight:700;padding:3px 9px;border-radius:99px}
.badge-tipo{background:#e0f7f7;color:#007a7a}
.badge-pausado{background:#fbeaf0;color:#c0392b}
.badge-partner{background:#FFF9E6;color:#856404;border:1px solid #F5C842}
.pub-titulo{font-size:14px;font-weight:700;color:#222;margin-bottom:4px;line-height:1.3}
.pub-meta{font-size:11px;color:#aaa;margin-bottom:8px}
.pub-pausa-razon{font-size:12px;color:#c0392b;background:#fbeaf0;padding:8px 10px;border-radius:8px;margin-bottom:8px}
.pub-footer{display:flex;gap:6px;flex-wrap:wrap}
.btn-sm{padding:7px 14px;border:none;border-radius:99px;font-size:12px;font-weight:700;cursor:pointer}
.btn-eliminar{background:#fff0f0;color:#c0392b;border:1px solid #fcc}

/* ── FORMULARIO ─────────────────────────────────────────── */
.tipo-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tipo-tab{padding:8px 16px;border:1.5px solid #eee;border-radius:99px;font-size:13px;font-weight:600;color:#888;background:#fff;cursor:pointer;font-family:Arial}
.tipo-tab.active{border-color:#00B4B4;background:#e0f7f7;color:#007a7a}

label.field-lbl{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:#aaa;margin-bottom:5px;margin-top:14px}
input.field,select.field,textarea.field{width:100%;padding:11px 14px;border:1.5px solid #e0e0e0;border-radius:10px;font-size:14px;outline:none;font-family:Arial}
input.field:focus,select.field:focus,textarea.field:focus{border-color:#00B4B4}
textarea.field{resize:vertical;min-height:80px}

.foto-drop{border:2px dashed #ddd;border-radius:10px;padding:18px;text-align:center;cursor:pointer;margin-top:8px}
.foto-drop:hover{border-color:#00B4B4}
.foto-preview-img{width:100%;height:160px;object-fit:cover;border-radius:10px;margin-top:8px;display:none}

.btn-publicar{width:100%;padding:14px;background:#00B4B4;color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;margin-top:18px}
.btn-publicar:disabled{background:#aaa;cursor:not-allowed}
.btn-publicar.lleno{background:#E05090}

.form-msg{padding:12px;border-radius:10px;font-size:13px;font-weight:600;margin-top:10px;display:none}
.form-msg.ok{background:#e0f7f7;color:#007a7a}
.form-msg.err{background:#fbeaf0;color:#c0392b}

/* ── SPINNER / TOAST ─────────────────────────────────────── */
.spinner{width:32px;height:32px;border:3px solid #f0f0f0;border-top-color:#00B4B4;border-radius:50%;animation:spin .8s linear infinite;margin:32px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:40px 20px;color:#aaa;font-size:13px;line-height:1.8}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 20px;border-radius:24px;font-size:13px;font-weight:600;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}

/* Spinner inline btn */
.spin-btn{width:18px;height:18px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:inline-block;vertical-align:middle;margin-right:6px}
</style>
</head>
<body>

<!-- ══════════════ LOGIN ══════════════ -->
<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <div class="login-logo">petz<span>ID</span></div>
    <div class="login-sub">Portal Partner</div>

<!-- ══════════════ APP ══════════════ -->
<div class="app" id="appShell">

  <!-- TopBar -->
  <div class="topbar">
    <div class="topbar-inner">
      <div class="topbar-row">
        <div class="topbar-logo">petz<span>ID</span> <span style="font-size:11px;font-weight:400;color:rgba(255,255,255,.6)">Portal Partner</span></div>

  <!-- Tabs -->
  <div style="background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.06)">
    <div class="tabs-bar">
      <button class="tab-btn active" data-tab="dashboard" onclick="switchTab(this)">📊 Dashboard</button>

  <!-- ── TAB: DASHBOARD ── -->

    <!-- Stats -->
    <div class="stats-grid" id="statsGrid">

    <!-- Plan detalle -->

  <div class="content" id="tab-publicar" style="display:none">

      <!-- Tipo -->
      <div class="tipo-tabs" id="tipoTabs">

        <button class="tipo-tab" data-tipo="aviso" onclick="selTipo(this)">🔔 Aviso</button>
        <button class="tipo-tab" data-tipo="lugar" onclick="selTipo(this)">📍 Lugar</button>
        <button class="tipo-tab" data-tipo="evento" onclick="selTipo(this)">🎉 Evento</button>
        <button class="tipo-tab" data-tipo="venta" onclick="selTipo(this)">💰 Venta</button>
      </div>

      <!-- Campos base -->
      <label class="field-lbl">Título *</label>
      <input type="text" class="field" id="fTitulo" placeholder="Título de tu publicación">

      <label class="field-lbl">Descripción</label>
      <textarea class="field" id="fDesc" placeholder="Describe tu promo, servicio o producto..."></textarea>

      <!-- Campos extra por tipo -->
      <div id="camposEvento" style="display:none">

        <input type="date" class="field" id="fFecha">

      <!-- Foto -->

        <div style="font-size:24px;margin-bottom:4px">📸</div>
        <div style="font-size:12px;color:#aaa">Toca para subir una imagen</div>
      </div>
      <input type="file" id="fotoFile" accept="image/*" style="display:none" onchange="onFotoChange(event)">

  <!-- ── TAB: MIS PUBLICACIONES ── -->
  <div class="content" id="tab-mispubs" style="display:none">
    <div id="listaPubs"><div class="spinner"></div></div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
/* ═══════════════════════ CONFIG ════════════════════════ */
var SUPA_URL  = 'https://ilcreewilnkchvozicyp.supabase.co';
var SUPA_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlsY3JlZXdpbG5rY2h2b3ppY3lwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwMDU3NTIsImV4cCI6MjA5MzU4MTc1Mn0.X5QoGsMIKU0oWd0q0qvKYxlbb1tZfMvttBxOwL0BCoM';
var SUPA_SVC  = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlsY3JlZXdpbG5rY2h2b3ppY3lwIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc3ODAwNTc1MiwiZXhwIjoyMDkzNTgxNzUyfQ.heD60j_eM5MBjIhoZotR7G5nzQZu7kYv9aVvypbfE8A';
var CLOUD_NAME   = 'dh5wgqgmk';
var UPLOAD_PRESET = 'petzid';

var HA = { 'apikey': SUPA_ANON, 'Authorization': 'Bearer ' + SUPA_ANON };
var HS = { 'apikey': SUPA_SVC,  'Authorization': 'Bearer ' + SUPA_SVC, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' };

/* Límites por plan */
var PLAN_PUBS = { basico: 1, silver: 3, gold: 1 };
var PLAN_LABELS = { basico: '🥉 Básico', silver: '🥈 Silver', gold: '🥇 Gold' };
var PLAN_COLORS = { basico: 'plan-basico', silver: 'plan-silver', gold: 'plan-gold' };

/* Estado global */
var afiliadoEmail = '';
var afiliadoData  = null;  // registro de la tabla actividades
var pubsCiclo     = 0;
var fotoBase64    = null;
var tipoActual    = 'promo';

/* ═══════════════════════ LOGIN ════════════════════════ */
function doLogin() {
  var email = document.getElementById('loginEmail').value.trim().toLowerCase();
  if (!email) { showLoginErr('Ingresa tu email'); return; }

  var btn = document.getElementById('loginBtn');
  btn.disabled = true;
  btn.textContent = 'Verificando...';

  var hoy = new Date().toISOString().split('T')[0];

  fetch(SUPA_URL + '/rest/v1/actividades?es_afiliado=eq.true&afiliado_email=eq.' + encodeURIComponent(email) + '&activo=eq.true&select=*&limit=1', { headers: HA })
    .then(function(r) { return r.json(); })
    .then(function(rows) {
      if (!rows || !rows.length) {
        showLoginErr('No encontramos una cuenta de partner con ese email. ¿Aún no eres partner? Contáctanos.');
        btn.disabled = false; btn.textContent = 'Ingresar al portal';
        return;
      }
      var row = rows[0];
      if (row.afiliado_vence && row.afiliado_vence < hoy) {
        showLoginErr('Tu plan venció el ' + formatFecha(row.afiliado_vence) + '. Renueva contactando a PetMi.');
        btn.disabled = false; btn.textContent = 'Ingresar al portal';
        return;
      }
      afiliadoEmail = email;
      afiliadoData  = row;
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('appShell').style.display = 'block';
      iniciarApp();
    })
    .catch(function() {
      showLoginErr('Error de conexión. Intenta de nuevo.');
      btn.disabled = false; btn.textContent = 'Ingresar al portal';
    });
}

function showLoginErr(msg) {
  var el = document.getElementById('loginErr');
  el.textContent = msg;
  el.style.display = 'block';
}

function cerrarSesion() {
  afiliadoEmail = '';
  afiliadoData  = null;
  document.getElementById('appShell').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('loginEmail').value = '';
  document.getElementById('loginErr').style.display = 'none';
}

/* ═══════════════════════ APP INIT ════════════════════════ */
function iniciarApp() {
  var d = afiliadoData;
  var plan = d.afiliado_plan || 'basico';

  // TopBar
  document.getElementById('topNombre').textContent = d.titulo || afiliadoEmail;
  document.getElementById('topEmail').textContent  = afiliadoEmail;
  document.getElementById('topPlanPill').innerHTML =
    '<div class="plan-pill ' + (PLAN_COLORS[plan] || 'plan-basico') + '">' +
    (PLAN_LABELS[plan] || plan) + ' · Vence ' + formatFecha(d.afiliado_vence) + '</div>';

  cargarDashboard();
  cargarMisPubs();
}

/* ═══════════════════════ DASHBOARD ════════════════════════ */
function cargarDashboard() {
  var d    = afiliadoData;
  var plan = d.afiliado_plan || 'basico';
  var limite = PLAN_PUBS[plan] || 1;
  var hoy  = new Date();

  // Calcular ciclo actual (30 días desde fecha de pago)
  var vence   = d.afiliado_vence ? new Date(d.afiliado_vence + 'T12:00:00') : null;
  var diasRestantes = vence ? Math.max(0, Math.ceil((vence - hoy) / 86400000)) : 0;

  // Buscar publicaciones del ciclo (últimos 30 días)
  var desde30 = new Date(hoy); desde30.setDate(desde30.getDate() - 30);
  var desdeStr = desde30.toISOString().split('T')[0];

  fetch(SUPA_URL + '/rest/v1/actividades?es_afiliado=eq.true&afiliado_email=eq.' + encodeURIComponent(afiliadoEmail) +
    '&created_at=gte.' + desdeStr + 'T00:00:00&select=id,titulo,pausado,created_at&order=created_at.desc', { headers: HA })
    .then(function(r) { return r.json(); })
    .then(function(rows) {
      // Excluir el registro "maestro" que es el primer registro del afiliado
      var pubs = (rows || []).filter(function(r) { return r.titulo && r.titulo !== (afiliadoData.titulo || ''); });
      // Contar solo publicaciones reales (no el registro de activación)
      pubsCiclo = pubs.length;
      var restantes = Math.max(0, limite - pubsCiclo);
      var pct = Math.min(100, Math.round((pubsCiclo / limite) * 100));

      // Stats
      document.getElementById('stPubs').textContent = pubsCiclo;
      document.getElementById('stPubs').className   = 'stat-n' + (pubsCiclo >= limite ? ' warn' : ' ok');
      document.getElementById('stRestantes').textContent = restantes;
      document.getElementById('stRestantes').className   = 'stat-n' + (restantes === 0 ? ' warn' : '');
      document.getElementById('stDias').textContent = diasRestantes;
      document.getElementById('stDias').className   = 'stat-n' + (diasRestantes <= 7 ? ' warn' : '');

      // Banner vencimiento
      var bannerClass = diasRestantes > 15 ? 'ok' : diasRestantes > 7 ? 'warn' : 'peligro';
      var bannerEmoji = diasRestantes > 15 ? '✅' : diasRestantes > 7 ? '⚠️' : '🚨';
      document.getElementById('venceBanner').innerHTML =
        '<div class="vence-banner ' + bannerClass + '">' +
        bannerEmoji + ' Tu plan vence el <strong>' + formatFecha(afiliadoData.afiliado_vence) + '</strong>' +
        (diasRestantes === 0 ? ' — <strong>¡Vencido!</strong>' : ' (' + diasRestantes + ' días)') + '</div>';

      // Barra de cuota
      var resetDate = new Date(desde30); resetDate.setDate(resetDate.getDate() + 30);
      document.getElementById('cuotaWrap').innerHTML =
        '<div class="cuota-label"><span>' + pubsCiclo + ' de ' + limite + ' publicaciones usadas</span><span>' + pct + '%</span></div>' +
        '<div class="prog-bar"><div class="prog-fill' + (pubsCiclo >= limite ? ' lleno' : '') + '" style="width:' + pct + '%"></div></div>' +
        '<div class="cuota-reset">Próximo reset: ' + formatFecha(resetDate.toISOString().split('T')[0]) + '</div>';

      // Plan detalle
      renderPlanDetalle(plan, limite, diasRestantes);

      // Cuota alerta en tab publicar
      actualizarCuotaAlerta(pubsCiclo, limite, plan, restantes);
    });
}

function actualizarCuotaAlerta(pubsCiclo, limite, plan, restantes) {

      '<span style="font-size:12px;font-weight:400">Espera el próximo reset o <a href="https://wa.me/50237673927" target="_blank" style="color:#c0392b">mejora tu plan</a>.</span>';

/* ═══════════════════════ MIS PUBLICACIONES ════════════════════════ */
function cargarMisPubs() {
  fetch(SUPA_URL + '/rest/v1/actividades?es_afiliado=eq.true&afiliado_email=eq.' + encodeURIComponent(afiliadoEmail) +
    '&order=created_at.desc&select=id,titulo,descripcion,tipo,imagen,pausado,pausado_razon,activo,created_at', { headers: HA })
    .then(function(r) { return r.json(); })
    .then(function(rows) {
      var pubs = (rows || []).filter(function(r) {
        return r.titulo && r.titulo !== (afiliadoData.titulo || '');
      });
      if (!pubs.length) {
        document.getElementById('listaPubs').innerHTML =
          '<div class="empty">📋 Aún no tienes publicaciones.<br>Ve a la pestaña <b>Publicar</b> para crear tu primera.</div>';
        return;
      }
      var html = '';
      pubs.forEach(function(p) {
        var fecha = p.created_at ? new Date(p.created_at).toLocaleDateString('es-GT', { day: '2-digit', month: 'short', year: 'numeric' }) : '';
        var tipoBadge = { promo:'🏷️ Promo', aviso:'🔔 Aviso', lugar:'📍 Lugar', evento:'🎉 Evento', venta:'💰 Venta' };
        html += '<div class="pub-card">';
        if (p.imagen && p.imagen.indexOf('http') >= 0) {
          html += '<img src="' + p.imagen + '" class="pub-img" alt="' + (p.titulo || '') + '">';
        }
        html += '<div class="pub-body">';
        html += '<div class="pub-badges">';
        html += '<span class="badge badge-tipo">' + (tipoBadge[p.tipo] || p.tipo || 'Publicación') + '</span>';
        html += '<span class="badge badge-partner">Partner PetMi ✓</span>';
        if (p.pausado) html += '<span class="badge badge-pausado">⏸ Pausado</span>';
        html += '</div>';
        html += '<div class="pub-titulo">' + p.titulo + '</div>';
        html += '<div class="pub-meta">' + fecha + (p.activo ? '' : ' · Inactivo') + '</div>';
        if (p.pausado && p.pausado_razon) {
          html += '<div class="pub-pausa-razon">⚠️ Razón: ' + p.pausado_razon + '</div>';
        }
        html += '<div class="pub-footer">';
        html += '<button class="btn-sm btn-eliminar" data-id="' + p.id + '" onclick="eliminarPub(this.dataset.id)">🗑️ Eliminar</button>';
        html += '</div></div></div>';
      });
      document.getElementById('listaPubs').innerHTML = html;
    });
}

function eliminarPub(id) {
  if (!confirm('¿Eliminar esta publicación?')) return;
  fetch(SUPA_URL + '/rest/v1/actividades?id=eq.' + id, { method: 'DELETE', headers: HS })
    .then(function(r) {
      if (r.ok) {
        toast('✅ Publicación eliminada');
        cargarMisPubs();
        cargarDashboard();
      } else toast('Error al eliminar');
    });
}

/* ═══════════════════════ PUBLICAR ════════════════════════ */
function selTipo(el) {
  document.querySelectorAll('.tipo-tab').forEach(function(b) { b.classList.remove('active'); });
  el.classList.add('active');
  tipoActual = el.dataset.tipo;
  document.getElementById('camposEvento').style.display = tipoActual === 'evento' ? 'block' : 'none';
  document.getElementById('camposLugar').style.display  = tipoActual === 'lugar'  ? 'block' : 'none';
  document.getElementById('camposVenta').style.display  = tipoActual === 'venta'  ? 'block' : 'none';
}

function onFotoChange(ev) {
  var file = ev.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    var img = new Image();
    img.onload = function() {
      var canvas = document.createElement('canvas');
      var MAX = 1200, w = img.width, h = img.height;
      if (w > MAX) { h = Math.round(h * MAX / w); w = MAX; }
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      fotoBase64 = canvas.toDataURL('image/jpeg', 0.82).split(',')[1];
      var prev = document.getElementById('fotoPreview');
      prev.src = canvas.toDataURL('image/jpeg', 0.82);
      prev.style.display = 'block';
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

async function publicar() {
  var titulo = document.getElementById('fTitulo').value.trim();
  if (!titulo) { mostrarMsg('pubMsg', 'El título es obligatorio', 'err'); return; }

  var plan   = afiliadoData.afiliado_plan || 'basico';
  var limite = PLAN_PUBS[plan] || 1;
  if (pubsCiclo >= limite) {
    mostrarMsg('pubMsg', 'Ya usaste todas tus publicaciones de este ciclo', 'err');
    return;
  }

  var btn = document.getElementById('btnPublicar');
  btn.disabled = true;
  btn.innerHTML = '<span class="spin-btn"></span>Publicando...';

  var imagenUrl = '';

  if (fotoBase64) {
    btn.innerHTML = '<span class="spin-btn"></span>Subiendo foto...';
    try {
      var fd = new FormData();
      fd.append('file', 'data:image/jpeg;base64,' + fotoBase64);
      fd.append('upload_preset', UPLOAD_PRESET);
      fd.append('folder', 'petzid/afiliados');
      var res = await fetch('https://api.cloudinary.com/v1_1/' + CLOUD_NAME + '/image/upload', { method: 'POST', body: fd });
      var cld = await res.json();
      imagenUrl = cld.secure_url || '';
    } catch(e) { console.log('Cloudinary error:', e); }
  }

  var payload = {
    titulo:        titulo,
    descripcion:   document.getElementById('fDesc').value.trim() || null,
    tipo:          tipoActual,
    email_creador: afiliadoEmail,
    es_afiliado:   true,
    afiliado_email: afiliadoEmail,
    afiliado_plan:  plan,
    activo:        true,
    pausado:       false,
    imagen:        imagenUrl || null
  };

  // Campos extra
  if (tipoActual === 'evento') {
    payload.fecha     = document.getElementById('fFecha').value || null;
    payload.hora      = document.getElementById('fHora').value.trim() || null;
    payload.ubicacion = document.getElementById('fLugar').value.trim() || null;
  }
  if (tipoActual === 'lugar') {
    payload.ubicacion = document.getElementById('fDireccion').value.trim() || null;
    payload.zona      = document.getElementById('fZona').value.trim() || null;
  }
  if (tipoActual === 'venta') {
    payload.precio    = document.getElementById('fPrecio').value || null;
    payload.whatsapp  = document.getElementById('fWa').value.trim() || null;
  }

  try {
    var r = await fetch(SUPA_URL + '/rest/v1/actividades', {
      method: 'POST',
      headers: HS,
      body: JSON.stringify(payload)
    });
    if (r.ok) {
      mostrarMsg('pubMsg', '✅ Publicación enviada. Ya aparece en la app con tu badge Partner.', 'ok');
      // Reset form
      document.getElementById('fTitulo').value = '';
      document.getElementById('fDesc').value   = '';
      document.getElementById('fFecha').value  = '';
      document.getElementById('fHora').value   = '';
      document.getElementById('fLugar').value  = '';
      document.getElementById('fPrecio').value = '';
      document.getElementById('fWa').value     = '';
      document.getElementById('fotoPreview').style.display = 'none';
      fotoBase64 = null;
      pubsCiclo++;
      cargarDashboard();
      cargarMisPubs();
    } else {
      mostrarMsg('pubMsg', 'Error al publicar. Intenta de nuevo.', 'err');
    }
  } catch(e) {
    mostrarMsg('pubMsg', 'Error de conexión.', 'err');
  }

  btn.disabled = false;
  var restantes = Math.max(0, limite - pubsCiclo);
  btn.innerHTML = 'Publicar (' + restantes + ' restante' + (restantes !== 1 ? 's' : '') + ')';
}

/* ═══════════════════════ TABS ════════════════════════ */
function switchTab(el) {
  document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
  el.classList.add('active');
  var tabs = ['dashboard', 'publicar', 'mispubs'];
  tabs.forEach(function(t) {
    document.getElementById('tab-' + t).style.display = el.dataset.tab === t ? 'block' : 'none';
  });
}

/* ═══════════════════════ HELPERS ════════════════════════ */
function formatFecha(str) {
  if (!str) return '—';
  var d = new Date(str + 'T12:00:00');
  return d.toLocaleDateString('es-GT', { day: '2-digit', month: 'long', year: 'numeric' });
}

function toast(msg) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(function() { el.classList.remove('show'); }, 2500);
}

function mostrarMsg(id, txt, tipo) {
  var el = document.getElementById(id);
  el.textContent = txt;
  el.className = 'form-msg ' + tipo;
  el.style.display = 'block';
  setTimeout(function() { el.style.display = 'none'; }, 5000);
}
