<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portal Afiliado — PetMi</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f8f7f4;min-height:100vh}

  
/* LOGIN */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{background:#fff;border-radius:20px;padding:32px 28px;width:100%;max-width:380px;box-shadow:0 4px 24px rgba(0,0,0,.10)}
.login-logo{text-align:center;margin-bottom:24px}
.login-logo img{height:44px;object-fit:contain}
.login-title{font-size:20px;font-weight:700;color:#1a1a2e;margin-bottom:6px;text-align:center}
.login-sub{font-size:13px;color:#888;text-align:center;margin-bottom:24px}
.login-label{font-size:12px;font-weight:600;color:#555;margin-bottom:6px;display:block}
.login-input{width:100%;padding:13px 14px;border:1.5px solid #eee;border-radius:12px;font-size:15px;outline:none;margin-bottom:16px;transition:border .15s}
.login-input:focus{border-color:#00B4B4}
.login-btn{width:100%;padding:14px;background:#00B4B4;color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer}
.login-btn:disabled{background:#aaa}
.login-msg{font-size:13px;text-align:center;padding:10px;border-radius:10px;margin-bottom:12px;display:none}
.login-msg.error{background:#fbeaf0;color:#993556;display:block}
.login-msg.ok{background:#e0f7f7;color:#007a7a;display:block}

/* PORTAL */
.portal{display:none}
.portal-header{background:#1a1a2e;padding:16px 20px;display:flex;align-items:center;justify-content:space-between}
.portal-logo img{height:32px;object-fit:contain}
.portal-logout{background:rgba(255,255,255,.1);border:none;color:rgba(255,255,255,.7);padding:7px 14px;border-radius:99px;font-size:12px;cursor:pointer}

/* PLAN CARD */
.plan-card{margin:16px;background:linear-gradient(135deg,#1a1a2e,#00B4B4);border-radius:16px;padding:20px;color:#fff}
.plan-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.15);border-radius:99px;padding:5px 14px;font-size:13px;font-weight:700;margin-bottom:12px}
.plan-email{font-size:13px;color:rgba(255,255,255,.6);margin-bottom:4px}
.plan-nombre{font-size:20px;font-weight:700;margin-bottom:16px}
.plan-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.plan-stat{background:rgba(255,255,255,.12);border-radius:10px;padding:10px;text-align:center}
.plan-stat-n{font-size:20px;font-weight:700;color:#F5C842}
.plan-stat-l{font-size:10px;color:rgba(255,255,255,.6);margin-top:2px}

/* CUOTA */
.cuota-wrap{margin:0 16px 16px;background:#fff;border-radius:14px;padding:14px 16px;border:0.5px solid #eee}
.cuota-title{font-size:12px;font-weight:700;color:#555;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.cuota-bar-bg{background:#f0f0ee;border-radius:99px;height:8px;margin-bottom:6px}
.cuota-bar{height:8px;border-radius:99px;background:#00B4B4;transition:width .5s}
.cuota-bar.warning{background:#F5C842}
.cuota-bar.full{background:#E24B4A}
.cuota-label{font-size:12px;color:#888}
.cuota-reset{font-size:11px;color:#aaa;margin-top:4px}

/* TABS */
.tabs{display:flex;gap:6px;margin:0 16px 16px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab-btn{padding:8px 18px;border-radius:99px;font-size:13px;font-weight:600;border:1.5px solid #eee;background:#fff;color:#888;cursor:pointer;white-space:nowrap;flex-shrink:0}
.tab-btn.act{background:#00B4B4;color:#fff;border-color:#00B4B4}

/* FORM PUBLICAR */
.pub-form{margin:0 16px 16px;background:#fff;border-radius:14px;padding:16px;border:0.5px solid #eee;display:none}
.pub-form.show{display:block}
.pub-form-title{font-size:15px;font-weight:700;color:#222;margin-bottom:14px}
.form-group{margin-bottom:14px}
.form-label{font-size:12px;font-weight:600;color:#555;margin-bottom:6px;display:block}
.form-input{width:100%;padding:11px 13px;border:1.5px solid #eee;border-radius:10px;font-size:14px;outline:none;transition:border .15s}
.form-input:focus{border-color:#00B4B4}
.form-textarea{width:100%;padding:11px 13px;border:1.5px solid #eee;border-radius:10px;font-size:14px;outline:none;resize:vertical;min-height:80px;font-family:Arial,sans-serif}
.form-textarea:focus{border-color:#00B4B4}
.pub-btn{width:100%;padding:13px;background:#00B4B4;color:#fff;border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer}
.pub-btn:disabled{background:#aaa;cursor:not-allowed}
.pub-btn.blocked{background:#E24B4A}

/* MIS PUBLICACIONES */
.mis-pubs{margin:0 16px 16px}
.mis-pubs-title{font-size:12px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
.pub-card{background:#fff;border-radius:12px;padding:14px;border:0.5px solid #eee;margin-bottom:8px;position:relative}
.pub-card-titulo{font-size:14px;font-weight:600;color:#222;margin-bottom:4px}
.pub-card-desc{font-size:12px;color:#888;margin-bottom:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pub-card-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pub-tipo{font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px;background:#e0f7f7;color:#007a7a}
.pub-fecha{font-size:11px;color:#aaa}
.pub-badge-pausado{font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px;background:#FCEBEB;color:#c0392b}
.pub-razon{font-size:11px;color:#c0392b;margin-top:6px;background:#FCEBEB;border-radius:8px;padding:6px 10px}
.pub-empty{text-align:center;padding:24px;color:#aaa;font-size:13px}
.spinner{text-align:center;padding:24px;color:#aaa;font-size:13px}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1a1a2e;color:#fff;padding:10px 22px;border-radius:24px;font-size:13px;font-weight:600;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-wrap" id="loginWrap">
  <div class="login-card">
    <div class="login-logo">
      <img src="https://raw.githubusercontent.com/petzidgt-debug/petmi-petzid/main/logopetmi.png" alt="PetMi">
    </div>
    <div class="login-title">Portal de Afiliados</div>
    <div class="login-sub">Ingresa con el email registrado como afiliado</div>
    <div class="login-msg" id="loginMsg"></div>
    <label class="login-label">Correo electrónico</label>
    <input type="email" class="login-input" id="loginEmail" placeholder="tu@email.com" onkeydown="if(event.key==='Enter')verificarAfiliado()">
    <button class="login-btn" id="loginBtn" onclick="verificarAfiliado()">Ingresar</button>
  </div>
</div>

<!-- PORTAL -->
<div class="portal" id="portalWrap">
  <div class="portal-header">
    <div class="portal-logo">
      <img src="https://raw.githubusercontent.com/petzidgt-debug/petmi-petzid/main/logopetmi.png" alt="PetMi">
    </div>
    <button class="portal-logout" onclick="cerrarSesion()">Cerrar sesión</button>
  </div>

  <!-- Plan card -->
  <div class="plan-card" id="planCard">
    <div class="plan-badge" id="planBadge">🥈 Silver</div>
    <div class="plan-email" id="planEmail"></div>
    <div class="plan-nombre" id="planNombre">Cargando...</div>
    <div class="plan-stats">
      <div class="plan-stat">
        <div class="plan-stat-n" id="statDias">—</div>
        <div class="plan-stat-l">Días restantes</div>
      </div>
      <div class="plan-stat">
        <div class="plan-stat-n" id="statUsadas">—</div>
        <div class="plan-stat-l">Usadas este ciclo</div>
      </div>
      <div class="plan-stat">
        <div class="plan-stat-n" id="statLimite">—</div>
        <div class="plan-stat-l">Límite mensual</div>
      </div>
    </div>
  </div>

  <!-- Cuota bar -->
  <div class="cuota-wrap">
    <div class="cuota-title">
      <span>Publicaciones este ciclo</span>
      <span id="cuotaNum" style="color:#00B4B4;font-size:13px"></span>
    </div>
    <div class="cuota-bar-bg"><div class="cuota-bar" id="cuotaBar" style="width:0%"></div></div>
    <div class="cuota-label" id="cuotaLabel"></div>
    <div class="cuota-reset" id="cuotaReset"></div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab-btn act" onclick="setTab('avisos',this)">📢 Avisos</button>
    <button class="tab-btn" onclick="setTab('lugares',this)">📍 Lugares</button>
    <button class="tab-btn" onclick="setTab('eventos',this)">🎪 Eventos</button>
    <button class="tab-btn" onclick="setTab('ventas',this)">💰 Ventas</button>
  </div>

  <!-- Formulario publicar -->
  <div class="pub-form show" id="pubForm">
    <div class="pub-form-title">Nueva publicación</div>
    <div class="form-group">
      <label class="form-label">Título *</label>
      <input type="text" class="form-input" id="pubTitulo" placeholder="Ej: Promo especial para mascotas">
    </div>
    <div class="form-group">
      <label class="form-label">Descripción</label>
      <textarea class="form-textarea" id="pubDescripcion" placeholder="Describe tu publicación..."></textarea>
    </div>
    <div class="form-group" id="groupFecha" style="display:none">
      <label class="form-label">Fecha del evento</label>
      <input type="date" class="form-input" id="pubFecha">
    </div>
    <div class="form-group" id="groupPrecio" style="display:none">
      <label class="form-label">Precio (Q)</label>
      <input type="number" class="form-input" id="pubPrecio" placeholder="0.00">
    </div>
    <div class="form-group" id="groupDireccion" style="display:none">
      <label class="form-label">Dirección</label>
      <input type="text" class="form-input" id="pubDireccion" placeholder="Zona, ciudad...">
    </div>
    <button class="pub-btn" id="pubBtn" onclick="publicar()">📤 Publicar</button>
  </div>

  <!-- Mis publicaciones -->
  <div class="mis-pubs">
    <div class="mis-pubs-title">Mis publicaciones</div>
    <div id="pubsLista"><div class="spinner">Cargando...</div></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var SUPA_URL = 'https://ilcreewilnkchvozicyp.supabase.co';
var SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlsY3JlZXdpbG5rY2h2b3ppY3lwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwMDU3NTIsImV4cCI6MjA5MzU4MTc1Mn0.X5QoGsMIKU0oWd0q0qvKYxlbb1tZfMvttBxOwL0BCoM';
var H = { 'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + SUPA_KEY };

var LIMITES = { basico: 1, silver: 3, gold: 5 };
var PLAN_DIAS = { basico_mensual: 30, silver_mensual: 30, gold_mensual: 30, basico_anual: 365, silver_anual: 365, gold_anual: 365 };
var PLAN_LABELS = { basico: '🥉 Básico', silver: '🥈 Silver', gold: '🥇 Gold' };

var afiliadoEmail = '';
var afiliadoData = null;
var tabActual = 'avisos';
var publicacionesUsadas = 0;
var limiteActual = 1;
var cicloInicio = null;

// ── LOGIN ────────────────────────────────────────────────────
function verificarAfiliado() {
  var email = document.getElementById('loginEmail').value.trim().toLowerCase();
  if (!email) return mostrarMsg('Ingresa tu correo', 'error');
  var btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.textContent = 'Verificando...';
  document.getElementById('loginMsg').style.display = 'none';

  var hoy = new Date().toISOString().split('T')[0];
  fetch(SUPA_URL + '/rest/v1/actividades?es_afiliado=eq.true&afiliado_email=eq.' + encodeURIComponent(email) + '&activo=eq.true&afiliado_vence=gte.' + hoy + '&select=*&limit=1', { headers: H })
    .then(function(r) { return r.json(); })
    .then(function(rows) {
      if (!rows || !rows.length) {
        mostrarMsg('No encontramos un afiliado activo con ese correo', 'error');
        btn.disabled = false; btn.textContent = 'Ingresar'; return;
      }
      afiliadoEmail = email;
      afiliadoData = rows[0];
      sessionStorage.setItem('afiliadoEmail', email);
      cargarPortal();
    })
    .catch(function() {
      mostrarMsg('Error de conexión. Intenta de nuevo.', 'error');
      btn.disabled = false; btn.textContent = 'Ingresar';
    });
}

function mostrarMsg(txt, tipo) {
  var el = document.getElementById('loginMsg');
  el.textContent = txt; el.className = 'login-msg ' + tipo; el.style.display = 'block';
}

// ── PORTAL ───────────────────────────────────────────────────
function cargarPortal() {
  document.getElementById('loginWrap').style.display = 'none';
  document.getElementById('portalWrap').style.display = 'block';
  var d = afiliadoData;
  var plan = d.afiliado_plan || 'basico';
  var periodo = d.afiliado_periodo || 'mensual';
  var vence = new Date(d.afiliado_vence);
  var hoy = new Date();
  var dias = Math.max(0, Math.ceil((vence - hoy) / 86400000));
  var diasPlan = PLAN_DIAS[plan + '_' + periodo] || 30;
  cicloInicio = new Date(vence);
  cicloInicio.setDate(cicloInicio.getDate() - diasPlan);

  document.getElementById('planBadge').textContent = PLAN_LABELS[plan] || plan;
  document.getElementById('planEmail').textContent = afiliadoEmail;
  document.getElementById('planNombre').textContent = (d.titulo || afiliadoEmail) + ' — Plan ' + plan.charAt(0).toUpperCase() + plan.slice(1) + ' ' + periodo;
  document.getElementById('statDias').textContent = dias;
  document.getElementById('statLimite').textContent = LIMITES[plan] || 1;
  limiteActual = LIMITES[plan] || 1;

  // Calcular publicaciones usadas en ciclo actual
  contarPublicaciones();
  cargarMisPublicaciones();
}

function contarPublicaciones() {
  var inicioISO = cicloInicio ? cicloInicio.toISOString() : new Date(0).toISOString();
  fetch(SUPA_URL + '/rest/v1/actividades?afiliado_email=eq.' + encodeURIComponent(afiliadoEmail) + '&es_afiliado=eq.true&created_at=gte.' + inicioISO + '&select=id', { headers: H })
    .then(function(r) { return r.json(); })
    .then(function(rows) {
      publicacionesUsadas = (rows || []).length;
      document.getElementById('statUsadas').textContent = publicacionesUsadas;
      document.getElementById('cuotaNum').textContent = publicacionesUsadas + ' / ' + limiteActual;
      var pct = Math.min(100, Math.round((publicacionesUsadas / limiteActual) * 100));
      var bar = document.getElementById('cuotaBar');
      bar.style.width = pct + '%';
      bar.className = 'cuota-bar' + (pct >= 100 ? ' full' : pct >= 70 ? ' warning' : '');
      document.getElementById('cuotaLabel').textContent = publicacionesUsadas >= limiteActual
        ? '⚠️ Límite alcanzado — contacta a PetMi para más publicaciones'
        : 'Te quedan ' + (limiteActual - publicacionesUsadas) + ' publicación(es) este ciclo';
      if (cicloInicio) {
        var reset = new Date(cicloInicio); reset.setDate(reset.getDate() + 30);
        document.getElementById('cuotaReset').textContent = 'Próximo reset: ' + reset.toLocaleDateString('es-GT');
      }
      actualizarBtnPublicar();
    }).catch(function() {});
}

function actualizarBtnPublicar() {
  var btn = document.getElementById('pubBtn');
  if (publicacionesUsadas >= limiteActual) {
    btn.disabled = true;
    btn.className = 'pub-btn blocked';
    btn.textContent = '🚫 Límite alcanzado — contacta a PetMi';
  } else {
    btn.disabled = false;
    btn.className = 'pub-btn';
    btn.textContent = '📤 Publicar';
  }
}

// ── TABS ─────────────────────────────────────────────────────
function setTab(tab, el) {
  tabActual = tab;
  document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('act'); });
  el.classList.add('act');
  document.getElementById('groupFecha').style.display = tab === 'eventos' ? 'block' : 'none';
  document.getElementById('groupPrecio').style.display = tab === 'ventas' ? 'block' : 'none';
  document.getElementById('groupDireccion').style.display = tab === 'lugares' ? 'block' : 'none';
  document.getElementById('pubTitulo').value = '';
  document.getElementById('pubDescripcion').value = '';
}

// ── PUBLICAR ─────────────────────────────────────────────────
function publicar() {
  if (publicacionesUsadas >= limiteActual) return;
  var titulo = document.getElementById('pubTitulo').value.trim();
  var desc   = document.getElementById('pubDescripcion').value.trim();
  if (!titulo) { mostrarToast('El título es obligatorio'); return; }

  var payload = {
    tipo: tabActual,
    titulo: titulo,
    descripcion: desc,
    es_afiliado: true,
    afiliado_email: afiliadoEmail,
    afiliado_plan: afiliadoData.afiliado_plan,
    activo: true,
    pausado: false
  };
  if (tabActual === 'eventos' && document.getElementById('pubFecha').value)
    payload.fecha = document.getElementById('pubFecha').value;
  if (tabActual === 'ventas' && document.getElementById('pubPrecio').value)
    payload.precio = parseFloat(document.getElementById('pubPrecio').value);
  if (tabActual === 'lugares' && document.getElementById('pubDireccion').value)
    payload.lugar = document.getElementById('pubDireccion').value.trim();

  var btn = document.getElementById('pubBtn');
  btn.disabled = true; btn.textContent = 'Publicando...';

  fetch(SUPA_URL + '/rest/v1/actividades', {
    method: 'POST',
    headers: Object.assign({ 'Content-Type': 'application/json', 'Prefer': 'return=minimal' }, H),
    body: JSON.stringify(payload)
  }).then(function(r) {
    if (r.ok) {
      mostrarToast('✅ Publicado exitosamente');
      document.getElementById('pubTitulo').value = '';
      document.getElementById('pubDescripcion').value = '';
      publicacionesUsadas++;
      contarPublicaciones();
      cargarMisPublicaciones();
    } else {
      mostrarToast('Error al publicar. Intenta de nuevo.');
      btn.disabled = false; btn.textContent = '📤 Publicar';
    }
  }).catch(function() {
    mostrarToast('Error de conexión');
    btn.disabled = false; btn.textContent = '📤 Publicar';
  });
}

// ── MIS PUBLICACIONES ─────────────────────────────────────────
function cargarMisPublicaciones() {
  fetch(SUPA_URL + '/rest/v1/actividades?afiliado_email=eq.' + encodeURIComponent(afiliadoEmail) + '&es_afiliado=eq.true&select=id,titulo,descripcion,tipo,activo,pausado,pausado_razon,created_at&order=created_at.desc&limit=20', { headers: H })
    .then(function(r) { return r.json(); })
    .then(function(rows) {
      var lista = document.getElementById('pubsLista');
      if (!rows || !rows.length) { lista.innerHTML = '<div class="pub-empty">Aún no has publicado nada</div>'; return; }
      var TIPO_LABELS = { avisos: '📢 Aviso', lugares: '📍 Lugar', eventos: '🎪 Evento', ventas: '💰 Venta' };
      lista.innerHTML = rows.map(function(p) {
        var fecha = new Date(p.created_at).toLocaleDateString('es-GT');
        return '<div class="pub-card">'
          + '<div class="pub-card-titulo">' + p.titulo + '</div>'
          + (p.descripcion ? '<div class="pub-card-desc">' + p.descripcion + '</div>' : '')
          + '<div class="pub-card-meta">'
          + '<span class="pub-tipo">' + (TIPO_LABELS[p.tipo] || p.tipo) + '</span>'
          + '<span class="pub-fecha">' + fecha + '</span>'
          + (p.pausado ? '<span class="pub-badge-pausado">⏸ Pausado</span>' : '')
          + (!p.activo ? '<span class="pub-badge-pausado">❌ Inactivo</span>' : '')
          + '</div>'
          + (p.pausado && p.pausado_razon ? '<div class="pub-razon">Razón: ' + p.pausado_razon + '</div>' : '')
          + '</div>';
      }).join('');
    }).catch(function() {
      document.getElementById('pubsLista').innerHTML = '<div class="pub-empty">Error al cargar publicaciones</div>';
    });
}

// ── UTILS ────────────────────────────────────────────────────
function cerrarSesion() {
  sessionStorage.removeItem('afiliadoEmail');
  afiliadoEmail = ''; afiliadoData = null;
  document.getElementById('portalWrap').style.display = 'none';
  document.getElementById('loginWrap').style.display = 'flex';
  document.getElementById('loginMsg').style.display = 'none';
  document.getElementById('loginEmail').value = '';
  document.getElementById('loginBtn').disabled = false;
  document.getElementById('loginBtn').textContent = 'Ingresar';
}

function mostrarToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 3000);
}

// Auto-login si hay sesión guardada
var savedEmail = sessionStorage.getItem('afiliadoEmail');
if (savedEmail) {
  document.getElementById('loginEmail').value = savedEmail;
  verificarAfiliado();
}
</script>
</body>
</html>
