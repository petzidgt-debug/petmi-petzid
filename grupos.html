<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grupos — PetMi Guatemala</title>
<link rel="icon" href="/favico.jpg" type="image/jpeg">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Arial,sans-serif;background:#f0f0ee;min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 80px}
.page-header{margin-bottom:20px}
.page-title{font-size:24px;font-weight:900;font-family:'Arial Black',Arial;color:#222;margin-bottom:4px}
.page-sub{font-size:13px;color:#888}
.grupo-card{background:#fff;border-radius:16px;overflow:hidden;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.grupo-hero{background:#00B4B4;padding:16px;display:flex;align-items:center;gap:14px}
.grupo-avatar{width:56px;height:56px;border-radius:12px;overflow:hidden;background:rgba(255,255,255,.25);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:28px}
.grupo-avatar img{width:100%;height:100%;object-fit:cover}
.grupo-nombre{font-size:18px;font-weight:900;font-family:'Arial Black',Arial;color:#fff}
.grupo-desc{font-size:12px;color:rgba(255,255,255,.8);margin-top:2px}
.grupo-stats{display:flex;gap:16px;padding:12px 16px;border-bottom:0.5px solid #f0f0f0}
.stat{text-align:center}
.stat-n{font-size:18px;font-weight:700;color:#222}
.stat-l{font-size:10px;color:#888;text-transform:uppercase;letter-spacing:.5px}
.grupo-footer{padding:12px 16px;display:flex;gap:8px;align-items:center;justify-content:space-between}
.sponsor-tag{font-size:11px;color:#854F0B;display:flex;align-items:center;gap:4px}
.btn-ver{padding:8px 20px;background:#00B4B4;color:#fff;border:none;border-radius:999px;font-size:13px;font-weight:700;cursor:pointer;text-decoration:none}
.btn-joined{padding:8px 20px;background:#e0f7f7;color:#007a7a;border:1px solid #00B4B4;border-radius:999px;font-size:13px;font-weight:700;cursor:pointer;text-decoration:none}
.loading{text-align:center;padding:60px 20px;color:#888}
.spinner{width:36px;height:36px;border:3px solid #f0f0f0;border-top-color:#00B4B4;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.create-card{background:#fff;border-radius:16px;padding:20px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.06);margin-top:8px}
.create-icon{font-size:36px;margin-bottom:10px}
.create-title{font-size:16px;font-weight:700;color:#222;margin-bottom:6px}
.create-sub{font-size:13px;color:#888;line-height:1.6;margin-bottom:16px}
.btn-crear{padding:12px 28px;background:#00B4B4;color:#fff;border:none;border-radius:999px;font-size:14px;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<script src="/header.js"></script>
<div class="wrap">
  <div class="page-header">
    <div class="page-title">Grupos 🐕</div>
    <div class="page-sub">Comunidades de mascotas en Guatemala</div>
  </div>
  <div id="gruposWrap"><div class="loading"><div class="spinner"></div><p>Cargando grupos...</p></div></div>
  <div class="create-card">
    <div class="create-icon">🐕</div>
    <div class="create-title">¿Tu comunidad no está aquí?</div>
    <div class="create-sub">Crea el grupo de tu comunidad y conecta con dueños de mascotas que comparten tu pasión.</div>
    <button class="btn-crear" onclick="solicitarGrupo()">Solicitar nuevo grupo</button>
  </div>
</div>
<script>
var SUPA_URL='https://ilcreewilnkchvozicyp.supabase.co';
var SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlsY3JlZXdpbG5rY2h2b3ppY3lwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwMDU3NTIsImV4cCI6MjA5MzU4MTc1Mn0.X5QoGsMIKU0oWd0q0qvKYxlbb1tZfMvttBxOwL0BCoM';
var sessionEmail=localStorage.getItem('petzid_email')||'';
var misGrupos=[];

(function(){
  // Cargar mis grupos si hay sesión
  if(sessionEmail){
    fetch(SUPA_URL+'/rest/v1/miembros_grupo?email=eq.'+encodeURIComponent(sessionEmail)+'&select=grupo_id',{
      headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY}
    }).then(function(r){return r.json();})
    .then(function(m){misGrupos=(m||[]).map(function(x){return x.grupo_id;});})
    .catch(function(){});
  }
  // Cargar grupos + conteos
  Promise.all([
    fetch(SUPA_URL+'/rest/v1/grupos?activo=eq.true&select=*&order=nombre.asc',{headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY}}).then(function(r){return r.json();}),
    fetch(SUPA_URL+'/rest/v1/miembros_grupo?select=grupo_id',{headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY}}).then(function(r){return r.json();})
  ]).then(function(results){
    var grupos=results[0]||[];
    var membs=results[1]||[];
    var counts={};
    membs.forEach(function(m){counts[m.grupo_id]=(counts[m.grupo_id]||0)+1;});
    if(!grupos.length){
      document.getElementById('gruposWrap').innerHTML='<p style="text-align:center;color:#aaa;padding:40px 0">No hay grupos disponibles aún.</p>';
      return;
    }
    var html=grupos.map(function(g){
      var joined=misGrupos.indexOf(g.id)>=0;
      var cnt=counts[g.id]||0;
      var ico=g.foto&&g.foto.indexOf('http')>=0?'<img src="'+g.foto+'" alt="'+g.nombre+'">':'🐕';
      return '<div class="grupo-card">'
        +'<div class="grupo-hero" onclick="window.location.href=\'/grupos/'+g.id+'.html\'" style="cursor:pointer">'
        +'<div class="grupo-avatar">'+ico+'</div>'
        +'<div><div class="grupo-nombre">'+g.nombre+'</div>'
        +'<div class="grupo-desc">'+(g.descripcion||'')+'</div></div></div>'
        +'<div class="grupo-stats">'
        +'<div class="stat"><div class="stat-n">'+cnt+'</div><div class="stat-l">Mascotas</div></div>'
        +'</div>'
        +'<div class="grupo-footer">'
        +(g.sponsor?'<span class="sponsor-tag">⭐ '+g.sponsor+'</span>':'<span></span>')
        +'<a href="/grupos/'+g.id+'.html" class="'+(joined?'btn-joined':'btn-ver')+'">'+(joined?'Ver mi grupo':'Ver grupo')+'</a>'
        +'</div></div>';
    }).join('');
    document.getElementById('gruposWrap').innerHTML=html;
  }).catch(function(e){
    document.getElementById('gruposWrap').innerHTML='<p style="text-align:center;color:#c0392b;padding:40px 0">Error al cargar grupos.</p>';
  });
})();

function solicitarGrupo(){
  if(!sessionEmail){if(typeof petmiAbrirLogin!=='undefined')petmiAbrirLogin();return;}
  var nombre=prompt('¿Cómo se llamaría tu grupo? (Ej: Schnauzer GT)');
  if(!nombre)return;
  alert('Solicitud enviada. El equipo de PetMi revisará tu petición y te notificará. ¡Gracias!');
}
</script>
</body>
</html>
