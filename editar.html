<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link rel="icon" href="/favico.jpg" type="image/jpeg">
<title>Editar PetzID — PetMi</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Arial,sans-serif;background:#f0f0ee;font-size:16px;min-height:100vh}
.site-header{background:#fff;border-bottom:1px solid #eee;padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:60px;position:fixed;top:0;left:0;right:0;z-index:300;box-shadow:0 1px 6px rgba(0,0,0,.07)}
.header-logo img{height:40px;display:block}
.btn-volver{padding:7px 16px;border:1.5px solid #00B4B4;border-radius:20px;font-size:13px;font-weight:700;color:#00B4B4;background:#fff;cursor:pointer;text-decoration:none}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 40px}
.edit-hero{border-radius:16px;padding:20px;margin-bottom:24px;display:flex;align-items:center;gap:16px}
.edit-hero.normal{background:#00B4B4}
.edit-hero.angelito{background:linear-gradient(135deg,#667eea,#764ba2)}
.edit-foto-wrap{position:relative;width:80px;height:80px;flex-shrink:0}
.edit-foto{width:80px;height:80px;border-radius:12px;object-fit:cover;background:#b2e0e0;display:flex;align-items:center;justify-content:center;font-size:32px;border:2px solid rgba(255,255,255,.4);overflow:hidden;cursor:pointer}
.edit-foto img{width:100%;height:100%;object-fit:cover}
.edit-foto-btn{position:absolute;bottom:-4px;right:-4px;width:24px;height:24px;background:#F5C842;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;border:2px solid #fff}
.edit-hero-info{color:#fff;flex:1;min-width:0}
.edit-hero-nombre{font-size:22px;font-weight:900;font-family:'Arial Black',Arial,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.edit-hero-sub{font-size:13px;color:rgba(255,255,255,.7);margin-top:2px}
.angel-banner{background:linear-gradient(135deg,#667eea,#764ba2);border-radius:12px;padding:14px 16px;margin-bottom:16px;display:flex;align-items:center;gap:12px}
.angel-banner-txt{color:#fff;font-size:13px;line-height:1.5}
.angel-banner-txt strong{font-size:15px;display:block;margin-bottom:2px}
.seccion{background:#fff;border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.seccion-titulo{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#00B4B4;margin-bottom:16px}
.seccion-titulo.purple{color:#764ba2}
label{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#999;display:block;margin-bottom:5px;margin-top:14px}
label:first-child{margin-top:0}
input[type=text],input[type=email],input[type=date],input[type=tel],textarea,select{width:100%;padding:13px 14px;border:1.5px solid #e0e0e0;border-radius:12px;font-size:16px;color:#222;background:#fff;outline:none;transition:border .2s;-webkit-appearance:none}
input:focus,textarea:focus,select:focus{border-color:#00B4B4}
input[readonly]{background:#f5f5f5;color:#999}
textarea{resize:none;height:80px;line-height:1.5}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{padding:9px 14px;border-radius:24px;border:1.5px solid #ddd;font-size:13px;font-weight:600;color:#888;cursor:pointer;background:#fff;transition:all .15s;user-select:none;min-height:40px;display:flex;align-items:center}
.chip.sel{border-color:#00B4B4;background:#e0f7f7;color:#007a7a}
.date-toggle{display:flex;background:#f0f0ee;border-radius:12px;padding:3px;margin-top:6px}
.dt-opt{flex:1;padding:10px;text-align:center;border-radius:9px;font-size:13px;font-weight:600;color:#888;cursor:pointer;transition:all .2s}
.dt-opt.sel{background:#fff;color:#00B4B4;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0}
.toggle-lbl{font-size:14px;color:#333;padding-right:12px;font-weight:600}
.toggle{position:relative;width:44px;height:24px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0}
.tog-slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:#ddd;border-radius:24px;transition:.3s}
.tog-slider:before{position:absolute;content:"";height:18px;width:18px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.3s}
input:checked+.tog-slider{background:#00B4B4}
input:checked+.tog-slider:before{transform:translateX(20px)}
.btn-guardar{width:100%;padding:16px;background:#00B4B4;color:#fff;border:none;border-radius:14px;font-size:16px;font-weight:700;cursor:pointer;margin-top:8px}
.btn-guardar:disabled{background:#aaa;cursor:not-allowed}
.btn-cancelar{width:100%;padding:14px;background:#fff;color:#888;border:1.5px solid #ddd;border-radius:14px;font-size:15px;font-weight:600;cursor:pointer;margin-top:10px}
.loading-wrap{text-align:center;padding:60px 20px}
.spinner{width:40px;height:40px;border:3px solid #f0f0f0;border-top-color:#00B4B4;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:12px 24px;border-radius:24px;font-size:14px;font-weight:600;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.error-box{background:#fbeaf0;border:1px solid #f4c0d1;border-radius:12px;padding:14px;font-size:14px;color:#993556;margin-bottom:16px;display:none}
.btn-danger{width:100%;padding:14px;background:#fff0f0;color:#c0392b;border:1.5px solid #fcc;border-radius:14px;font-size:15px;font-weight:600;cursor:pointer;margin-top:8px}
.confirm-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);z-index:700;display:none;align-items:center;justify-content:center;padding:20px}
.confirm-overlay.open{display:flex}
.confirm-box{background:#fff;border-radius:20px;padding:28px;width:100%;max-width:360px;text-align:center}
.confirm-icon{font-size:44px;margin-bottom:12px}
.confirm-title{font-size:18px;font-weight:900;color:#222;margin-bottom:8px}
.confirm-sub{font-size:13px;color:#888;margin-bottom:24px;line-height:1.5}
.confirm-btns{display:flex;gap:10px}
</style>
</head>
<body>



<div class="wrap" id="mainWrap">
  <div class="loading-wrap" id="loadingWrap">
    <div class="spinner"></div>
    <p style="color:#888;font-size:14px">Cargando datos...</p>
  </div>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="fileInput" accept="image/*" style="display:none" onchange="onFotoChange(event)">

<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-box">
    <div class="confirm-icon">⚠️</div>
    <div class="confirm-title" id="confirmTitle">¿Eliminar mascota?</div>
    <div class="confirm-sub" id="confirmSub">Se eliminará este perfil permanentemente. Esta acción no se puede deshacer.</div>
    <div class="confirm-btns">
      <button onclick="confirmarEliminar()" style="flex:1;padding:13px;background:#c0392b;color:#fff;border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer">Sí, eliminar</button>
      <button onclick="document.getElementById('confirmOverlay').classList.remove('open')" style="flex:1;padding:13px;background:#f0f0ee;color:#666;border:none;border-radius:12px;font-size:14px;cursor:pointer">Cancelar</button>
    </div>
  </div>
</div>

<script>
var CLOUD_NAME    = 'dh5wgqgmk';
var UPLOAD_PRESET = 'petzid';
var sessionEmail  = localStorage.getItem('petzid_email') || '';
var mascota       = null;
var dateMode      = 'nac';
var nuevaFotoBase64 = null;
var nuevaFotoMime   = null;

(function(){
  if(!sessionEmail){ window.location.href='/galeria.html'; return; }
  var params = new URLSearchParams(window.location.search);
  var uid    = params.get('uid');
  if(!uid){ window.location.href='/galeria.html'; return; }

  fetch('/api/galeria?action=checkEmail',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'checkEmail',email:sessionEmail})})
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(!d.found){ window.location.href='/galeria.html'; return; }
      var uidLower=uid.trim().toLowerCase();
      mascota = d.mascotas.find(function(m){ return m.uid.trim().toLowerCase()===uidLower; });
      if(!mascota){
        // Si no encuentra por uid exacto, tomar la primera mascota del dueño
        if(d.mascotas.length>0){
          mascota=d.mascotas[0];
        } else {
          window.location.href='/galeria.html'; return;
        }
      }
      renderForm();
    })
    .catch(function(){
      document.getElementById('loadingWrap').innerHTML=
        '<p style="color:#888;text-align:center">Error al cargar. <a href="/galeria.html" style="color:#00B4B4">Volver</a></p>';
    });
})();

function renderForm(){
  var m = mascota;
  var esAngelito = m.angelito && m.angelito.toLowerCase()==='si';
  dateMode = m.tipoFecha==='llegada' ? 'casa' : 'nac';

  var fechaInput = '';
  if(m.fecha){
    var partes = String(m.fecha).split('/');
    if(partes.length===3) fechaInput=partes[2]+'-'+partes[1]+'-'+partes[0];
    else fechaInput=m.fecha;
  }

  var esGato  = m.especie.toLowerCase().indexOf('gato')>=0;
  var esMacho = m.sexo.toLowerCase().indexOf('macho')>=0;
  var fotoHTML = m.foto&&m.foto.indexOf('http')>=0
    ? '<img src="'+m.foto+'">'
    : '<span style="font-size:32px">'+(esGato?'🐱':'🐶')+'</span>';

  var heroClass = esAngelito ? 'edit-hero angelito' : 'edit-hero normal';
  var heroSub   = esAngelito ? '👼 Angelito — siempre en nuestro corazón' : 'Toca la foto para cambiarla';

  var angelBanner = esAngelito ? `
    <div class="angel-banner">
      <div style="font-size:36px">👼</div>
      <div class="angel-banner-txt">
        <strong>Perfil de angelito</strong>
        Puedes seguir actualizando los datos y la foto de ${m.nombre}. Su perfil aparecerá en la sección especial 🌈.
      </div>
    </div>` : '';

  document.getElementById('mainWrap').innerHTML = `
    <div class="${heroClass}">
      <div class="edit-foto-wrap">
        <div class="edit-foto" id="editFoto" onclick="document.getElementById('fileInput').click()">${fotoHTML}</div>
        <div class="edit-foto-btn" onclick="document.getElementById('fileInput').click()">📷</div>
      </div>
      <div class="edit-hero-info">
        <div class="edit-hero-nombre" id="heroNombre">"${m.nombre.toUpperCase()}"</div>
        <div class="edit-hero-sub">${heroSub}</div>
      </div>
    </div>

    ${angelBanner}
    <div class="error-box" id="errorBox"></div>

    <!-- Datos principales -->
    <div class="seccion">
      <div class="seccion-titulo">🐾 Datos de la mascota</div>
      <label>Nombre *</label>
      <input type="text" id="eNombre" value="${m.nombre||''}" oninput="document.getElementById('heroNombre').textContent='&quot;'+this.value.toUpperCase()+'&quot;'">
      <label>Apodo</label>
      <input type="text" id="eApodo" value="${m.apodo||''}">
      <div class="two-col">
        <div>
          <label>Especie</label>
          <div class="chips" id="chipsEspecie">
            <div class="chip ${!esGato?'sel':''}" onclick="selChip('chipsEspecie',this)">Perro</div>
            <div class="chip ${esGato?'sel':''}" onclick="selChip('chipsEspecie',this)">Gato</div>
          </div>
        </div>
        <div>
          <label>Sexo</label>
          <div class="chips" id="chipsSexo">
            <div class="chip ${!esMacho?'sel':''}" onclick="selChip('chipsSexo',this)">Hembra</div>
            <div class="chip ${esMacho?'sel':''}" onclick="selChip('chipsSexo',this)">Macho</div>
          </div>
        </div>
      </div>
      <label>Raza</label>
      <input type="text" id="eRaza" value="${m.raza||''}" placeholder="Ej: Poodle, Mestizo...">
      <label>¿Cuándo llegó a tu vida?</label>
      <div class="date-toggle">
        <div class="dt-opt ${dateMode==='nac'?'sel':''}" id="dtNac" onclick="switchDate('nac')">Fecha de nacimiento</div>
        <div class="dt-opt ${dateMode==='casa'?'sel':''}" id="dtCasa" onclick="switchDate('casa')">Llegó a casa</div>
      </div>
      <input type="date" id="eFecha" value="${fechaInput}" style="margin-top:8px">
    </div>

    <!-- Familia -->
    <div class="seccion">
      <div class="seccion-titulo">🏠 Datos del responsable</div>
      <label>Tu nombre</label>
      <input type="text" id="eDueno" value="${m.dueno||''}">
      <label>Correo electrónico</label>
      <input type="email" id="eEmail" value="${m.email||''}" readonly>
      <label>WhatsApp</label>
      <div style="display:flex;gap:8px">
        <div style="background:#f0f0ee;border:1.5px solid #e0e0e0;border-radius:12px;padding:13px 14px;font-size:16px;color:#555;white-space:nowrap">+502</div>
        <input type="tel" id="eWA" value="${(m.whatsapp||'').replace('+502','').replace('+503','')}" placeholder="####-####" inputmode="numeric" style="flex:1">
      </div>
      <label>Zona</label>
      <input type="text" id="eZona" value="${m.zona||''}" placeholder="Ej: Zona 10, Cayala...">
      <label>Veterinario</label>
      <input type="text" id="eVet" value="${m.veterinario||''}" placeholder="Nombre o clínica">
    </div>

    <!-- Gustos -->
    <div class="seccion">
      <div class="seccion-titulo">🎾 Gustos y preferencias</div>
      <label>Actividades favoritas</label>
      <div class="chips" id="chipsActividad">
        ${['Paseos','Agility','Natacion','Socializacion','Juegos en casa','Obediencia','Dog park','Grooming / spa'].map(function(a){
          var sel=m.actividades&&m.actividades.toLowerCase().indexOf(a.toLowerCase())>=0?'sel':'';
          return '<div class="chip '+sel+'" onclick="toggleChip(this)">'+a+'</div>';
        }).join('')}
      </div>
      <label>Instagram (opcional)</label>
      <input type="text" id="eInsta" value="${m.instagram||''}" placeholder="@usuario">
      <label>Alimento que consume</label>
      <input type="text" id="eAlimento" value="${m.alimento||''}" placeholder="Marca y tipo de comida">
      <label>Algo especial sobre tu mascota</label>
      <textarea id="eEspecial" placeholder="Un dato curioso, su historia...">${m.especial||''}</textarea>
      <div style="margin-top:16px;background:#fafafa;border-radius:12px;padding:14px 16px;border:1px solid #eee">
        <div style="font-size:10px;font-weight:700;color:#999;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px">Comunicaciones</div>
        <div style="font-size:12px;color:#aaa;margin-bottom:10px">¿Quieres recibir ofertas, actividades y novedades de PetMi?</div>
        <div class="toggle-row">
          <span class="toggle-lbl">Sí, quiero recibir información</span>
          <label class="toggle"><input type="checkbox" id="togOfertas" \${m.ofertas!=='No'?'checked':''}><span class="tog-slider"></span></label>
        </div>
      </div>

      <div id="notificaciones" style="margin-top:12px;background:#fafafa;border-radius:12px;padding:14px 16px;border:1px solid #eee">
        <div style="font-size:10px;font-weight:700;color:#999;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px">Notificaciones de mensajes</div>
        <div style="font-size:12px;color:#aaa;margin-bottom:10px">Recibir un email cuando alguien deje un mensaje en el perfil de tu mascota</div>
        <div class="toggle-row">
          <span class="toggle-lbl">Recibir notificaciones de mensajes</span>
          <label class="toggle"><input type="checkbox" id="togNotifMensajes" \${m.notifMensajes!=='No'?'checked':''}><span class="tog-slider"></span></label>
        </div>
      </div>
    </div>

    <!-- Angelito -->
    <div id="angelitoSection" style="margin-top:8px;border-radius:14px;padding:16px 18px;border:1.5px solid #e0e0e0;background:#fafafa">
      <div style="font-size:10px;font-weight:700;color:#764ba2;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px">🐾 Estado especial</div>
      <div style="display:flex;align-items:center;justify-content:space-between">
        <div>
          <div style="font-size:14px;font-weight:700;color:#333" id="angelitoLabel">Ya es un angelito</div>
          <div style="font-size:12px;color:#aaa" id="angelitoSub">Aparecerá en la sección especial de ángeles</div>
        </div>
        <label class="toggle"><input type="checkbox" id="togAngelito" onchange="onAngelitoChange()" '+( m.angelito&&m.angelito.toLowerCase()==="si"?"checked":"")+'><span class="tog-slider"></span></label>
      </div>
      <div id="fechaAngelWrap" style="display:'+( m.angelito&&m.angelito.toLowerCase()==="si"?"block":"none")+';margin-top:12px">
        <div style="font-size:10px;font-weight:700;color:#999;text-transform:uppercase;letter-spacing:1px;margin-bottom:5px">Fecha en que nos dejó</div>
        <input type="date" id="eFechaAngel" value="'+( m.angelito&&m.fechaAngel?m.fechaAngel:"")+'" style="width:100%;padding:11px 14px;border:1.5px solid #e0e0e0;border-radius:12px;font-size:15px;outline:none">
      </div>
    </div>

    <button class="btn-guardar" id="btnGuardar" onclick="guardar()">💾 Guardar cambios</button>
    <button class="btn-cancelar" onclick="window.location.href='/galeria.html'">Cancelar</button>
    <button class="btn-danger" onclick="document.getElementById('confirmOverlay').classList.add('open')">🗑️ Eliminar esta mascota</button>
    <div style="height:20px"></div>
  `;
}

function selChip(gid,el){
  document.querySelectorAll('#'+gid+' .chip').forEach(function(c){c.classList.remove('sel');});
  el.classList.add('sel');
}
function toggleChip(el){el.classList.toggle('sel');}
function getChip(gid){var el=document.querySelector('#'+gid+' .chip.sel');return el?el.textContent.trim():'';}
function getChips(gid){return Array.from(document.querySelectorAll('#'+gid+' .chip.sel')).map(function(c){return c.textContent.trim();});}
function switchDate(mode){
  dateMode=mode;
  document.getElementById('dtNac').classList.toggle('sel',mode==='nac');
  document.getElementById('dtCasa').classList.toggle('sel',mode==='casa');
}

function onFotoChange(e){
  var file=e.target.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(ev){
    document.getElementById('editFoto').innerHTML='<img src="'+ev.target.result+'" style="width:80px;height:80px;object-fit:cover">';
    compressPhoto(ev.target.result,file.type);
  };
  reader.readAsDataURL(file);
}

function compressPhoto(dataUrl,mime){
  var canvas=document.createElement('canvas'),img=new Image();
  img.onload=function(){
    var MAX=800,w=img.width,h=img.height;
    if(w>MAX){h=h*(MAX/w);w=MAX;}
    if(h>MAX){w=w*(MAX/h);h=MAX;}
    canvas.width=w;canvas.height=h;
    canvas.getContext('2d').drawImage(img,0,0,w,h);
    nuevaFotoBase64=canvas.toDataURL('image/jpeg',0.8).split(',')[1];
    nuevaFotoMime='image/jpeg';
  };
  img.src=dataUrl;
}

async function uploadToCloudinary(base64,mime){
  var fd=new FormData();
  fd.append('file','data:'+mime+';base64,'+base64);
  fd.append('upload_preset',UPLOAD_PRESET);
  fd.append('folder','petzid');
  var res=await fetch('https://api.cloudinary.com/v1_1/'+CLOUD_NAME+'/image/upload',{method:'POST',body:fd});
  var data=await res.json();
  return data.secure_url||null;
}

async function guardar(){
  var btn=document.getElementById('btnGuardar');
  var err=document.getElementById('errorBox');
  err.style.display='none';
  var nombre=document.getElementById('eNombre').value.trim();
  if(!nombre){mostrarError('El nombre es obligatorio.');return;}
  btn.disabled=true;btn.textContent='Guardando...';

  var fotoUrl=null;
  if(nuevaFotoBase64){
    btn.textContent='Subiendo foto...';
    try{fotoUrl=await uploadToCloudinary(nuevaFotoBase64,nuevaFotoMime);}catch(e){console.log('Cloudinary:',e);}
  }

  var wa=document.getElementById('eWA').value.trim();
  if(wa&&!wa.startsWith('+'))wa='+502'+wa;

  var payload={
    action:'updateRow',
    uid:mascota.uid,
    data:{
      nombre:      nombre,
      apodo:       document.getElementById('eApodo').value.trim(),
      especie:     getChip('chipsEspecie'),
      sexo:        getChip('chipsSexo'),
      raza:        document.getElementById('eRaza').value.trim(),
      tipoFecha:   dateMode==='casa'?'llegada':'nacimiento',
      fecha:       document.getElementById('eFecha').value,
      dueno:       document.getElementById('eDueno').value.trim(),
      whatsapp:    wa,
      zona:        document.getElementById('eZona').value.trim(),
      veterinario: document.getElementById('eVet').value.trim(),
      actividades: getChips('chipsActividad').join(', '),
      instagram:   document.getElementById('eInsta').value.trim(),
      alimento:    document.getElementById('eAlimento').value.trim(),
      especial:    document.getElementById('eEspecial').value.trim(),
      ofertas:        document.getElementById('togOfertas').checked?'Si':'No',
      notifMensajes:  document.getElementById('togNotifMensajes')?document.getElementById('togNotifMensajes').checked?'Si':'No':'Si'
    }
  };
  if(fotoUrl)payload.data.foto=fotoUrl;

  btn.textContent='Guardando...';
  var esAngelito = document.getElementById('togAngelito').checked;
  var fechaAngel = document.getElementById('eFechaAngel').value||'';

  // Guardar datos principales
  fetch('/api/admin?action=updateRow',{
    method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)
  }).then(function(r){return r.json();})
  .then(function(d){
    if(!d.ok){mostrarError('Error al guardar. Intenta de nuevo.');btn.disabled=false;btn.textContent='💾 Guardar cambios';return;}
    // Luego actualizar estado angelito
    return fetch('/api/admin?action=updateRow',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({action:'markAngel',uid:mascota.uid,esAngel:esAngelito,fechaAngelito:fechaAngel})
    });
  }).then(function(r){
    if(r) return r.json();
  }).then(function(){
    mostrarToast('✅ Cambios guardados!');
    setTimeout(function(){window.location.href='/familia.html';},1500);
  }).catch(function(){
    mostrarError('Error de conexión. Intenta de nuevo.');btn.disabled=false;btn.textContent='💾 Guardar cambios';
  });
}

function onAngelitoChange(){
  var checked=document.getElementById('togAngelito').checked;
  var wrap=document.getElementById('fechaAngelWrap');
  if(wrap) wrap.style.display=checked?'block':'none';
  if(checked){
    var today=new Date().toISOString().split('T')[0];
    document.getElementById('eFechaAngel').value=today;
  }
}

function mostrarError(msg){var el=document.getElementById('errorBox');if(el){el.textContent=msg;el.style.display='block';}}
function mostrarToast(msg){var el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(function(){el.classList.remove('show');},2500);}

function confirmarEliminar(){
  document.getElementById('confirmOverlay').classList.remove('open');
  if(!mascota||!mascota.uid){mostrarError('No se pudo identificar la mascota.');return;}

  fetch('/api/admin?action=updateRow',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({action:'deleteMascota',uid:mascota.uid})
  }).then(function(r){return r.json();})
  .then(function(d){
    if(d.ok){
      mostrarToast('Mascota eliminada');
      setTimeout(function(){window.location.href='/familia.html';},1500);
    } else {
      mostrarError('Error al eliminar. Intenta de nuevo.');
    }
  }).catch(function(){
    mostrarError('Error de conexión. Intenta de nuevo.');
  });
}
</script>
<script src="/header.js"></script>
</body>
