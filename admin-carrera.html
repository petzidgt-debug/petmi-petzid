<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — Carrera Alas de Esperanza</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f8f7f4;min-height:100vh}

.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#1a1a2e}
.login-box{background:#fff;border-radius:16px;padding:40px;width:100%;max-width:360px;box-shadow:0 8px 32px rgba(0,0,0,.15)}
.login-logo{font-size:24px;font-weight:900;text-align:center;margin-bottom:8px;color:#1a1a2e}
.login-sub{text-align:center;font-size:13px;color:#888;margin-bottom:24px}
.login-box input{width:100%;padding:12px 14px;border:1.5px solid #e0e0e0;border-radius:10px;font-size:15px;margin-bottom:12px;outline:none}
.login-btn{width:100%;padding:13px;background:#F5941C;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer}
.login-err{color:#c0392b;font-size:13px;text-align:center;margin-top:8px;display:none}

.app-wrap{display:none}
.topbar{background:#1a1a2e;padding:18px 24px;display:flex;justify-content:space-between;align-items:center}
.topbar-title{color:#fff;font-size:17px;font-weight:900}
.topbar a{color:#F5C842;font-size:12.5px;font-weight:700;text-decoration:none}

.content{padding:20px 24px 60px}
.table-card{background:#fff;border-radius:14px;border:0.5px solid #eee;overflow:hidden}
table{min-width:1000px;width:max-content;border-collapse:collapse;font-size:13px}
.table-wrap{overflow-x:auto;scrollbar-width:auto;-webkit-overflow-scrolling:touch}
.table-wrap::-webkit-scrollbar{height:10px}
.table-wrap::-webkit-scrollbar-thumb{background:#ccc;border-radius:5px}
.table-wrap::-webkit-scrollbar-track{background:#f2f2f2}
.scroll-top{overflow-x:auto;overflow-y:hidden;height:14px;border-bottom:1px solid #eee}
.scroll-top::-webkit-scrollbar{height:10px}
.scroll-top::-webkit-scrollbar-thumb{background:#ccc;border-radius:5px}
.scroll-top::-webkit-scrollbar-track{background:#f2f2f2}
.scroll-top > div{height:1px}

th.congelada, td.congelada{position:sticky;background:#fff;z-index:2}
th.congelada{background:#f8f7f4;z-index:3}
.col1{left:0;width:150px;min-width:150px;max-width:150px}
.col2{left:150px;width:130px;min-width:130px;max-width:130px}
.col3{left:280px;width:120px;min-width:120px;max-width:120px;box-shadow:2px 0 4px rgba(0,0,0,.06)}
th{background:#f8f7f4;padding:10px 14px;text-align:left;font-size:11px;color:#888;text-transform:uppercase;letter-spacing:0.5px;white-space:nowrap}
td{padding:10px 14px;border-top:1px solid #f2f2f2;white-space:nowrap}
.btn-mini{background:#1a1a2e;color:#fff;border:none;padding:6px 9px;border-radius:8px;font-size:13px;cursor:pointer}
.search-box{width:100%;max-width:320px;padding:10px 14px;border:1.5px solid #ddd;border-radius:10px;font-size:13px;margin-bottom:14px}
.stat-row{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.stat-card{background:#fff;border-radius:12px;border:0.5px solid #eee;padding:14px 18px;flex:1;min-width:130px}
.stat-num{font-size:22px;font-weight:900;color:#1a1a2e}
.stat-lbl{font-size:11px;color:#888;text-transform:uppercase}
.badge-si{background:#E0F7F7;color:#006060;font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px}
.badge-premio{background:#F5C842;color:#1a1a2e;font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px}
</style>
</head>
<body>

<div class="login-wrap" id="loginWrap">
  <div class="login-box">
    <div class="login-logo">🏃 Admin Carrera</div>
    <div class="login-sub">Alas de Esperanza — reservas de bandana</div>
    <input type="password" id="loginPass" placeholder="Contraseña" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="login-btn" onclick="doLogin()">Ingresar</button>
    <div class="login-err" id="loginErr">Contraseña incorrecta</div>
  </div>
</div>

<div class="app-wrap" id="appWrap">
  <div class="topbar">
    <div class="topbar-title">🏃 Carrera Alas de Esperanza — Admin</div>
    <a href="/ruleta-carrera-sorteo.html">🎡 Ir al sorteo →</a>
  </div>

  <div class="content">
    <div class="stat-row">
      <div class="stat-card"><div class="stat-num" id="statTotal">–</div><div class="stat-lbl">Total reservas</div></div>
      <div class="stat-card"><div class="stat-num" id="statPetzid">–</div><div class="stat-lbl">Con PetzID (25%)</div></div>
      <div class="stat-card"><div class="stat-num" id="statEntregadas">–</div><div class="stat-lbl">Bandanas entregadas</div></div>
      <div class="stat-card"><div class="stat-num" id="statGanadores">–</div><div class="stat-lbl">Ganadores del sorteo</div></div>
    </div>
    <input type="text" class="search-box" id="buscar" placeholder="Buscar por nombre, teléfono o mascota..." oninput="filtrar()">
    <div class="table-card">
      <div class="scroll-top" id="scrollTop"><div id="scrollTopInner"></div></div>
      <div class="table-wrap" id="tableWrap">
        <table>
          <thead><tr>
            <th class="congelada col1" style="cursor:pointer" onclick="ordenarPor('nombre')">Nombre ⇅</th>
            <th class="congelada col2" style="cursor:pointer" onclick="ordenarPor('telefono')">Teléfono ⇅</th>
            <th class="congelada col3" style="cursor:pointer" onclick="ordenarPor('nombre_mascota')">Mascota ⇅</th>
            <th>Correo</th><th>PetzID</th><th>Descuento</th><th>Cupón</th><th>Premio</th><th>Bandana</th><th></th>
          </tr></thead>
          <tbody id="filasBody"><tr><td colspan="10" style="text-align:center;padding:20px;color:#aaa">Cargando...</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
var PASSWORD = 'petmi2024';
var reservas = [];

function doLogin(){
  var pass = document.getElementById('loginPass');
  if(pass.value === PASSWORD){
    localStorage.setItem('carrera_admin', '1');
    document.getElementById('loginWrap').style.display = 'none';
    document.getElementById('appWrap').style.display = 'block';
    cargar();
  } else {
    document.getElementById('loginErr').style.display = 'block';
  }
}
if(localStorage.getItem('carrera_admin') === '1'){
  document.getElementById('loginWrap').style.display = 'none';
  document.getElementById('appWrap').style.display = 'block';
  cargar();
}

function cargar(){
  fetch('/api/galeria?action=getCarreraReservas')
  .then(function(r){return r.json();})
  .then(function(d){
    reservas = d.reservas || [];
    render(reservas);
  }).catch(function(){
    document.getElementById('filasBody').innerHTML = '<tr><td colspan="10" style="text-align:center;color:#c0392b">Error al cargar — ¿corriste el SQL de carrera_reservas?</td></tr>';
  });
}

function render(lista){
  document.getElementById('statTotal').textContent = reservas.length;
  document.getElementById('statPetzid').textContent = reservas.filter(function(r){return r.tiene_petzid;}).length;
  document.getElementById('statEntregadas').textContent = reservas.filter(function(r){return r.bandana_entregada;}).length;
  document.getElementById('statGanadores').textContent = reservas.filter(function(r){return r.premio;}).length;

  if(!lista.length){
    document.getElementById('filasBody').innerHTML = '<tr><td colspan="10" style="text-align:center;padding:20px;color:#aaa">Sin resultados</td></tr>';
    return;
  }
  document.getElementById('filasBody').innerHTML = lista.map(function(r){
    var petzidHtml = r.tiene_petzid ? '<span class="badge-si">✓ Sí</span>' : '—';
    var premioHtml = r.premio ? '<span class="badge-premio">🏆 '+r.premio+'</span>' : '—';
    return '<tr><td class="congelada col1">'+(r.nombre||'—')+'</td><td class="congelada col2">'+r.telefono+'</td><td class="congelada col3">'+(r.nombre_mascota||'—')+'</td>'
      + '<td>'+(r.email||'—')+'</td><td>'+petzidHtml+'</td><td>'+r.descuento_pct+'%</td><td style="font-family:monospace;font-size:11.5px">'+(r.codigo_cupon||'—')+'</td>'
      + '<td>'+premioHtml+'</td>'
      + '<td style="text-align:center"><input type="checkbox" '+(r.bandana_entregada?'checked':'')+' onchange="marcarEntregada(\''+r.id+'\',this.checked)" style="width:16px;height:16px;cursor:pointer"></td>'
      + '<td><button class="btn-mini" style="background:#c0392b" onclick="eliminarReserva(\''+r.id+'\')" title="Eliminar">🗑️</button></td></tr>';
  }).join('');
}

var ordenActual = { campo:null, asc:true };
function ordenarPor(campo){
  if(ordenActual.campo === campo) ordenActual.asc = !ordenActual.asc;
  else { ordenActual.campo = campo; ordenActual.asc = true; }
  var copia = reservas.slice().sort(function(a,b){
    var va = (a[campo]||'').toString().toLowerCase();
    var vb = (b[campo]||'').toString().toLowerCase();
    if(va<vb) return ordenActual.asc?-1:1;
    if(va>vb) return ordenActual.asc?1:-1;
    return 0;
  });
  render(copia);
}

function filtrar(){
  var q = document.getElementById('buscar').value.trim().toLowerCase();
  if(!q){ render(reservas); return; }
  render(reservas.filter(function(r){
    return (r.nombre||'').toLowerCase().indexOf(q)>=0 || (r.telefono||'').indexOf(q)>=0 || (r.nombre_mascota||'').toLowerCase().indexOf(q)>=0;
  }));
}

function marcarEntregada(id, entregada){
  var r = reservas.find(function(x){return String(x.id)===String(id);});
  if(r) r.bandana_entregada = entregada;
  fetch('/api/galeria?action=marcarBandanaEntregada', {
    method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ id:id, entregada:entregada })
  }).then(function(){ render(reservas); }).catch(function(){ alert('No se pudo guardar. Intenta de nuevo.'); });
}

function eliminarReserva(id){
  var r = reservas.find(function(x){return String(x.id)===String(id);});
  var nombre = r ? (r.nombre||r.telefono) : id;
  if(!confirm('¿Eliminar la reserva de "'+nombre+'"? Esto no se puede deshacer.')) return;
  fetch('/api/galeria?action=eliminarReservaCarrera', {
    method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ id:id })
  }).then(function(){ cargar(); }).catch(function(){ alert('No se pudo eliminar. Intenta de nuevo.'); });
}

function conectarScrollArriba(){
  var scrollTop = document.getElementById('scrollTop');
  var inner = document.getElementById('scrollTopInner');
  var wrap = document.getElementById('tableWrap');
  function actualizarAncho(){
    var tabla = wrap.querySelector('table');
    if(tabla) inner.style.width = tabla.scrollWidth + 'px';
  }
  actualizarAncho();
  new MutationObserver(actualizarAncho).observe(wrap, { childList:true, subtree:true });
  scrollTop.addEventListener('scroll', function(){ wrap.scrollLeft = scrollTop.scrollLeft; });
  wrap.addEventListener('scroll', function(){ scrollTop.scrollLeft = wrap.scrollLeft; });
}
conectarScrollArriba();
</script>
</body>
</html>
