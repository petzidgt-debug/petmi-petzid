<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link rel="icon" href="/favico.jpg" type="image/jpeg">
<title>Amigo de la Semana — PetMi</title>
<meta property="og:title" content="Amigo de la Semana — PetMi">
<meta property="og:description" content="Cada semana celebramos a un miembro de la comunidad PetMi.">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Arial,sans-serif;background:#f0f0ee;min-height:100vh}
.wrap{max-width:600px;margin:0 auto;padding:0 16px 60px}

.titulo-pagina{text-align:center;padding:32px 0 8px}
.titulo-pagina h1{font-size:26px;font-weight:900;color:#1a1a2e}
.titulo-pagina p{font-size:13px;color:#888;margin-top:6px}

/* TARJETA ACTUAL — grande */
.actual-card{background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 8px 28px rgba(0,0,0,.12);margin-bottom:36px}
.actual-foto-wrap{width:100%;height:280px;position:relative;overflow:hidden}
.actual-foto-wrap img{width:100%;height:100%;object-fit:cover;object-position:center;display:block}
.actual-foto-wrap .ph{width:100%;height:100%;background:#e8ddd0;display:flex;align-items:center;justify-content:center;font-size:80px}
.actual-badge{position:absolute;top:16px;left:16px;background:#F5C842;color:#1a1a2e;font-size:12px;font-weight:900;padding:7px 16px;border-radius:99px}
.actual-body{padding:22px 24px 28px}
.actual-nombre{font-size:28px;font-weight:900;color:#1a1a2e}
.actual-apodo{display:inline-block;margin-top:8px;background:#F4A0B0;color:#7a1a2e;font-size:12px;font-weight:700;padding:4px 14px;border-radius:99px}
.actual-info{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:20px}
.actual-info-lbl{font-size:10px;font-weight:700;color:#999;text-transform:uppercase;letter-spacing:.3px}
.actual-info-val{font-size:15px;font-weight:700;color:#1a1a2e;margin-top:3px}
.actual-tags-titulo{font-size:10px;font-weight:700;color:#999;text-transform:uppercase;letter-spacing:.3px;margin:20px 0 10px}
.actual-tag{display:inline-block;background:#E0F7F7;color:#007a7a;font-size:12px;font-weight:700;padding:5px 14px;border-radius:99px;margin:0 6px 6px 0}
.actual-especial{background:#f8f8f8;border-left:4px solid #F5C842;border-radius:0 12px 12px 0;padding:14px 18px;margin-top:20px}
.actual-especial-lbl{font-size:10px;font-weight:700;color:#999;text-transform:uppercase;letter-spacing:.3px;margin-bottom:5px}
.actual-especial-txt{font-size:14px;color:#333;line-height:1.6;word-break:break-word}
.actual-btns{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.actual-cta{flex:1;min-width:150px;text-align:center;background:#00B4B4;color:#fff;text-decoration:none;padding:13px 20px;border-radius:99px;font-weight:700;font-size:14px}
.actual-agregar{flex:1;min-width:150px;text-align:center;background:#F5C842;color:#1a1a2e;border:none;padding:13px 20px;border-radius:99px;font-weight:700;font-size:14px;cursor:pointer}
.actual-agregar:disabled{opacity:.6;cursor:default}

/* HISTORIAL */
.historial-titulo{font-size:16px;font-weight:900;color:#1a1a2e;margin-bottom:14px}
.historial-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
.hist-card{background:#fff;border-radius:14px;padding:14px 10px;text-align:center;text-decoration:none;box-shadow:0 1px 6px rgba(0,0,0,.08);transition:transform .12s}
.hist-card:hover{transform:translateY(-2px)}
.hist-foto{width:64px;height:64px;border-radius:50%;object-fit:cover;margin:0 auto 8px;display:block;background:#e8ddd0}
.hist-foto-ph{width:64px;height:64px;border-radius:50%;background:#e8ddd0;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font-size:28px}
.hist-nombre{font-size:13px;font-weight:700;color:#1a1a2e}
.hist-fecha{font-size:10px;color:#aaa;margin-top:2px}

.vacio{text-align:center;padding:50px 20px;color:#aaa}
.vacio-ico{font-size:48px;margin-bottom:12px}
</style>
</head>
<body>

<div class="wrap">
  <div class="titulo-pagina">
    <h1 id="tituloPagina">🎲 Amigo de la Semana</h1>
    <p>Cada semana celebramos a un miembro de la comunidad PetMi</p>
  </div>

  <div id="contenedorActual"></div>

  <div id="contenedorHistorial"></div>
</div>

<script>
var sessionEmailVisitante=localStorage.getItem('petzid_email')||'';
var miUidVisitante=null;
var miNombreVisitante='';
if(sessionEmailVisitante){
  fetch('/api/galeria?action=checkEmail',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({action:'checkEmail',email:sessionEmailVisitante})
  }).then(function(r){return r.json();})
  .then(function(d){
    if(d.found && d.mascotas && d.mascotas.length){
      miUidVisitante=d.mascotas[0].uid;
      miNombreVisitante=d.mascotas[0].nombre||'';
    }
  }).catch(function(){});
}

function especieEmoji(especie){
  var e=(especie||'').toLowerCase();
  if(e.indexOf('gato')>=0) return '🐱';
  if(e.indexOf('perro')>=0) return '🐕';
  return '🐾';
}

function fechaCorta(iso){
  try{ return new Date(iso).toLocaleDateString('es-GT',{day:'2-digit',month:'short',year:'numeric'}); }
  catch(e){ return ''; }
}

function calcularEdadTexto(fechaStr){
  if(!fechaStr) return '—';
  try{
    var fecha=new Date(fechaStr), hoy=new Date();
    var meses=(hoy.getFullYear()-fecha.getFullYear())*12+(hoy.getMonth()-fecha.getMonth());
    if(meses<1) return 'Recién nacido';
    if(meses<12) return meses+' mes'+(meses!==1?'es':'');
    var anios=Math.floor(meses/12);
    return anios+' año'+(anios!==1?'s':'');
  }catch(e){ return '—'; }
}

function agregarAmigoDestacado(uidReceptor, emailReceptor, nombreReceptor){
  if(!sessionEmailVisitante){
    alert('Inicia sesión en PetMi para agregar amigos.');
    window.location.href='/index.html';
    return;
  }
  if(!miUidVisitante){
    alert('Un momento — todavía estamos cargando tu sesión. Intenta de nuevo en unos segundos.');
    return;
  }
  var btn=document.getElementById('btnAgregarAmigo');
  if(btn){ btn.disabled=true; btn.textContent='Enviando...'; }
  fetch('/api/galeria?action=enviarSolicitud',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({uid_solicitante:miUidVisitante, uid_receptor:uidReceptor, email_solicitante:sessionEmailVisitante, email_receptor:emailReceptor})
  }).then(function(r){return r.json();})
  .then(function(d){
    if(d && d.ok){
      if(btn){ btn.textContent='✓ Solicitud enviada'; }
      fetch('/api/submit',{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({action:'notificarSolicitud',emailReceptor:emailReceptor,nombreSolicit:miNombreVisitante,nombreReceptor:nombreReceptor})
      }).catch(function(){});
    } else {
      if(btn){ btn.disabled=false; btn.textContent='➕ Agregar amigo'; }
      alert('No se pudo enviar la solicitud. Intenta de nuevo.');
    }
  }).catch(function(){
    if(btn){ btn.disabled=false; btn.textContent='➕ Agregar amigo'; }
    alert('No se pudo enviar la solicitud. Intenta de nuevo.');
  });
}

fetch('/api/galeria?action=getAmigoSemanaHistorial')
.then(function(r){return r.json();})
.then(function(d){
  var historial = (d && d.historial) || [];
  if(!historial.length){
    document.getElementById('contenedorActual').innerHTML =
      '<div class="vacio"><div class="vacio-ico">🎲</div><div>Todavía no se ha elegido ningún Amigo de la Semana.</div></div>';
    return;
  }

  var actual = historial[0];
  var anteriores = historial.slice(1);

  var fotoHtml = actual.foto && actual.foto.indexOf('http')>=0
    ? '<img src="'+actual.foto+'" alt="'+actual.nombre+'">'
    : '<div class="ph">'+especieEmoji(actual.especie)+'</div>';

  var actividadesArr=(actual.actividades||'').split(',').map(function(a){return a.trim();}).filter(Boolean);
  var actividadesHtml = actividadesArr.length
    ? '<div class="actual-tags-titulo">LE GUSTA</div><div>'+actividadesArr.map(function(a){return '<span class="actual-tag">'+a+'</span>';}).join('')+'</div>'
    : '';

  document.getElementById('tituloPagina').textContent = '👋 Conoce a "'+actual.nombre+'" — nuestro amigo de la semana 🎉';

  document.getElementById('contenedorActual').innerHTML =
    '<div class="actual-card">'
    +'<div class="actual-foto-wrap">'+fotoHtml+'<div class="actual-badge">🎲 AMIGO DE ESTA SEMANA</div></div>'
    +'<div class="actual-body">'
    +'<div class="actual-nombre">"'+actual.nombre.toUpperCase()+'"</div>'
    +(actual.apodo?'<div><span class="actual-apodo">'+actual.apodo+'</span></div>':'')
    +'<div class="actual-info">'
      +'<div><div class="actual-info-lbl">ESPECIE</div><div class="actual-info-val">'+(actual.especie||'—')+'</div></div>'
      +'<div><div class="actual-info-lbl">SEXO</div><div class="actual-info-val">'+(actual.sexo||'—')+'</div></div>'
      +'<div><div class="actual-info-lbl">EDAD</div><div class="actual-info-val">'+calcularEdadTexto(actual.fechaNac)+'</div></div>'
    +'</div>'
    +actividadesHtml
    +(actual.especial ? '<div class="actual-especial"><div class="actual-especial-lbl">ALGO ESPECIAL</div><div class="actual-especial-txt">'+actual.especial+'</div></div>' : '')
    +'<div class="actual-btns">'
    +'<button id="btnAgregarAmigo" class="actual-agregar" style="flex:none;width:100%" onclick="agregarAmigoDestacado(\''+actual.uid+'\',\''+(actual.email||'')+'\',\''+actual.nombre.replace(/'/g,"\\'")+'\')">➕ Agregar amigo</button>'
    +'</div>'
    +'</div>'
    +'</div>';

  if(anteriores.length){
    var html = '<div class="historial-titulo">Amigos anteriores</div><div class="historial-grid">';
    anteriores.forEach(function(a){
      var foto = a.foto && a.foto.indexOf('http')>=0
        ? '<img class="hist-foto" src="'+a.foto+'" alt="'+a.nombre+'">'
        : '<div class="hist-foto-ph">'+especieEmoji(a.especie)+'</div>';
      html += '<a href="/p/'+encodeURIComponent(a.slug)+'" class="hist-card">'
        + foto
        + '<div class="hist-nombre">'+a.nombre+'</div>'
        + '<div class="hist-fecha">'+fechaCorta(a.fecha)+'</div>'
        + '</a>';
    });
    html += '</div>';
    document.getElementById('contenedorHistorial').innerHTML = html;
  }
}).catch(function(){
  document.getElementById('contenedorActual').innerHTML =
    '<div class="vacio"><div class="vacio-ico">😕</div><div>No se pudo cargar. Intenta de nuevo.</div></div>';
});
</script>
<script src="/header.js"></script>
</body>
</html>
