<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link rel="icon" href="/favico.jpg" type="image/jpeg">
<title>Mensajes — PetMi</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Arial,sans-serif;background:#f0f0ee;min-height:100vh}
.wrap{max-width:520px;margin:0 auto;min-height:100vh;background:#fff}

/* Encabezado unificado */
.hero{background:linear-gradient(135deg,#00B4B4,#00838f);padding:32px 20px;text-align:center}
.hero h1{font-size:24px;font-weight:900;color:#fff;font-family:'Arial Black',Arial,sans-serif;margin-bottom:4px}
.hero p{font-size:13.5px;color:rgba(255,255,255,.8)}

/* Lista de conversaciones */
.conv-item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid #f5f5f5;cursor:pointer}
.conv-item:hover{background:#fafafa}
.conv-foto{width:50px;height:50px;border-radius:50%;object-fit:cover;flex-shrink:0;background:#e0f7f7}
.conv-foto-ph{width:50px;height:50px;border-radius:50%;background:#e0f7f7;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.conv-info{flex:1;min-width:0}
.conv-nombre{font-size:14px;font-weight:700;color:#222;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv-preview{font-size:13px;color:#888;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.conv-preview.no-leido{color:#222;font-weight:700}
.conv-meta{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
.conv-hora{font-size:11px;color:#bbb}
.conv-badge{background:#00B4B4;color:#fff;font-size:10px;font-weight:700;border-radius:99px;padding:2px 7px;min-width:18px;text-align:center}

.vacio{text-align:center;padding:60px 20px;color:#aaa}
.vacio-ico{font-size:56px;margin-bottom:14px}
.vacio-titulo{font-size:16px;font-weight:700;color:#666;margin-bottom:6px}
.vacio-sub{font-size:13px;color:#aaa;line-height:1.6}

/* Vista de chat */
.chat-view{display:none;flex-direction:column;height:100vh}
.chat-header{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid #eee;position:sticky;top:0;background:#fff;z-index:10}
.chat-back{background:none;border:none;font-size:20px;cursor:pointer;color:#555;padding:4px}
.chat-foto{width:38px;height:38px;border-radius:50%;object-fit:cover;background:#e0f7f7}
.chat-foto-ph{width:38px;height:38px;border-radius:50%;background:#e0f7f7;display:flex;align-items:center;justify-content:center;font-size:18px}
.chat-nombre{font-size:15px;font-weight:700;color:#222}
.chat-lista{flex:1;overflow-y:auto;padding:16px}
.chat-input-bar{display:flex;gap:8px;padding:12px 16px;border-top:1px solid #eee;background:#fff}
.chat-input{flex:1;border:1.5px solid #e0e0e0;border-radius:20px;padding:10px 16px;font-size:14px;outline:none}
.chat-input:focus{border-color:#00B4B4}
.chat-send{background:#00B4B4;color:#fff;border:none;border-radius:50%;width:40px;height:40px;font-size:16px;cursor:pointer;flex-shrink:0}

.spinner-wrap{min-height:50vh;display:flex;align-items:center;justify-content:center}
.spinner{width:36px;height:36px;border:3px solid #f0f0f0;border-top-color:#00B4B4;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="wrap">
  <div id="listView">
    <div class="hero"><h1>💬 Mensajes</h1><p>Tus conversaciones con la comunidad PetMi</p></div>
    <div id="listaConversaciones"><div class="spinner-wrap"><div class="spinner"></div></div></div>
  </div>

  <div class="chat-view" id="chatView">
    <div class="chat-header">
      <button class="chat-back" onclick="volverALista()">←</button>
      <div id="chatFotoWrap"></div>
      <div class="chat-nombre" id="chatNombre"></div>
    </div>
    <div class="chat-lista" id="chatLista"></div>
    <div class="chat-input-bar">
      <input type="text" class="chat-input" id="chatInput" placeholder="Escribe un mensaje..." onkeydown="if(event.key==='Enter')enviarDesdeChatInput()">
      <button class="chat-send" onclick="enviarDesdeChatInput()">➤</button>
    </div>
  </div>
</div>

<script>
var SB_URL='https://ilcreewilnkchvozicyp.supabase.co';
var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlsY3JlZXdpbG5rY2h2b3ppY3lwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwMDU3NTIsImV4cCI6MjA5MzU4MTc1Mn0.X5QoGsMIKU0oWd0q0qvKYxlbb1tZfMvttBxOwL0BCoM';

var sessionEmail=localStorage.getItem('petzid_email')||'';
var miMascotaUID=null;
var miNombre=localStorage.getItem('petzid_dueno')||'';
var conversaciones=[];
var chatActivo=null; // {otroUid, otroNombre, otroEmail}

if(!sessionEmail){
  document.getElementById('listaConversaciones').innerHTML='<div class="vacio"><div class="vacio-ico">🔒</div><div class="vacio-titulo">Inicia sesión para ver tus mensajes</div><div class="vacio-sub">Entra con tu cuenta de PetMi desde el botón de arriba.</div></div>';
} else {
  init();
}

function init(){
  fetch('/api/galeria?action=checkEmail',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'checkEmail',email:sessionEmail})})
  .then(function(r){return r.json();})
  .then(function(d){
    if(!d.found||!d.mascotas.length){
      document.getElementById('listaConversaciones').innerHTML='<div class="vacio"><div class="vacio-ico">🐾</div><div class="vacio-titulo">No encontramos mascotas en tu cuenta</div></div>';
      return;
    }
    miMascotaUID=d.mascotas[0].uid;
    var params=new URLSearchParams(window.location.search);
    var abrirUid=params.get('abrir');
    var abrirNombre=params.get('nombre');
    if(abrirUid){
      // Viene desde "Amigos" con un amigo específico — abrir directo su chat
      cargarConversaciones(function(){
        abrirChat(abrirUid, abrirNombre||'Mascota');
      });
    } else {
      cargarConversaciones();
    }
  });
}

function cargarConversaciones(callback){
  fetch('/api/galeria?action=getConversaciones&uid='+encodeURIComponent(miMascotaUID))
  .then(function(r){return r.json();})
  .then(function(d){
    conversaciones=d.conversaciones||[];
    renderLista();
    if(typeof callback==='function') callback();
  }).catch(function(){
    document.getElementById('listaConversaciones').innerHTML='<div class="vacio"><div class="vacio-ico">😕</div><div class="vacio-titulo">No se pudieron cargar los mensajes</div></div>';
  });
}

function renderLista(){
  var cont=document.getElementById('listaConversaciones');
  if(!conversaciones.length){
    cont.innerHTML='<div class="vacio"><div class="vacio-ico">💬</div><div class="vacio-titulo">Aún no tienes conversaciones</div><div class="vacio-sub">Cuando le escribas a un amigo o alguien te escriba a ti, aparecerá aquí.</div></div>';
    return;
  }
  cont.innerHTML=conversaciones.map(function(c){
    var fotoHTML=c.otroFoto&&c.otroFoto.indexOf('http')>=0
      ?'<img class="conv-foto" src="'+c.otroFoto+'"'+(c.otroAngelito?' style="filter:grayscale(60%)"':'')+'>'
      :'<div class="conv-foto-ph">'+(c.otroAngelito?'🕊️':'🐾')+'</div>';
    var hora=tiempoRelativo(c.ultimaFecha);
    var prefijo=c.ultimoEsMio?'Tú: ':'';
    var previewClass='conv-preview'+(!c.ultimoEsMio&&c.noLeidos>0?' no-leido':'');
    return '<div class="conv-item" onclick="abrirChat(\''+c.otroUid+'\',\''+c.otroNombre.replace(/'/g,"\\'")+'\')">'
      +fotoHTML
      +'<div class="conv-info">'
        +'<div class="conv-nombre">'+c.otroNombre+(c.otroAngelito?' 🕊️':'')+'</div>'
        +'<div class="'+previewClass+'">'+prefijo+(c.ultimoMensaje||'').substring(0,50)+'</div>'
      +'</div>'
      +'<div class="conv-meta">'
        +'<div class="conv-hora">'+hora+'</div>'
        +(c.noLeidos>0?'<div class="conv-badge">'+c.noLeidos+'</div>':'')
      +'</div>'
    +'</div>';
  }).join('');
}

function tiempoRelativo(ts){
  if(!ts)return'';
  var d=Date.now()-new Date(ts).getTime();
  var m=Math.floor(d/60000);
  if(m<1)return'ahora';
  if(m<60)return m+'min';
  var h=Math.floor(m/60);
  if(h<24)return h+'h';
  var dias=Math.floor(h/24);
  if(dias<7)return dias+'d';
  return new Date(ts).toLocaleDateString('es-GT',{day:'2-digit',month:'short'});
}

function abrirChat(otroUid,otroNombre){
  chatActivo={otroUid:otroUid,otroNombre:otroNombre};
  document.getElementById('listView').style.display='none';
  document.getElementById('chatView').style.display='flex';
  document.getElementById('chatNombre').textContent=otroNombre;

  var conv=conversaciones.find(function(c){return c.otroUid===otroUid;});
  var fotoWrap=document.getElementById('chatFotoWrap');
  if(conv&&conv.otroFoto&&conv.otroFoto.indexOf('http')>=0){
    fotoWrap.innerHTML='<img class="chat-foto" src="'+conv.otroFoto+'">';
  } else {
    fotoWrap.innerHTML='<div class="chat-foto-ph">🐾</div>';
  }

  cargarChat();
  fetch('/api/galeria?action=marcarLeidos',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({uid_emisor:otroUid,uid_receptor:miMascotaUID})})
    .then(function(){ cargarConversaciones(); });
}

function volverALista(){
  document.getElementById('chatView').style.display='none';
  document.getElementById('listView').style.display='block';
  chatActivo=null;
  cargarConversaciones();
}

function cargarChat(){
  if(!chatActivo) return;
  fetch('/api/galeria?action=getConversacion&uid1='+encodeURIComponent(miMascotaUID)+'&uid2='+encodeURIComponent(chatActivo.otroUid))
  .then(function(r){return r.json();})
  .then(function(d){
    var msgs=(d.mensajes||[]).slice().sort(function(a,b){return new Date(a.created_at)-new Date(b.created_at);});
    var lista=document.getElementById('chatLista');
    if(!msgs.length){
      lista.innerHTML='<div style="text-align:center;color:#bbb;font-size:13px;padding:20px">Envía el primer mensaje 👋</div>';
      return;
    }
    lista.innerHTML=msgs.map(function(m){
      var esMio=m.uid_emisor===miMascotaUID;
      var hora=m.created_at?new Date(m.created_at).toLocaleTimeString('es-GT',{hour:'2-digit',minute:'2-digit'}):'';
      return '<div style="display:flex;justify-content:'+(esMio?'flex-end':'flex-start')+';margin-bottom:8px">'
        +'<div style="max-width:75%;background:'+(esMio?'#00B4B4':'#f0f0ee')+';color:'+(esMio?'#fff':'#333')+';padding:8px 12px;border-radius:'+(esMio?'14px 14px 4px 14px':'14px 14px 14px 4px')+';font-size:13px;line-height:1.5">'
        +m.mensaje
        +'<div style="font-size:10px;color:'+(esMio?'rgba(255,255,255,.6)':'#bbb')+';margin-top:3px;text-align:right">'+hora+'</div>'
        +'</div></div>';
    }).join('');
    lista.scrollTop=lista.scrollHeight;
  });
}

function enviarDesdeChatInput(){
  var input=document.getElementById('chatInput');
  var mensaje=input.value.trim();
  if(!mensaje||!chatActivo) return;
  input.value='';
  fetch('/api/galeria?action=enviarMensajePrivado',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({uid_emisor:miMascotaUID,uid_receptor:chatActivo.otroUid,mensaje:mensaje})
  }).then(function(r){return r.json();})
  .then(function(d){
    if(d.ok){
      cargarChat();
      // Notificar por correo al dueño (no bloqueante) — mismo patrón que perfil.html
      fetch(SB_URL+'/rest/v1/mascotas?uid=eq.'+encodeURIComponent(chatActivo.otroUid)+'&select=email',{headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}})
        .then(function(r){return r.json();})
        .then(function(rows){
          var email=rows&&rows[0]&&rows[0].email;
          if(email){
            fetch('/api/submit',{
              method:'POST',headers:{'Content-Type':'application/json'},
              body:JSON.stringify({
                action:'notificarMensaje',
                emailReceptor:email,
                nombreEmisor:miNombre||sessionEmail,
                nombreReceptor:chatActivo.otroNombre,
                mensaje:mensaje.substring(0,200)
              })
            }).catch(function(){});
          }
        }).catch(function(){});
    }
  });
}
</script>
<script src="/header.js"></script>
</body>
</html>
