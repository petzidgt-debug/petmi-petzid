<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link rel="icon" href="/favico.jpg" type="image/jpeg">
<title>Eventos — PetMi</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Arial,sans-serif;background:#f0f0ee;min-height:100vh}
.hero{background:linear-gradient(135deg,#00B4B4,#007a7a);padding:24px 20px 20px;text-align:center}
.hero h1{font-size:22px;font-weight:900;color:#fff;font-family:'Arial Black',Arial,sans-serif;margin-bottom:4px}
.hero p{font-size:13px;color:rgba(255,255,255,.75)}
.filtros-wrap{background:#fff;padding:10px 16px;border-bottom:1px solid #eee;position:sticky;top:0;z-index:80}
.filtros-scroll{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.filtros-scroll::-webkit-scrollbar{display:none}
.filtro-btn{padding:7px 14px;border:1.5px solid #ddd;border-radius:20px;font-size:12px;font-weight:600;color:#888;background:#fff;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:all .2s}
.filtro-btn.active{border-color:#00B4B4;background:#e0f7f7;color:#007a7a}
.mes-bar{background:#fff;border-bottom:1px solid #eee;padding:8px 16px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.mes-bar::-webkit-scrollbar{display:none}
.mes-chip{padding:5px 14px;border-radius:99px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0;border:1.5px solid #eee;background:#fff;color:#888;transition:all .2s}
.mes-chip.active{background:#00B4B4;color:#fff;border-color:#00B4B4}
.mes-chip.hoy{border-color:#00B4B4;color:#00B4B4}
.wrap{max-width:600px;margin:0 auto;padding:16px}
.evento-card{background:#fff;border-radius:16px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,.07);overflow:hidden;border:1px solid #eee}
.evento-card.destacado{border:2px solid #F5C842}
.evento-header{height:5px;background:linear-gradient(90deg,#00B4B4,#007a7a)}
.evento-img{width:100%;height:180px;object-fit:cover;display:block}
.evento-body{padding:16px}
.evento-badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;padding:3px 9px;border-radius:99px;margin-bottom:8px;background:#e0f7f7;color:#007a7a}
.evento-tipo{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;padding:3px 9px;border-radius:99px;margin-bottom:8px;margin-left:6px;background:#f0f0ee;color:#888}
.evento-titulo{font-size:16px;font-weight:900;color:#222;margin-bottom:8px;line-height:1.3}
.evento-fecha{font-size:13px;color:#00B4B4;font-weight:700;margin-bottom:4px}
.evento-lugar{font-size:13px;color:#666;margin-bottom:8px}
.evento-desc{font-size:13px;color:#666;line-height:1.6;margin-bottom:12px}
.evento-footer{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn-asistir{padding:9px 20px;background:#00B4B4;color:#fff;border:none;border-radius:20px;font-size:13px;font-weight:700;cursor:pointer;transition:all .2s}
.btn-asistir.asistiendo{background:#e0f7f7;color:#007a7a;border:1.5px solid #00B4B4}
.btn-link{padding:9px 16px;background:#f0f0ee;color:#555;border:none;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
.btn-invitar{padding:9px 16px;background:#764ba2;color:#fff;border:none;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer}
.asistentes-row{display:flex;align-items:center;gap:4px;margin-bottom:10px;flex-wrap:wrap}
.asis-avatar{width:26px;height:26px;border-radius:7px;object-fit:cover;border:2px solid #fff}
.asis-count{font-size:12px;color:#aaa}
.fab-pill{position:fixed;bottom:24px;right:20px;display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:99px;color:#fff;font-size:13px;font-weight:700;border:none;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.2);z-index:70;text-decoration:none}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);z-index:200;display:none;align-items:flex-end;justify-content:center}
.modal-overlay.open{display:flex}
.modal-sheet{background:#fff;border-radius:20px 20px 0 0;padding:24px 20px 32px;width:100%;max-width:600px;max-height:85vh;overflow-y:auto}
.modal-handle{width:40px;height:4px;background:#e0e0e0;border-radius:2px;margin:0 auto 20px}
.modal-titulo{font-size:18px;font-weight:900;color:#222;margin-bottom:6px}
.form-label{font-size:12px;font-weight:700;color:#555;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;display:block}
.form-input{width:100%;padding:12px 14px;border:1.5px solid #e0e0e0;border-radius:12px;font-size:14px;outline:none;margin-bottom:12px;font-family:Arial,sans-serif;background:#fff}
.form-input:focus{border-color:#00B4B4}
.btn-enviar-sug{width:100%;padding:14px;background:#00B4B4;color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;margin-top:8px}
.amigo-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f0f0ee;cursor:pointer}
.amigo-foto{width:40px;height:40px;border-radius:10px;object-fit:cover;background:#e0f7f7;display:flex;align-items:center;justify-content:center;font-size:18px}
.amigo-nombre{font-size:14px;font-weight:700;color:#222}
.amigo-esp{font-size:12px;color:#aaa}
.empty{text-align:center;padding:48px 20px}
.empty-icon{font-size:48px;margin-bottom:12px}
.empty-txt{font-size:14px;color:#888}
.spinner{width:36px;height:36px;border:3px solid #f0f0f0;border-top-color:#00B4B4;border-radius:50%;animation:spin .8s linear infinite;margin:40px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.foto-upload-wrap{border:2px dashed #e0e0e0;border-radius:12px;padding:16px;text-align:center;cursor:pointer;margin-bottom:12px;transition:border-color .2s}
.foto-upload-wrap:hover{border-color:#00B4B4}
.foto-upload-wrap input{display:none}
.foto-preview{width:100%;height:140px;object-fit:cover;border-radius:10px;margin-bottom:8px;display:none}
.jefe-modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);z-index:500;display:none;align-items:center;justify-content:center;padding:20px}
.jefe-modal.open{display:flex}
.jefe-box{background:#fff;border-radius:20px;padding:28px;width:100%;max-width:320px;text-align:center}
.jefe-box img{width:160px;border-radius:14px;margin-bottom:14px}
.jefe-box h3{font-size:17px;font-weight:900;color:#222;margin-bottom:6px}
.jefe-box p{font-size:13px;color:#888;line-height:1.6;margin-bottom:18px}
.jefe-box button{width:100%;padding:12px;background:#00B4B4;color:#fff;border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 20px;border-radius:24px;font-size:13px;font-weight:600;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.msg-sg{font-size:13px;padding:10px;border-radius:10px;margin-bottom:12px;display:none}
.foto-modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.92);z-index:800;display:none;align-items:center;justify-content:center;padding:20px}
.foto-modal.open{display:flex}
.foto-modal img{max-width:100%;max-height:90vh;border-radius:12px;object-fit:contain}
.foto-modal-close{position:fixed;top:16px;right:16px;background:rgba(255,255,255,.2);color:#fff;border:none;border-radius:50%;width:36px;height:36px;font-size:20px;cursor:pointer;line-height:1}
</style>
</head>
<body>
<div class="hero">
  <h1>🎪 Eventos</h1>
  <p>Eventos oficiales, paseos y exposiciones para mascotas en Guatemala</p>
</div>
<div class="filtros-wrap">
  <div class="filtros-scroll">
    <button class="filtro-btn active" onclick="setFiltro('',this)">Todos</button>
    <button class="filtro-btn" onclick="setFiltro('perdido',this)">🚨 Perdidos</button>
    <button class="filtro-btn" onclick="setFiltro('adopcion',this)">🏠 Adopciones</button>
    <button class="filtro-btn" onclick="setFiltro('busco',this)">🔍 Busco</button>
    <button class="filtro-btn" onclick="setFiltro('venta',this)">💰 Ventas</button>
    <button class="filtro-btn" onclick="setFiltro('evento',this)">🎪 Eventos</button>
  </div>
</div>
<div class="mes-bar" id="mesBar"></div>
<div class="wrap" id="contenido"><div class="spinner"></div></div>
<button class="fab-pill" style="background:#00B4B4" onclick="abrirSugerir()">+ Sugerir evento</button>
<div class="modal-overlay" id="modalSugerir">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-titulo">Sugerir un evento</div>
    <div style="font-size:13px;color:#aaa;margin-bottom:16px">Tu sugerencia será revisada por el jefe antes de publicarse</div>
    <div id="msgSugerir" class="msg-sg"></div>
    <label class="form-label">Título *</label>
    <input type="text" class="form-input" id="evTitulo" placeholder="Nombre del evento">
    <label class="form-label">Tipo</label>
    <select class="form-input" id="evTipo">
      <option value="evento">🎪 Evento</option>
      <option value="paseo">🚶 Paseo</option>
      <option value="exposicion">🏆 Exposición</option>
      <option value="adopcion">🐾 Adopción</option>
    </select>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div>
        <label class="form-label">Fecha *</label>
        <input type="date" class="form-input" id="evFecha">
      </div>
      <div>
        <label class="form-label">Hora</label>
        <input type="time" class="form-input" id="evHora">
      </div>
    </div>
    <label class="form-label">Lugar</label>
    <input type="text" class="form-input" id="evLugar" placeholder="Nombre del lugar">
    <label class="form-label">Dirección</label>
    <input type="text" class="form-input" id="evDireccion" placeholder="Dirección exacta">
    <label class="form-label">Descripción</label>
    <textarea class="form-input" id="evDesc" rows="3" style="resize:none" placeholder="Cuéntanos más sobre el evento..."></textarea>
    <label class="form-label">Link (opcional)</label>
    <input type="text" class="form-input" id="evLink" placeholder="https://...">
    <label class="form-label">Foto del evento (opcional)</label>
    <div class="foto-upload-wrap" onclick="document.getElementById('evFotoInput').click()">
      <img id="evFotoPreview" class="foto-preview">
      <div id="evFotoLabel" style="font-size:13px;color:#aaa">📷 Toca para agregar una foto</div>
      <input type="file" id="evFotoInput" accept="image/*" onchange="previsualizarFoto(this,'evFotoPreview','evFotoLabel')">
    </div>
    <button class="btn-enviar-sug" id="btnSugerir" onclick="enviarSugerencia()">Enviar sugerencia</button>
    <button onclick="cerrarSugerir()" style="width:100%;padding:12px;background:#f0f0ee;color:#666;border:none;border-radius:12px;font-size:14px;cursor:pointer;margin-top:8px">Cancelar</button>
  </div>
</div>
<div class="modal-overlay" id="modalInvitar">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-titulo" id="invitarTitulo">Invitar amigos</div>
    <div id="amigosLista"><div class="spinner"></div></div>
    <button onclick="cerrarInvitar()" style="width:100%;padding:12px;background:#f0f0ee;color:#666;border:none;border-radius:12px;font-size:14px;cursor:pointer;margin-top:12px">Cerrar</button>
  </div>
</div>
<div class="foto-modal" id="fotoModalEv" onclick="cerrarFotoEvento()">
  <button class="foto-modal-close" onclick="cerrarFotoEvento()">×</button>
  <img id="fotoModalEvImg" src="" alt="">
</div>
<div class="toast" id="toast"></div>
<div class="jefe-modal" id="jefeModal" onclick="this.classList.remove('open')">
  <div class="jefe-box" onclick="event.stopPropagation()">
    <img id="jefeImg" style="width:160px;border-radius:14px;margin-bottom:14px;display:none">
    <h3 id="jefeTitulo">¡Gracias!</h3>
    <p id="jefeMsg">El jefe revisará tu sugerencia pronto 🐾</p>
    <button onclick="document.getElementById('jefeModal').classList.remove('open')">OK, gracias!</button>
  </div>
</div>
<script>
var sessionEmail = localStorage.getItem('petzid_email')||'';
var miMascota    = null;
var misMascotas  = [];
var amigosCache  = [];
var filtroActual = '';
var mesActual    = '';
var eventosData  = [];
var misAsistencias = {};
var eventoInvitarActual = null;
var invitadosEnviados = {};
var MESES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
var JEFE_IMGS=['/jefe1.png','/jefe2.jpg','/jefe3.jpg'];
var evFotoBase64=null;var evFotoMime=null;
var TIPO_EMOJIS={evento:'🎪',paseo:'🚶',exposicion:'🏆',adopcion:'🐾'};

if(sessionEmail){
  fetch('/api/galeria?action=checkEmail',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'checkEmail',email:sessionEmail})})
    .then(function(r){return r.json();})
    .then(function(d){
      if(d.found&&d.mascotas.length){ misMascotas=d.mascotas;miMascota=d.mascotas[0];cargarAmigos(); }
    });
}
renderMesPicker();
cargarEventos();

function renderMesPicker(){
  var hoy=new Date();
  var html='<div class="mes-chip active" onclick="setMes(\'\',this)">Todos</div>';
  for(var i=0;i<6;i++){
    var d=new Date(hoy.getFullYear(),hoy.getMonth()+i,1);
    var key=d.getFullYear()+'-'+(d.getMonth()+1);
    html+='<div class="mes-chip'+(i===0?' hoy':'')+'" data-key="'+key+'" onclick="setMes(\''+key+'\',this)">'+MESES[d.getMonth()].substring(0,3)+' '+d.getFullYear()+'</div>';
  }
  document.getElementById('mesBar').innerHTML=html;
}

function setMes(mes,el){
  mesActual=mes;
  document.querySelectorAll('.mes-chip').forEach(function(c){c.classList.remove('active');});
  if(el)el.classList.add('active');
  renderEventos();
}

function setFiltro(tipo,el){
  filtroActual=tipo;
  document.querySelectorAll('.filtro-btn').forEach(function(b){b.classList.remove('active');});
  el.classList.add('active');
  renderEventos();
}

function cargarEventos(){
  document.getElementById('contenido').innerHTML='<div class="spinner"></div>';
  var hoy=new Date().toISOString().split('T')[0];
  fetch('/api/galeria?action=getEventos')
    .then(function(r){return r.json();})
    .then(function(d){
      eventosData=(d.eventos||[]).filter(function(e){return !e.fecha||e.fecha>=hoy;});
      if(miMascota){
        eventosData.forEach(function(e){
          fetch('/api/galeria?action=getAsistentes&evento_id='+encodeURIComponent(e.id))
            .then(function(r){return r.json();})
            .then(function(d){
              var as=d.asistentes||[];
              var ya=as.some(function(a){return a.uid_mascota===miMascota.uid;});
              if(ya) misAsistencias[e.id]=true;
              var btn=document.getElementById('btn-ev-'+e.id);
              if(btn&&ya){btn.textContent='✅ Confirmado';btn.className='btn-asistir asistiendo';}
              var cnt=document.getElementById('cnt-ev-'+e.id);
              if(cnt&&as.length>0)cnt.textContent=as.length+' asistente'+(as.length!==1?'s':'');
            });
        });
      }
      renderEventos();
    }).catch(function(){
      document.getElementById('contenido').innerHTML='<div class="empty"><div class="empty-icon">😕</div><div class="empty-txt">Error al cargar eventos</div></div>';
    });
}

function renderEventos(){
  var lista=eventosData;
  if(filtroActual) lista=lista.filter(function(e){return e.tipo===filtroActual;});
  if(mesActual){
    var p=mesActual.split('-');var y=parseInt(p[0]),m=parseInt(p[1])-1;
    lista=lista.filter(function(e){
      if(!e.fecha)return false;
      var d=new Date(e.fecha+'T12:00:00');
      return d.getFullYear()===y&&d.getMonth()===m;
    });
  }
  if(!lista.length){
    document.getElementById('contenido').innerHTML='<div class="empty"><div class="empty-icon">🎪</div><div class="empty-txt">'+(mesActual?'Sin eventos este mes':'No hay eventos próximos')+'</div></div>';
    return;
  }
  var html='';
  lista.forEach(function(e){html+=renderEvento(e);});
  document.getElementById('contenido').innerHTML=html;
  // Scroll to specific event if ?id= param present
  var urlId=new URLSearchParams(window.location.search).get('id');
  if(urlId){
    setTimeout(function(){
      var el=document.getElementById('btn-ev-'+urlId);
      if(!el){
        // Try finding card by looking for the compartir button
        el=document.getElementById('btn-compartir-'+urlId);
      }
      if(el){
        el.closest('.evento-card').scrollIntoView({behavior:'smooth',block:'center'});
        el.closest('.evento-card').style.boxShadow='0 0 0 3px #00B4B4';
        setTimeout(function(){el.closest('.evento-card').style.boxShadow='';},3000);
      }
    },300);
  }
  // Attach compartir button events after render
  lista.forEach(function(e){
    var btn=document.getElementById('btn-compartir-'+e.id);
    if(btn){
      btn.addEventListener('click',function(){
        var msg='🎪 '+e.titulo+'\n¿Te apuntas a este evento? 🐾\nhttps://worker-js.petzid-gt.workers.dev/s/e/'+e.id;
        window.open('https://wa.me/?text='+encodeURIComponent(msg),'_blank');
      });
    }
  });
}

function renderEvento(e){
  var emoji=TIPO_EMOJIS[e.tipo]||'🎪';
  var fecha=e.fecha?new Date(e.fecha+'T12:00:00').toLocaleDateString('es-GT',{weekday:'long',day:'2-digit',month:'long',year:'numeric'}):'';
  var yaAsiste=misAsistencias[e.id];
  var html='<div class="evento-card" data-fecha="'+(e.fecha||'')+'">';
  html+='<div class="evento-header"></div>';
  if(e.imagen&&e.imagen.indexOf('http')>=0){
    html+='<img src="'+e.imagen+'" class="evento-img" alt="'+e.titulo+'">';
  }
  html+='<div class="evento-body">';
  html+='<span class="evento-badge">🎪 Evento oficial</span>';
  html+='<span class="evento-tipo">'+emoji+' '+(e.tipo||'evento')+'</span>';
  html+='<div class="evento-titulo">'+e.titulo+'</div>';
  if(fecha) html+='<div class="evento-fecha">📅 '+fecha+(e.hora?' · '+e.hora:'')+'</div>';
  if(e.lugar) html+='<div class="evento-lugar">📍 '+e.lugar+(e.direccion?' — '+e.direccion:'')+'</div>';
  if(e.descripcion) html+='<div class="evento-desc">'+e.descripcion+'</div>';
  html+='<div class="asistentes-row" id="cnt-ev-'+e.id+'"></div>';
  html+='<div class="evento-footer">';
  if(sessionEmail){
    html+='<button class="btn-asistir'+(yaAsiste?' asistiendo':'')+'" id="btn-ev-'+e.id+'" data-id="'+e.id+'\" onclick="asistir(this.dataset.id)">'+(yaAsiste?'✅ Confirmado':'✅ Asistiré')+'</button>';
    if(amigosCache.length>0){
      html+='<button class="btn-invitar" data-id="'+e.id+'" data-titulo="'+e.titulo.replace(/"/g,'&quot;').replace(/'/g,'&#39;')+'" data-fecha="'+(e.fecha||'')+'" data-lugar="'+(e.lugar||'')+'" onclick="abrirInvitarDesdeBtn(this)">Invitar amigos</button>';
    }
  }
  if(e.link) html+='<a href="'+e.link+'" target="_blank" class="btn-link">Más info</a>';
  html+='<button class="btn-link" id="btn-compartir-'+e.id+'" style="display:inline-flex;align-items:center;gap:5px">'+
    '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>Compartir</button>';
  html+='</div></div></div>';
  return html;
}

function asistir(eId){
  if(!sessionEmail||!miMascota){mostrarToast('Inicia sesión para confirmar asistencia');return;}
  var ya=misAsistencias[eId];
  fetch('/api/galeria?action='+(ya?'cancelarAsistencia':'asistirEvento'),{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({evento_id:eId,uid_mascota:miMascota.uid,email:sessionEmail})
  }).then(function(r){return r.json();})
  .then(function(d){
    if(d.ok){
      misAsistencias[eId]=!ya;
      var btn=document.getElementById('btn-ev-'+eId);
      if(btn){btn.textContent=!ya?'✅ Confirmado':'✅ Asistiré';btn.className='btn-asistir'+(!ya?' asistiendo':'');}
      mostrarToast(!ya?'✅ ¡Nos vemos ahí!':'Asistencia cancelada');
    }
  });
}

function abrirInvitarDesdeBtn(btn){
  abrirInvitar(btn.dataset.id,btn.dataset.titulo,btn.dataset.fecha,btn.dataset.lugar);
}

function cargarAmigos(){
  if(!misMascotas.length)return;
  var SB='https://ilcreewilnkchvozicyp.supabase.co';

  var html='';

    html='<div style="text-align:center;padding:24px;color:#aaa">No tienes amigos aún</div>';
  } else {
    amigosCache.forEach(function(a){
      var sent=invitadosEnviados[eId+'_'+a.uid];
      var foto=a.foto&&a.foto.indexOf('http')>=0?'<img src="'+a.foto+'" class="amigo-foto" style="object-fit:cover">':'<div class="amigo-foto">🐾</div>';
      html+='<div class="amigo-item" data-uid="'+a.uid+'" data-nombre="'+a.nombre+'" data-email="'+a.email+'" onclick="enviarInvitacionDesdeItem(this)">'
        +foto+'<div style="flex:1"><div class="amigo-nombre">'+a.nombre+'</div><div class="amigo-esp">'+(a.especie||'')+'</div></div>'
        +'<span style="font-size:12px;color:'+(sent?'#2e7d32':'#00B4B4')+'">'+(sent?'✓ Invitado':'Invitar')+'</span></div>';
    });
  }
  document.getElementById('amigosLista').innerHTML=html;
  document.getElementById('modalInvitar').classList.add('open');

function enviarInvitacionDesdeItem(el){

function enviarInvitacion(uid,nombre,email){
  if(!eventoInvitarActual)return;
  invitadosEnviados[eventoInvitarActual.id+'_'+uid]=true;
  fetch('/api/submit',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({action:'notificarInvitacion',emailReceptor:email,nombreEvento:eventoInvitarActual.titulo,fechaEvento:eventoInvitarActual.fecha,lugarEvento:eventoInvitarActual.lugar,nombreEmisor:miMascota?miMascota.nombre:'Un amigo',urlEventos:'https://petmi-petzid.vercel.app/eventos.html'})
  }).then(function(){
    mostrarToast('Invitación enviada a '+nombre);
    abrirInvitar(eventoInvitarActual.id,eventoInvitarActual.titulo,eventoInvitarActual.fecha,eventoInvitarActual.lugar);
  });
}

function abrirSugerir(){ document.getElementById('modalSugerir').classList.add('open'); }

function cerrarSugerir(){
  document.getElementById('modalSugerir').classList.remove('open');
  evFotoBase64=null;evFotoMime=null;
  var prev=document.getElementById('evFotoPreview');
  var lbl=document.getElementById('evFotoLabel');
  if(prev)prev.style.display='none';
  if(lbl)lbl.textContent='📷 Toca para agregar una foto';
  var btn=document.getElementById('btnSugerir');
  if(btn){btn.disabled=false;btn.textContent='Enviar sugerencia';}
  document.getElementById('msgSugerir').style.display='none';
}

async function enviarSugerencia(){
  var titulo=document.getElementById('evTitulo').value.trim();
  var fecha=document.getElementById('evFecha').value;
  if(!titulo||!fecha){mostrarToast('Título y fecha son obligatorios');return;}
  var btn=document.getElementById('btnSugerir');
  btn.disabled=true;btn.textContent='Enviando...';

  // Subir foto a Cloudinary desde el frontend (igual que admin)
  var imagenUrl=null;
  if(evFotoBase64&&evFotoMime){
    try{
      btn.textContent='Subiendo foto...';
      var fd=new FormData();
      fd.append('file','data:'+evFotoMime+';base64,'+evFotoBase64);
      fd.append('upload_preset','petzid');
      fd.append('folder','petzid/eventos');
      var cRes=await fetch('https://api.cloudinary.com/v1_1/dh5wgqgmk/image/upload',{method:'POST',body:fd});
      var cData=await cRes.json();
      if(cData.secure_url) imagenUrl=cData.secure_url;
    }catch(e){console.error('Cloudinary:',e);}
  }

  btn.textContent='Guardando...';
  fetch('/api/galeria?action=enviarEvento',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({titulo:titulo,tipo:document.getElementById('evTipo').value,fecha:fecha,hora:document.getElementById('evHora').value||null,lugar:document.getElementById('evLugar').value.trim(),direccion:document.getElementById('evDireccion').value.trim(),descripcion:document.getElementById('evDesc').value.trim(),link:document.getElementById('evLink').value.trim(),email:sessionEmail||'',imagen:imagenUrl})
  }).then(function(r){return r.json();})
  .then(function(d){
    if(d.ok){
      btn.textContent='Enviado!';
      cerrarSugerir();
      setTimeout(function(){ mostrarJefe('¡Gracias por tu sugerencia!','El jefe revisará el evento pronto y lo publicará en la comunidad 🐾'); },200);
    } else { btn.disabled=false;btn.textContent='Enviar sugerencia';mostrarToast('Error al enviar'); }
  }).catch(function(){btn.disabled=false;btn.textContent='Enviar sugerencia';mostrarToast('Error de conexión');});
}

function previsualizarFoto(input,previewId,labelId){
  var file=input.files[0];if(!file)return;
  evFotoMime=file.type;
  var reader=new FileReader();
  reader.onload=function(e){
    evFotoBase64=e.target.result.split(',')[1];
    var prev=document.getElementById(previewId);
    var lbl=document.getElementById(labelId);
    prev.src=e.target.result;prev.style.display='block';
    lbl.textContent='✓ Foto seleccionada · Toca para cambiar';
  };
  reader.readAsDataURL(file);
}

function mostrarJefe(titulo,msg){
  var url=JEFE_IMGS[Math.floor(Math.random()*JEFE_IMGS.length)];
  var imgEl=document.getElementById('jefeImg');
  imgEl.style.display='none';
  imgEl.onload=function(){imgEl.style.display='block';};
  imgEl.onerror=function(){imgEl.style.display='none';};
  imgEl.src=url;
  document.getElementById('jefeTitulo').textContent=titulo;
  document.getElementById('jefeMsg').textContent=msg;
  document.getElementById('jefeModal').classList.add('open');
}

function abrirFotoEvento(src){
  document.getElementById('fotoModalEvImg').src=src;
  document.getElementById('fotoModalEv').classList.add('open');
}
function cerrarFotoEvento(){
  document.getElementById('fotoModalEv').classList.remove('open');
}
function mostrarToast(msg){
  var el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('show');
  setTimeout(function(){el.classList.remove('show');},2500);
}
