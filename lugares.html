<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link rel="icon" href="/favico.jpg" type="image/jpeg">
<title>Lugares Pet-Friendly — PetMi</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Arial,sans-serif;background:#f0f0ee;min-height:100vh}
.wrap{max-width:700px;margin:0 auto;padding:20px 16px 40px}

/* HERO */
.hero{background:linear-gradient(135deg,#E05090,#c0392b);border-radius:16px;padding:24px;margin-bottom:20px;color:#fff;text-align:center}
.hero h1{font-size:22px;font-weight:900;font-family:'Arial Black',Arial,sans-serif;margin-bottom:6px}
.hero p{font-size:13px;color:rgba(255,255,255,.75)}
.hero-stats{display:flex;justify-content:center;gap:28px;margin-top:14px}
.hstat{text-align:center}
.hstat-num{font-size:22px;font-weight:900}
.hstat-lbl{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:rgba(255,255,255,.7)}

/* FILTROS */
.filtros{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.filtro-btn{padding:7px 14px;border:1.5px solid #ddd;border-radius:20px;font-size:12px;font-weight:600;color:#888;background:#fff;cursor:pointer;transition:all .2s}
.filtro-btn.active{border-color:#E05090;background:#fce4ec;color:#c0392b}

/* BUSQUEDA */
.search-wrap{position:relative;margin-bottom:16px}
.search-input{width:100%;padding:12px 16px 12px 40px;border:1.5px solid #e0e0e0;border-radius:12px;font-size:15px;outline:none;background:#fff}
.search-input:focus{border-color:#E05090}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:16px;color:#aaa}

/* LUGAR CARD */
.lugar-card{background:#fff;border-radius:16px;overflow:hidden;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,.08);display:flex}
.lugar-foto{width:110px;flex-shrink:0;background:#f5f5f5;display:flex;align-items:center;justify-content:center;font-size:36px}
.lugar-foto img{width:110px;height:100%;object-fit:cover}
.lugar-body{flex:1;padding:14px;min-width:0}
.lugar-tipo-badge{display:inline-block;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:2px 8px;border-radius:20px;margin-bottom:6px;background:#f0f0ee;color:#888}
.lugar-nombre{font-size:15px;font-weight:900;color:#222;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lugar-zona{font-size:12px;color:#aaa;margin-bottom:6px}
.lugar-desc{font-size:12px;color:#666;line-height:1.5;margin-bottom:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lugar-footer{display:flex;align-items:center;gap:8px}
.stars{color:#F5C842;font-size:13px}
.rating-num{font-size:12px;color:#888}
.btn-maps{padding:5px 12px;background:#E05090;color:#fff;border:none;border-radius:20px;font-size:11px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}
.btn-rating{padding:5px 10px;background:#f0f0ee;color:#555;border:none;border-radius:20px;font-size:11px;font-weight:600;cursor:pointer}

/* MODAL RATING */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);z-index:500;display:none;align-items:center;justify-content:center;padding:16px}
.modal-overlay.open{display:flex}
.modal-box{background:#fff;border-radius:20px;padding:24px;width:100%;max-width:360px}
.modal-titulo{font-size:18px;font-weight:900;color:#222;margin-bottom:16px}
.stars-input{display:flex;gap:8px;font-size:32px;margin-bottom:16px;cursor:pointer}
.star-opt{opacity:.3;transition:opacity .15s}
.star-opt.selected{opacity:1}
.rating-textarea{width:100%;padding:10px 12px;border:1.5px solid #e0e0e0;border-radius:10px;font-size:13px;resize:none;height:80px;outline:none;margin-bottom:12px}
.rating-textarea:focus{border-color:#E05090}
.btn-enviar-rating{width:100%;padding:13px;background:#E05090;color:#fff;border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer}
.btn-cerrar-modal{width:100%;padding:11px;background:#f0f0ee;color:#666;border:none;border-radius:12px;font-size:13px;cursor:pointer;margin-top:8px}

/* EMPTY / LOADING */
.empty{text-align:center;padding:48px 20px;color:#bbb}
.empty-icon{font-size:48px;margin-bottom:12px}
.spinner{width:36px;height:36px;border:3px solid #f0f0f0;border-top-color:#E05090;border-radius:50%;animation:spin .8s linear infinite;margin:40px auto}
@keyframes spin{to{transform:rotate(360deg)}}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:12px 24px;border-radius:24px;font-size:14px;font-weight:600;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.modal-sheet{transition:transform .3s ease;transform:translateY(0)}
.modal-sheet.closing{transform:translateY(100%)}
.modal-handle{width:40px;height:4px;background:#ddd;border-radius:4px;margin:0 auto 16px;cursor:grab}
</style>
</head>
<body>

<div class="wrap">
  <div class="hero">
    <h1>📍 Lugares Pet-Friendly</h1>
    <p>Restaurantes, parques, hoteles y más que dan la bienvenida a tu mascota</p>
    <button onclick="abrirFormLugar()" style="margin-top:14px;padding:9px 20px;background:rgba(255,255,255,.2);color:#fff;border:1.5px solid rgba(255,255,255,.6);border-radius:20px;font-size:13px;font-weight:700;cursor:pointer">+ Sugerir un lugar</button>
    <div class="hero-stats">
      <div class="hstat"><div class="hstat-num" id="statTotal">-</div><div class="hstat-lbl">Lugares</div></div>
      <div class="hstat"><div class="hstat-num" id="statZonas">-</div><div class="hstat-lbl">Zonas</div></div>
    </div>
  </div>

  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input type="text" class="search-input" id="searchInput" placeholder="Buscar lugar..." oninput="filtrarLugares()">
  </div>

  <div class="filtros">
    <button class="filtro-btn active" onclick="setFiltro('',this)">Todos</button>
    <button class="filtro-btn" onclick="setFiltro('restaurante',this)">🍽️ Restaurantes</button>
    <button class="filtro-btn" onclick="setFiltro('parque',this)">🌳 Parques</button>
    <button class="filtro-btn" onclick="setFiltro('cafe',this)">☕ Cafés</button>
    <button class="filtro-btn" onclick="setFiltro('hotel',this)">🏨 Hoteles</button>
    <button class="filtro-btn" onclick="setFiltro('tienda',this)">🛍️ Tiendas</button>
    <button class="filtro-btn" onclick="setFiltro('veterinaria',this)">🏥 Veterinarias</button>
  </div>

  <div id="lugaresWrap">
    <div class="spinner"></div>
  </div>
</div>

<!-- Modal rating -->
<div class="modal-overlay" id="modalRating">
  <div class="modal-box modal-sheet" id="ratingSheet"><div class="modal-handle"></div>
    <div class="modal-titulo" id="ratingLugarNombre">Calificar lugar</div>
    <div class="stars-input" id="starsInput">
      <span class="star-opt" onclick="setRating(1)">⭐</span>
      <span class="star-opt" onclick="setRating(2)">⭐</span>
      <span class="star-opt" onclick="setRating(3)">⭐</span>
      <span class="star-opt" onclick="setRating(4)">⭐</span>
      <span class="star-opt" onclick="setRating(5)">⭐</span>
    </div>
    <textarea class="rating-textarea" id="ratingComentario" placeholder="Cuéntanos tu experiencia (opcional)"></textarea>
    <button class="btn-enviar-rating" onclick="enviarRating()">Enviar calificación</button>
    <button class="btn-cerrar-modal" onclick="closeRating()">Cancelar</button>
  </div>
</div>

<!-- Modal sugerir lugar -->
<div class="modal-overlay" id="modalSugerirLugar">
  <div class="modal-box modal-sheet" id="lugarSheet" style="max-height:85vh;overflow-y:auto">
    <div class="modal-handle"></div>
    <button onclick="cerrarFormLugar()" style="float:right;background:none;border:none;font-size:20px;cursor:pointer;margin-top:-8px">×</button>
    <div class="modal-titulo">📍 Sugerir un lugar</div>
    <div style="font-size:12px;color:#aaa;margin-bottom:14px">Tu sugerencia será revisada antes de publicarse</div>
    <label style="font-size:11px;font-weight:700;color:#aaa;text-transform:uppercase;letter-spacing:1px">Nombre *</label>
    <input type="text" id="sgLNombre" placeholder="Nombre del lugar" style="width:100%;padding:10px 12px;border:1.5px solid #eee;border-radius:10px;font-size:14px;margin:4px 0 12px;outline:none">
    <label style="font-size:11px;font-weight:700;color:#aaa;text-transform:uppercase;letter-spacing:1px">Tipo</label>
    <select id="sgLTipo" style="width:100%;padding:10px 12px;border:1.5px solid #eee;border-radius:10px;font-size:14px;margin:4px 0 12px;outline:none">
      <option value="restaurante">🍽️ Restaurante</option>
      <option value="parque">🌳 Parque</option>
      <option value="cafe">☕ Café</option>
      <option value="hotel">🏨 Hotel</option>
      <option value="tienda">🛍️ Tienda</option>
      <option value="veterinaria">🏥 Veterinaria</option>
    </select>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div>
        <label style="font-size:11px;font-weight:700;color:#aaa;text-transform:uppercase;letter-spacing:1px">Ubicación</label>
        <input type="text" id="sgLZona" placeholder="Ej: Zona 10, Antigua Guatemala..." style="width:100%;padding:10px 12px;border:1.5px solid #eee;border-radius:10px;font-size:14px;margin:4px 0 12px;outline:none">
      </div>
      <div>
        <label style="font-size:11px;font-weight:700;color:#aaa;text-transform:uppercase;letter-spacing:1px">Teléfono</label>
        <input type="text" id="sgLTelefono" placeholder="Opcional" style="width:100%;padding:10px 12px;border:1.5px solid #eee;border-radius:10px;font-size:14px;margin:4px 0 12px;outline:none">
      </div>
    </div>
    <label style="font-size:11px;font-weight:700;color:#aaa;text-transform:uppercase;letter-spacing:1px">Dirección</label>
    <input type="text" id="sgLDireccion" placeholder="Dirección del lugar" style="width:100%;padding:10px 12px;border:1.5px solid #eee;border-radius:10px;font-size:14px;margin:4px 0 12px;outline:none">
    <label style="font-size:11px;font-weight:700;color:#aaa;text-transform:uppercase;letter-spacing:1px">Descripción</label>
    <textarea id="sgLDesc" placeholder="¿Por qué lo recomiendas?" style="width:100%;padding:10px 12px;border:1.5px solid #eee;border-radius:10px;font-size:14px;margin:4px 0 12px;resize:none;height:70px;outline:none"></textarea>
    <label style="font-size:11px;font-weight:700;color:#aaa;text-transform:uppercase;letter-spacing:1px">Link Google Maps (opcional)</label>
    <input type="text" id="sgLMaps" placeholder="https://maps.google.com/..." style="width:100%;padding:10px 12px;border:1.5px solid #eee;border-radius:10px;font-size:14px;margin:4px 0 12px;outline:none">
    <label style="font-size:11px;font-weight:700;color:#aaa;text-transform:uppercase;letter-spacing:1px">Foto del lugar (opcional)</label>
    <div style="margin:4px 0 16px">
      <label for="sgLFoto" style="display:flex;align-items:center;gap:10px;padding:10px 14px;border:1.5px dashed #ddd;border-radius:10px;cursor:pointer;font-size:13px;color:#888;background:#fafafa">
        <span style="font-size:20px">📷</span>
        <span id="sgLFotoLabel">Seleccionar foto</span>
      </label>
      <input type="file" id="sgLFoto" accept="image/*" style="display:none" onchange="previsualizarFoto(this)">
      <div id="sgLFotoPreview" style="margin-top:8px;display:none">
        <img id="sgLFotoImg" style="width:100%;height:120px;object-fit:cover;border-radius:10px">
      </div>
    </div>
    <button onclick="enviarSugerenciaLugar()" id="sgLBtn" style="width:100%;padding:13px;background:#E05090;color:#fff;border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer">Enviar sugerencia</button>
  </div>
</div>

<!-- Modal gracias -->
<div class="modal-overlay" id="modalGracias" style="z-index:600">
  <div style="background:#fff;border-radius:20px;padding:28px;width:100%;max-width:360px;text-align:center">
    <div class="modal-handle" style="margin-bottom:20px"></div>
    <div id="modalGraciasContent"></div>
    <button onclick="document.getElementById('modalGracias').classList.remove('open')" style="margin-top:16px;width:100%;padding:12px;background:#f0f0ee;color:#666;border:none;border-radius:12px;font-size:14px;cursor:pointer">Cerrar</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var sessionEmail  = localStorage.getItem('petzid_email') || '';
var filtroActual  = '';
var lugaresData   = [];
var lugaresFiltr  = [];
var ratingLugarId = null;
var ratingVal     = 0;

var TIPO_EMOJIS = {restaurante:'🍽️',parque:'🌳',cafe:'☕',hotel:'🏨',tienda:'🛍️',veterinaria:'🏥'};

cargarLugares();

function cargarLugares(){
  document.getElementById('lugaresWrap').innerHTML='<div class="spinner"></div>';
  fetch('/api/galeria?action=getLugares')
    .then(function(r){return r.json();})
    .then(function(d){
      lugaresData  = d.lugares||[];
      lugaresFiltr = lugaresData;
      // Stats
      document.getElementById('statTotal').textContent=lugaresData.length;
      var zonas={};lugaresData.forEach(function(l){if(l.zona)zonas[l.zona]=1;});
      document.getElementById('statZonas').textContent=Object.keys(zonas).length;
      renderLugares();
    }).catch(function(){
      document.getElementById('lugaresWrap').innerHTML='<div class="empty"><div class="empty-icon">😕</div><p>Error al cargar lugares</p></div>';
    });
}

function setFiltro(tipo, btn){
  filtroActual=tipo;
  document.querySelectorAll('.filtro-btn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  filtrarLugares();
}

function filtrarLugares(){
  var busq=document.getElementById('searchInput').value.toLowerCase();
  lugaresFiltr=lugaresData.filter(function(l){
    if(filtroActual&&l.tipo!==filtroActual)return false;
    if(busq&&l.nombre.toLowerCase().indexOf(busq)<0&&(!l.direccion||l.direccion.toLowerCase().indexOf(busq)<0))return false;
    return true;
  });
  renderLugares();
}

function renderLugares(){
  var wrap=document.getElementById('lugaresWrap');
  if(!lugaresFiltr.length){
    wrap.innerHTML='<div class="empty"><div class="empty-icon">📍</div><p>No se encontraron lugares</p></div>';
    return;
  }

  var html='';
  lugaresFiltr.forEach(function(l){
    var emoji=TIPO_EMOJIS[l.tipo]||'📍';
    var stars=renderStars(l.rating||0);
    var fotoHTML=l.imagen&&l.imagen.indexOf('http')>=0
      ?'<img src="'+l.imagen+'">'
      :'';

    html+='<div class="lugar-card">';
    if(fotoHTML) html+='<div class="lugar-foto">'+fotoHTML+'</div>';
    html+='<div class="lugar-body">';
    html+='<span class="lugar-tipo-badge">'+emoji+' '+(l.tipo||'Lugar')+'</span>';
    html+='<div class="lugar-nombre">'+l.nombre+'</div>';
    if(l.zona) html+='<div class="lugar-zona">📍 Zona '+l.zona+(l.direccion?' · '+l.direccion:'')+'</div>';
    if(l.descripcion) html+='<div class="lugar-desc">'+l.descripcion+'</div>';
    html+='<div class="lugar-footer">';
    html+='<span class="stars">'+stars+'</span>';
    html+='<span class="rating-num">'+(l.rating?l.rating.toFixed(1):'Sin calificar')+'</span>';
    if(l.google_maps) html+='<a href="'+l.google_maps+'" target="_blank" class="btn-maps">Maps</a>';
    if(sessionEmail) html+='<button class="btn-rating" onclick="openRating(\''+l.id+'\',\''+l.nombre.replace(/'/g,'')+'\')">⭐ Calificar</button>';
    html+='</div></div></div>';
  });
  wrap.innerHTML=html;
}

function renderStars(rating){
  var full=Math.floor(rating);
  var half=rating-full>=0.5;
  var s='';
  for(var i=0;i<full;i++) s+='⭐';
  if(half) s+='✨';
  return s||'☆☆☆☆☆';
}

// Rating
function openRating(id, nombre){
  if(!sessionEmail){mostrarToast('Inicia sesión para calificar');return;}
  ratingLugarId=id;
  ratingVal=0;
  document.getElementById('ratingLugarNombre').textContent='Calificar: '+nombre;
  document.getElementById('ratingComentario').value='';
  document.querySelectorAll('.star-opt').forEach(function(s){s.classList.remove('selected');});
  document.getElementById('modalRating').classList.add('open');
}

function closeRating(){ document.getElementById('modalRating').classList.remove('open'); }

function setRating(val){
  ratingVal=val;
  document.querySelectorAll('.star-opt').forEach(function(s,i){
    s.classList.toggle('selected',i<val);
  });
}

function enviarRating(){
  if(!ratingVal){mostrarToast('Selecciona una calificación');return;}
  var comentario=document.getElementById('ratingComentario').value.trim();
  fetch('/api/galeria?action=ratingLugar',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({lugar_id:ratingLugarId,email:sessionEmail,rating:ratingVal,comentario:comentario})
  }).then(function(r){return r.json();})
  .then(function(d){
    if(d.ok){
      mostrarToast('✅ Calificación enviada!');
      closeRating();
      setTimeout(cargarLugares,1000);
    }
  });
}

var sgLFotoBase64 = null;
var sgLFotoMime   = null;

function previsualizarFoto(input){
  var file = input.files[0];
  if(!file) return;
  sgLFotoMime = file.type;
  document.getElementById('sgLFotoLabel').textContent = file.name;
  var reader = new FileReader();
  reader.onload = function(e){
    sgLFotoBase64 = e.target.result.split(',')[1];
    var preview = document.getElementById('sgLFotoPreview');
    document.getElementById('sgLFotoImg').src = e.target.result;
    preview.style.display = 'block';
  };
  reader.readAsDataURL(file);
}

function abrirFormLugar(){
  document.getElementById('modalSugerirLugar').style.display='flex';
  document.getElementById('modalSugerirLugar').classList.add('open');
}
function cerrarFormLugar(){
  document.getElementById('modalSugerirLugar').classList.remove('open');
  document.getElementById('modalSugerirLugar').style.display='none';
  // Reset form
  document.getElementById('sgLNombre').value='';
  document.getElementById('sgLZona').value='';
  document.getElementById('sgLTelefono').value='';
  document.getElementById('sgLDireccion').value='';
  document.getElementById('sgLDesc').value='';
  document.getElementById('sgLMaps').value='';
  document.getElementById('sgLFotoLabel').textContent='Seleccionar foto';
  document.getElementById('sgLFotoPreview').style.display='none';
  var btn=document.getElementById('sgLBtn');
  btn.disabled=false;btn.textContent='Enviar sugerencia';
  sgLFotoBase64=null;sgLFotoMime=null;
}
function enviarSugerenciaLugar(){
  var nombre=document.getElementById('sgLNombre').value.trim();
  if(!nombre){mostrarMsgLugar('El nombre es obligatorio','#fbeaf0','#c0392b');return;}
  var btn=document.getElementById('sgLBtn');
  btn.disabled=true;btn.textContent='Enviando...';

  var fotoPromise = sgLFotoBase64
    ? (function(){
        var fd=new FormData();
        fd.append('file','data:'+(sgLFotoMime||'image/jpeg')+';base64,'+sgLFotoBase64);
        fd.append('upload_preset','petzid');
        return fetch('https://api.cloudinary.com/v1_1/dh5wgqgmk/image/upload',{method:'POST',body:fd})
          .then(function(r){return r.json();})
          .then(function(d){return d.secure_url||'';});
      })()
    : Promise.resolve('');

  fotoPromise.then(function(fotoUrl){
    return fetch('/api/galeria?action=enviarLugar',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        nombre:nombre,
        tipo:document.getElementById('sgLTipo').value,
        ubicacion:document.getElementById('sgLZona').value.trim(),
        telefono:document.getElementById('sgLTelefono').value.trim(),
        direccion:document.getElementById('sgLDireccion').value.trim(),
        descripcion:document.getElementById('sgLDesc').value.trim(),
        google_maps:document.getElementById('sgLMaps').value.trim(),
        imagen:fotoUrl,
        email:sessionEmail||''
      })
    }).then(function(r){return r.json();});
  }).then(function(d){
    if(d&&d.ok){
      mostrarMsgLugar('ok','#e0f7f7','#007a7a');
      btn.textContent='Enviado!';
      btn.disabled=true;
    } else {
      mostrarMsgLugar('Error al enviar','#fbeaf0','#c0392b');
      btn.disabled=false;btn.textContent='Enviar sugerencia';
    }
  }).catch(function(){
    mostrarMsgLugar('Error al enviar','#fbeaf0','#c0392b');
    btn.disabled=false;btn.textContent='Enviar sugerencia';
  });
}

function mostrarMsgLugar(txt,bg,color){
  if(bg==='#e0f7f7'){
    // Cerrar modal del formulario
    cerrarFormLugar();
    // Mostrar modal de gracias
    document.getElementById('modalGracias').classList.add('open');
    document.getElementById('modalGraciasContent').innerHTML='<div style="text-align:center;padding:8px 0">'
      +'<img src="' + ['https://raw.githubusercontent.com/petzidgt-debug/petmi-petzid/main/jefe1.png','https://raw.githubusercontent.com/petzidgt-debug/petmi-petzid/main/jefe2.jpg','https://raw.githubusercontent.com/petzidgt-debug/petmi-petzid/main/jefe3.jpg'][Math.floor(Math.random()*3)] + '" '
      +'style="width:180px;border-radius:12px;margin-bottom:10px" style="opacity:1">'
      +'<div style="font-size:15px;font-weight:700;color:#007a7a;margin-bottom:4px">Gracias por tu sugerencia! 🐾</div>'
      +'<div style="font-size:13px;color:#555">El jefe revisara tu sugerencia y pronto aparecera en la lista.</div>'
      +'</div>';
  } else {
    mostrarToast(txt);
  }
}

// ── Swipe to close ────────────────────────────────────────
function addSwipeClose(sheetId, closeFn){
  var el=document.getElementById(sheetId);
  if(!el)return;
  var startY=0,isDragging=false;
  el.addEventListener('touchstart',function(e){startY=e.touches[0].clientY;isDragging=true;});
  el.addEventListener('touchmove',function(e){
    if(!isDragging)return;
    var dy=e.touches[0].clientY-startY;
    if(dy>0) el.style.transform='translateY('+dy+'px)';
  });
  el.addEventListener('touchend',function(e){
    var dy=e.changedTouches[0].clientY-startY;
    if(dy>80){closeFn();}
    else{el.style.transform='translateY(0)';}
    isDragging=false;
  });
}
addSwipeClose('lugarSheet', cerrarFormLugar);
addSwipeClose('ratingSheet', closeRating);

function mostrarToast(msg){
  var el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('show');
  setTimeout(function(){el.classList.remove('show');},2500);
}
