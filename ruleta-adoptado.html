<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Abre tu Regalo — Día del Perro Adoptado — PetMi</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Arial,sans-serif;background:#f8f7f4;min-height:100vh;padding-bottom:100px}

.hero{background:linear-gradient(135deg,#1a1a2e,#F5C842);padding:26px 20px 22px;text-align:center}
.hero-label{font-size:11px;font-weight:700;color:rgba(255,255,255,.75);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.hero-title{font-size:23px;font-weight:900;color:#fff;margin-bottom:4px}
.hero-sub{font-size:13px;color:rgba(255,255,255,.85)}

.wrap{max-width:420px;margin:0 auto;padding:24px 16px;text-align:center}

.regalo-wrap{position:relative;width:220px;height:220px;margin:24px auto;cursor:pointer}
.regalo{font-size:120px;line-height:1;transition:transform .15s ease;user-select:none}
.regalo.temblando{animation:temblar .5s ease infinite}
.regalo.abierto{transform:scale(0) rotate(20deg);opacity:0}
@keyframes temblar{
  0%,100%{transform:rotate(0deg)}
  20%{transform:rotate(-6deg) scale(1.02)}
  40%{transform:rotate(5deg) scale(1.02)}
  60%{transform:rotate(-4deg) scale(1.03)}
  80%{transform:rotate(3deg) scale(1.02)}
}
.toca-txt{font-size:13px;color:#8a6200;font-weight:700;margin-top:10px}

.resultado-card{background:#fff;border-radius:16px;padding:28px 20px;border:0.5px solid #eee;margin-top:20px;display:none}
.resultado-emoji{font-size:56px;margin-bottom:10px;animation:popIn .4s cubic-bezier(.2,1.4,.4,1)}
@keyframes popIn{0%{transform:scale(0);opacity:0}100%{transform:scale(1);opacity:1}}
.resultado-nombre{font-size:20px;font-weight:900;color:#1a1a2e;margin-bottom:8px}
.resultado-sub{font-size:13px;color:#888;line-height:1.7}
.resultado-codigo{background:#f8f8f8;border:1.5px dashed #ccc;border-radius:10px;padding:12px;margin-top:14px;font-family:monospace;font-size:18px;font-weight:900;color:#1a1a2e;letter-spacing:1px}

.aviso{background:#FFF8E1;border:1px solid #F5C842;border-radius:12px;padding:14px 16px;margin:0 16px;font-size:13px;color:#8a6200;text-align:center;line-height:1.6}
.premios-list{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0}
.premio-chip{background:#fff;border:1px solid #eee;border-radius:12px;padding:12px 8px;text-align:center}
.premio-chip .emoji{font-size:22px;margin-bottom:4px}
.premio-chip .txt{font-size:11px;font-weight:700;color:#1a1a2e;line-height:1.3}
.premio-chip .lim{font-size:9px;color:#c0392b;margin-top:3px;font-weight:700}
.links-cuenta{display:flex;justify-content:center;gap:16px;margin-top:20px;font-size:12.5px}
.links-cuenta a{color:#00B4B4;text-decoration:none;font-weight:700}
.confeti-pieza{position:fixed;top:-10px;width:9px;height:14px;z-index:999;pointer-events:none;animation:caerConfeti linear forwards}
@keyframes caerConfeti{0%{transform:translateY(0) rotate(0deg);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:.9}}
</style>
</head>
<body>

<div class="hero">
  <div class="hero-label">🐾 23 de septiembre — Día del Perro Adoptado</div>
  <div class="hero-title">Abre tu Regalo</div>
  <div class="hero-sub">Un regalo especial para celebrar a las familias que adoptaron</div>
</div>

<div class="wrap" id="contenedor">
  <div style="color:#aaa;padding:40px 10px">Cargando...</div>
</div>

<script>
var sessionEmail = localStorage.getItem('petzid_email') || sessionStorage.getItem('petmiEmail') || '';
var miMascota = null;

var PREMIOS_INFO = {
  q100:            { emoji:'💵', nombre:'¡Q100 en efectivo!',        detalle:'Te vamos a contactar por WhatsApp para coordinar la entrega.' },
  descuento25:     { emoji:'🎉', nombre:'25% de descuento',          detalle:'Válido en tu próxima compra en la Tienda PetMi. Usa el código al pagar.' },
  descuento15:     { emoji:'✨', nombre:'15% de descuento',          detalle:'Válido en tu próxima compra en la Tienda PetMi. Usa el código al pagar.' },
  bano_cortesia:   { emoji:'🛁', nombre:'¡Baño de cortesía en Wazu!', detalle:'Te vamos a contactar por WhatsApp para coordinar tu cita.' }
};

function iniciar(){
  if(!sessionEmail){
    document.getElementById('contenedor').innerHTML = '<div class="aviso">🔒 Necesitas iniciar sesión para participar. <a href="/index.html" style="color:#8a6200;font-weight:700;text-decoration:underline">Inicia sesión</a>.</div>';
    return;
  }
  fetch('/api/galeria?action=checkEmail', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({action:'checkEmail', email: sessionEmail}) })
    .then(function(r){return r.json();})
    .then(function(d){
      var mascotas = (d && d.mascotas) || [];
      miMascota = mascotas.find(function(m){ return m.adoptado; }) || null;
      if(!miMascota){
        var primeraMascota = mascotas[0];
        var linkEditar = primeraMascota ? ('/editar.html?uid=' + primeraMascota.uid) : '/familia.html';
        document.getElementById('contenedor').innerHTML = '<div class="aviso">Este regalo es exclusivo para familias con una mascota marcada como <b>adoptada</b>. Si tu peludito fue adoptado y no lo marcaste al registrarte, puedes editarlo aquí:<br><br><a href="'+linkEditar+'" style="color:#8a6200;font-weight:700;text-decoration:underline">✏️ Editar perfil de mi mascota</a></div>';
        return;
      }
      render();
    }).catch(function(){
      document.getElementById('contenedor').innerHTML = '<div class="aviso">Hubo un error cargando tu información. Intenta de nuevo.</div>';
    });
}

function render(){
  document.getElementById('contenedor').innerHTML =
    '<div class="regalo-wrap" id="regaloWrap" onclick="abrirRegalo()">'
    + '<div class="regalo" id="regaloEmoji">🎁</div>'
    + '</div>'
    + '<div class="toca-txt" id="tocaTxt">👆 Toca el regalo para abrirlo</div>'
    + '<div class="resultado-card" id="resultadoCard"></div>'
    + '<div class="premios-list">'
    +   '<div class="premio-chip"><div class="emoji">💵</div><div class="txt">Q100 en efectivo</div><div class="lim">Solo 2 disponibles</div></div>'
    +   '<div class="premio-chip"><div class="emoji">🛁</div><div class="txt">Baño cortesía Wazu</div><div class="lim">Solo 10 disponibles</div></div>'
    +   '<div class="premio-chip"><div class="emoji">🎉</div><div class="txt">25% dto. Tienda</div></div>'
    +   '<div class="premio-chip"><div class="emoji">✨</div><div class="txt">15% dto. Tienda</div></div>'
    + '</div>'
    + '<div class="links-cuenta">'
    +   '<a href="/editar.html?uid='+miMascota.uid+'">✏️ Editar perfil</a>'
    +   '<a href="/familia.html">👨‍👩‍👧‍👦 Mi familia</a>'
    + '</div>';
}

var yaAbriendo = false;
function abrirRegalo(){
  if(yaAbriendo) return;
  yaAbriendo = true;
  var regalo = document.getElementById('regaloEmoji');
  var wrap = document.getElementById('regaloWrap');
  document.getElementById('tocaTxt').textContent = 'Abriendo...';
  regalo.classList.add('temblando');
  wrap.style.pointerEvents = 'none';

  fetch('/api/galeria?action=girarRuletaAdoptado', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ email: sessionEmail, uid_mascota: miMascota.uid })
  }).then(function(r){return r.json();})
  .then(function(d){
    if(!d.ok){
      alert(d.error || 'No se pudo abrir el regalo.');
      regalo.classList.remove('temblando');
      document.getElementById('tocaTxt').textContent = '👆 Toca el regalo para abrirlo';
      wrap.style.pointerEvents = 'auto';
      yaAbriendo = false;
      return;
    }
    setTimeout(function(){
      regalo.classList.remove('temblando');
      regalo.classList.add('abierto');
      document.getElementById('tocaTxt').style.display = 'none';
      mostrarResultado(PREMIOS_INFO[d.premio], d.codigo);
      lanzarConfeti();
    }, 900);
  }).catch(function(){
    alert('Error de conexión. Intenta de nuevo.');
    regalo.classList.remove('temblando');
    document.getElementById('tocaTxt').textContent = '👆 Toca el regalo para abrirlo';
    wrap.style.pointerEvents = 'auto';
    yaAbriendo = false;
  });
}

function mostrarResultado(info, codigo){
  var codigoHtml = codigo ? '<div class="resultado-codigo">'+codigo+'</div><div style="font-size:11.5px;color:#aaa;margin-top:8px">Pégalo en el campo de cupón al pagar en la Tienda</div>' : '';
  var card = document.getElementById('resultadoCard');
  card.innerHTML =
    '<div class="resultado-emoji">'+info.emoji+'</div>'
    + '<div class="resultado-nombre">'+info.nombre+'</div>'
    + '<div class="resultado-sub">'+info.detalle+'</div>'
    + codigoHtml;
  card.style.display = 'block';
}

function lanzarConfeti(){
  var colores = ['#00B4B4','#F5C842','#E05090','#7B61FF'];
  for(var i=0;i<40;i++){
    (function(){
      var p = document.createElement('div');
      p.className = 'confeti-pieza';
      p.style.left = Math.random()*100+'vw';
      p.style.background = colores[Math.floor(Math.random()*colores.length)];
      p.style.animationDuration = (2+Math.random()*1.5)+'s';
      document.body.appendChild(p);
      setTimeout(function(){ p.remove(); }, 4000);
    })();
  }
}

iniciar();
</script>
<script src="/header.js"></script>
</body>
</html>
