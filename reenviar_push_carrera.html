<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reenviar push — Carrera Alas de Esperanza</title>
<style>
body{font-family:Arial,sans-serif;background:#f8f7f4;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;border-radius:16px;padding:28px;max-width:380px;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.1)}
h2{color:#1a1a2e;font-size:18px;margin-bottom:8px}
p{color:#666;font-size:13px;line-height:1.5;margin-bottom:20px}
button{background:#1a1a2e;color:#fff;border:none;padding:14px 28px;border-radius:99px;font-weight:900;font-size:14px;cursor:pointer;width:100%}
button:disabled{opacity:.5}
#resultado{margin-top:16px;font-size:13px;font-weight:700}
</style>
</head>
<body>
<div class="card">
  <h2>🎉 Carrera Alas de Esperanza</h2>
  <p>Este botón manda el push de este evento a todos los usuarios con notificaciones de eventos activadas. <strong>Úsalo solo una vez.</strong></p>
  <button id="btn" onclick="enviar()">🔔 Enviar notificación ahora</button>
  <div id="resultado"></div>
</div>
<script>
function enviar(){
  var btn = document.getElementById('btn');
  var res = document.getElementById('resultado');
  btn.disabled = true; btn.textContent = 'Enviando...';
  fetch('https://app.revistapetmi.com/api/galeria?action=aprobarAviso', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ id: '95b0d5ca-f550-475d-982b-b4233876c73c' })
  })
  .then(function(r){ return r.json(); })
  .then(function(d){
    if(d.ok){
      res.style.color = '#2e7d32';
      res.textContent = '✓ Notificación enviada.';
      btn.textContent = 'Enviado ✓';
    } else {
      res.style.color = '#c0392b';
      res.textContent = 'Algo falló: ' + (d.error || 'intenta de nuevo');
      btn.disabled = false; btn.textContent = '🔔 Enviar notificación ahora';
    }
  })
  .catch(function(){
    res.style.color = '#c0392b';
    res.textContent = 'Error de conexión.';
    btn.disabled = false; btn.textContent = '🔔 Enviar notificación ahora';
  });
}
</script>
</body>
</html>
