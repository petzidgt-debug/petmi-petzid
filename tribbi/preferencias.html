<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<base href="/tribbi/">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#127A6E">
<title>Tus preferencias | Tribbi</title>
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tribbi-comun.css">
<style>
.wrap{max-width:560px;margin:0 auto;padding:0 20px 60px}
.top{padding:14px 0}
.res{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:28px 24px;text-align:center;margin-top:20px}
.res .e{font-size:3rem;line-height:1}
.res h1{color:var(--teal);font-size:1.8rem;margin:10px 0 6px}
.res p{color:var(--muted);margin:0 0 14px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a class="tb-logo" href="./" aria-label="Tribbi, inicio" style="font-size:34px">Tribb<span class="i" aria-hidden="true">i<svg class="c" style="left:-0.165em;top:.141em;--dx:0.2em" viewBox="35 547 181 181"><path transform="translate(0 1275) scale(1 -1)" d="M125 547Q80 547 61.0 560.5Q42 574 38.5 595.0Q35 616 35 638Q35 661 39.0 681.5Q43 702 62.0 715.0Q81 728 126 728Q171 728 189.5 714.5Q208 701 212.0 680.0Q216 659 216 637Q216 615 212.0 594.0Q208 573 189.5 560.0Q171 547 125 547Z" fill="#A24FD4"/></svg><svg class="c" style="left:0.235em;top:.141em;--dx:-0.2em" viewBox="35 547 181 181"><path transform="translate(0 1275) scale(1 -1)" d="M125 547Q80 547 61.0 560.5Q42 574 38.5 595.0Q35 616 35 638Q35 661 39.0 681.5Q43 702 62.0 715.0Q81 728 126 728Q171 728 189.5 714.5Q208 701 212.0 680.0Q216 659 216 637Q216 615 212.0 594.0Q208 573 189.5 560.0Q171 547 125 547Z" fill="#4C8DF6"/></svg><svg class="c" style="left:-0.065em;top:.141em;--dx:0.1em" viewBox="35 547 181 181"><path transform="translate(0 1275) scale(1 -1)" d="M125 547Q80 547 61.0 560.5Q42 574 38.5 595.0Q35 616 35 638Q35 661 39.0 681.5Q43 702 62.0 715.0Q81 728 126 728Q171 728 189.5 714.5Q208 701 212.0 680.0Q216 659 216 637Q216 615 212.0 594.0Q208 573 189.5 560.0Q171 547 125 547Z" fill="#F2553D"/></svg><svg class="c" style="left:0.135em;top:.141em;--dx:-0.1em" viewBox="35 547 181 181"><path transform="translate(0 1275) scale(1 -1)" d="M125 547Q80 547 61.0 560.5Q42 574 38.5 595.0Q35 616 35 638Q35 661 39.0 681.5Q43 702 62.0 715.0Q81 728 126 728Q171 728 189.5 714.5Q208 701 212.0 680.0Q216 659 216 637Q216 615 212.0 594.0Q208 573 189.5 560.0Q171 547 125 547Z" fill="#F5AF35"/></svg><svg class="c p" style="left:.035em;top:.141em" viewBox="35 547 181 181"><path transform="translate(0 1275) scale(1 -1)" d="M125 547Q80 547 61.0 560.5Q42 574 38.5 595.0Q35 616 35 638Q35 661 39.0 681.5Q43 702 62.0 715.0Q81 728 126 728Q171 728 189.5 714.5Q208 701 212.0 680.0Q216 659 216 637Q216 615 212.0 594.0Q208 573 189.5 560.0Q171 547 125 547Z"/></svg></span></a></div>
  <div class="res" id="res" role="status" aria-live="polite"><p>Guardando tu respuesta…</p></div>
</div>
<script src="tribbi-comun.js"></script>
<script>
(function(){
'use strict';
const T=window.Tribbi,{$,esc,rpc}=T;
const P=new URLSearchParams(location.search),TOKEN=(P.get('t')||'').replace(/[^a-f0-9]/gi,'');
async function guardar(si){
  if(!TOKEN){$('#res').innerHTML='<div class="e">🤔</div><h1>Enlace incompleto</h1><p>Abre el botón desde el correo de Tribbi.</p>';return}
  const r=await rpc('tribbi_preferencias',{p_token:TOKEN,p_acepta:si});
  if(!r.ok){$('#res').innerHTML=`<div class="e">🤔</div><h1>No pudimos guardar tu respuesta</h1><p>${esc(r.d.mensaje||'Intenta de nuevo desde el correo.')}</p>`;return}
  const n=r.d.nombre?`, ${esc(r.d.nombre)}`:'';
  $('#res').innerHTML=si
    ?`<div class="e">🎉</div><h1>¡Listo${n}!</h1><p>Te avisaremos de nuevos intercambios, BookPal y promos. Puedes darte de baja cuando quieras desde cualquier correo.</p><button class="tb-link" data-cambiar="no">Mejor no, gracias</button>`
    :`<div class="e">👍</div><h1>Entendido${n}</h1><p>No te enviaremos promociones. Tu cuenta y tus intercambios siguen igual.</p><button class="tb-link" data-cambiar="si">Cambié de opinión: sí quiero</button>`;
}
$('#res').addEventListener('click',e=>{const b=e.target.closest('[data-cambiar]');if(b)guardar(b.dataset.cambiar==='si')});
guardar(P.get('r')!=='no');
})();
</script>
</body>
</html>
