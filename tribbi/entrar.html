<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<base href="/tribbi/">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FAFAF5">
<title>Entrar | Tribbi</title>
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tribbi-comun.css">
<style>
.wrap{max-width:680px;margin:0 auto;padding:0 20px 60px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 0}
h1.big{font-size:clamp(2rem,7vw,2.8rem);line-height:1.05;margin:10px 0 4px;color:var(--teal)}
.lead{color:var(--muted);margin:0 0 6px}
h2.grp{font-size:1.25rem;margin:26px 0 8px}
.item{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 16px;margin-top:10px}
.item b{display:block;font-family:"Fredoka",sans-serif;font-size:1.1rem}
.item small{display:block;color:var(--muted)}
.item .tb-btn{flex:none}
.empty{color:var(--muted);background:var(--soft);border-radius:14px;padding:12px 14px;margin-top:10px}
.crear{display:block;text-align:center;margin-top:22px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a class="tb-logo" href="./" aria-label="Tribbi, inicio" style="font-size:34px">Tribb<span class="i" aria-hidden="true">i<svg class="c" style="left:-0.165em;top:.141em;--dx:0.2em" viewBox="35 547 181 181"><path transform="translate(0 1275) scale(1 -1)" d="M125 547Q80 547 61.0 560.5Q42 574 38.5 595.0Q35 616 35 638Q35 661 39.0 681.5Q43 702 62.0 715.0Q81 728 126 728Q171 728 189.5 714.5Q208 701 212.0 680.0Q216 659 216 637Q216 615 212.0 594.0Q208 573 189.5 560.0Q171 547 125 547Z" fill="#F7B3C6"/></svg><svg class="c" style="left:0.235em;top:.141em;--dx:-0.2em" viewBox="35 547 181 181"><path transform="translate(0 1275) scale(1 -1)" d="M125 547Q80 547 61.0 560.5Q42 574 38.5 595.0Q35 616 35 638Q35 661 39.0 681.5Q43 702 62.0 715.0Q81 728 126 728Q171 728 189.5 714.5Q208 701 212.0 680.0Q216 659 216 637Q216 615 212.0 594.0Q208 573 189.5 560.0Q171 547 125 547Z" fill="#E86F94"/></svg><svg class="c" style="left:-0.065em;top:.141em;--dx:0.1em" viewBox="35 547 181 181"><path transform="translate(0 1275) scale(1 -1)" d="M125 547Q80 547 61.0 560.5Q42 574 38.5 595.0Q35 616 35 638Q35 661 39.0 681.5Q43 702 62.0 715.0Q81 728 126 728Q171 728 189.5 714.5Q208 701 212.0 680.0Q216 659 216 637Q216 615 212.0 594.0Q208 573 189.5 560.0Q171 547 125 547Z" fill="#F2C14E"/></svg><svg class="c" style="left:0.135em;top:.141em;--dx:-0.1em" viewBox="35 547 181 181"><path transform="translate(0 1275) scale(1 -1)" d="M125 547Q80 547 61.0 560.5Q42 574 38.5 595.0Q35 616 35 638Q35 661 39.0 681.5Q43 702 62.0 715.0Q81 728 126 728Q171 728 189.5 714.5Q208 701 212.0 680.0Q216 659 216 637Q216 615 212.0 594.0Q208 573 189.5 560.0Q171 547 125 547Z" fill="#36D6C4"/></svg><svg class="c p" style="left:.035em;top:.141em" viewBox="35 547 181 181"><path transform="translate(0 1275) scale(1 -1)" d="M125 547Q80 547 61.0 560.5Q42 574 38.5 595.0Q35 616 35 638Q35 661 39.0 681.5Q43 702 62.0 715.0Q81 728 126 728Q171 728 189.5 714.5Q208 701 212.0 680.0Q216 659 216 637Q216 615 212.0 594.0Q208 573 189.5 560.0Q171 547 125 547Z"/></svg></span></a>
  <button class="tb-link" id="salirBtn" hidden>Salir</button></div>

  <div id="vLogin" hidden></div>

  <form class="tb-box" id="vNueva" hidden novalidate>
    <h1>Crea tu nueva contraseña</h1>
    <p>Escribe una contraseña nueva para tu cuenta.</p>
    <label>Contraseña nueva<input class="tb-field" name="clave" type="password" autocomplete="new-password" minlength="6" maxlength="72"></label>
    <label>Repítela<input class="tb-field" name="clave2" type="password" autocomplete="new-password" maxlength="72"></label>
    <div class="tb-err" role="alert"></div>
    <button class="tb-btn" type="submit">Guardar contraseña</button>
  </form>

  <div id="vMis" hidden>
    <h1 class="big" id="hola">Mis intercambios</h1>
    <p class="lead">Todo lo tuyo en un solo lugar.</p>
    <p class="tb-msg ok" id="aviso" role="status"></p>
    <h2 class="grp">Participo</h2>
    <div id="participo"></div>
    <h2 class="grp">Organizo</h2>
    <div id="organizo"></div>
    <a class="tb-btn coral crear" href="organizar.html">+ Crear un amigo secreto</a>
  </div>
</div>

<script src="tribbi-comun.js"></script>
<script>
(function(){
'use strict';
const T=window.Tribbi,{$,esc,rpc}=T;
const show=v=>['vLogin','vNueva','vMis'].forEach(x=>$('#'+x).hidden=x!==v);

async function inicio(){
  const tipo=T.sesionDesdeEnlace();
  if(tipo==='recovery'){show('vNueva');$('#salirBtn').hidden=false;$('#vNueva').clave.focus();return}
  if(await T.token()){await mis();return}
  login();
}
function login(){$('#salirBtn').hidden=true;show('vLogin');T.montarLogin($('#vLogin'),{titulo:'Entrar',texto:'Entra con tu correo y tu contraseña para ver tus intercambios.',onEntrar:mis})}
$('#salirBtn').onclick=async()=>{await T.salir();login()};

$('#vNueva').addEventListener('submit',async e=>{
  e.preventDefault();const f=e.target,err=f.querySelector('.tb-err');err.textContent='';
  if(f.clave.value.length<6){err.textContent='La contraseña debe tener al menos 6 caracteres.';return}
  if(f.clave.value!==f.clave2.value){err.textContent='Las contraseñas no coinciden.';return}
  const m=await T.cambiarClave(f.clave.value);if(m){err.textContent=m;return}
  f.reset();await mis();$('#aviso').textContent='Listo, tu contraseña nueva ya funciona.';
});

async function mis(){
  $('#salirBtn').hidden=false;
  const r=await rpc('tribbi_mis_intercambios');
  if(!r.ok){if(r.d.error==='sesion'){T.borrarSesion();login();return}show('vMis');$('#participo').innerHTML=`<p class="tb-msg bad">${esc(r.d.error==='falta_sql'?'Falta correr 6_activacion_y_ninos.sql en Supabase.':r.d.mensaje||'No se pudo cargar.')}</p>`;return}
  show('vMis');const d=r.d;
  $('#hola').textContent=d.perfil&&d.perfil.nombre_publico?`Hola, ${d.perfil.nombre_publico}`:'Mis intercambios';
  $('#participo').innerHTML=d.participo.length?d.participo.map(x=>{
    const href=(x.con_envio?'tribbi.html':'amigo-secreto.html')+'?e='+encodeURIComponent(x.slug);
    const est=x.estado==='pendiente_pago'?'falta pagar el envío':!x.sorteo_hecho?'esperando el sorteo':x.descubrio?'ya descubriste':'¡ya puedes raspar tu tarjeta!';
    return `<div class="item"><span style="display:flex;gap:12px;align-items:center;min-width:0">${T.portadaHTML(x,'thumb')}<span><b>${esc(x.nombre)}</b><small>${esc([x.cuenta,'como '+x.como].filter(Boolean).join(' · '))}</small>
      ${x.ninos.length?`<small>A tu cargo: ${esc(x.ninos.join(', '))}</small>`:''}<small>${esc(est)}</small></span></span><a class="tb-btn sm" href="${href}">Abrir</a></div>`}).join('')
    :'<p class="empty">Todavía no participas en ningún intercambio. Si te invitaron, abre el enlace que te mandaron.</p>';
  const recs=d.organizo.map(x=>({x,r:T.recordatorioSorteo(x)})).filter(o=>o.r);
  $('#aviso').insertAdjacentHTML('afterend','');
  document.querySelectorAll('.tb-recordatorio').forEach(n=>n.remove());
  if(recs.length)$('#hola').insertAdjacentHTML('afterend',recs.map(o=>`<div class="tb-recordatorio" role="status"><span>${esc(o.r.t)}<small>${esc(o.r.s)}</small></span><a class="tb-btn sm coral" href="organizar.html?e=${encodeURIComponent(o.x.slug)}">Ir al sorteo</a></div>`).join(''));
  $('#organizo').innerHTML=d.organizo.length?d.organizo.map(x=>`<div class="item"><span style="display:flex;gap:12px;align-items:center;min-width:0">${T.portadaHTML(x,'thumb')}<span><b>${esc(x.nombre)}</b><small>${esc(x.cuenta)} · ${Number(x.participantes)} participantes · ${x.sorteo_hecho?'sorteo hecho':'sin sortear'}</small></span></span>
      <a class="tb-btn sm" href="organizar.html?e=${encodeURIComponent(x.slug)}">Administrar</a></div>`).join('')
    :'<p class="empty">No organizas ningún intercambio todavía.</p>';
}
inicio();
})();
</script>
</body>
</html>
