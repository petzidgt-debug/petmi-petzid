<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<base href="/tribbi/">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FAFAF5">
<title>Modo fiesta | Tribbi</title>
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tribbi-comun.css">
<style>
.wrap{max-width:560px;margin:0 auto;padding:6px 18px 30px}
[hidden]{display:none!important}
.tag{display:inline-block;font-size:.85rem;font-weight:700;background:var(--soft);border-radius:999px;padding:3px 12px;color:var(--muted);margin-top:10px}
h1.big{font-size:2.2rem;margin:6px 0 2px;color:var(--teal)}
.lead{color:var(--muted);margin:0 0 16px}
.juegos{display:grid;gap:12px}
.juego-card{display:flex;gap:14px;align-items:center;width:100%;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:20px;padding:16px;cursor:pointer;font:inherit;color:var(--ink)}
.juego-card:not([disabled]):hover{border-color:var(--teal)}
.juego-card[disabled]{opacity:.6;cursor:default}
.juego-card .e{font-size:2.2rem;line-height:1}.juego-card b{display:block;font-family:"Fredoka",sans-serif;font-size:1.25rem}.juego-card small{color:var(--muted)}
.pronto{margin-left:auto;font-size:.78rem;font-weight:700;background:#FBEFC8;color:#3A2A00;border-radius:999px;padding:2px 10px;white-space:nowrap}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat{display:flex;flex-direction:column;align-items:flex-start;gap:4px;border:2px solid var(--line);background:var(--card);border-radius:18px;padding:14px;cursor:pointer;font:inherit;color:var(--ink);text-align:left}
.cat[aria-pressed="true"]{border-color:var(--teal);background:var(--soft)}
.cat .e{font-size:1.8rem;line-height:1}.cat b{font-family:"Fredoka",sans-serif;font-size:1.08rem}.cat small{color:var(--muted)}
.lbl{font-weight:700;margin:18px 0 8px}
.seg{display:flex;gap:8px}
.seg button{flex:1;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:10px;font:inherit;font-weight:700;color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{border-color:var(--teal);color:var(--teal);background:var(--soft)}
.grande{display:block;width:100%;margin-top:20px;font-size:1.2rem;padding:14px}
.cuenta{min-height:60vh;display:grid;place-items:center;font-family:"Fredoka",sans-serif;font-size:8rem;font-weight:700;color:var(--teal)}
.mesa{display:flex;flex-direction:column;min-height:calc(100vh - 140px)}
.barra{height:12px;border-radius:999px;background:var(--soft);overflow:hidden;margin-top:12px}
.barra span{display:block;height:100%;background:var(--teal);transition:width 1s linear}
.reloj{display:flex;justify-content:space-between;font-weight:700;color:var(--muted);margin:8px 0 0}
.tarjeta{flex:1;min-height:240px;margin:16px 0;border-radius:28px;background:var(--card);border:3px solid var(--teal);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
.tarjeta .c{font-weight:700;color:var(--muted);font-size:.95rem}
.tarjeta .p{font-family:"Fredoka",sans-serif;font-size:clamp(2.2rem,10vw,3.4rem);font-weight:700;line-height:1.05;margin-top:8px;overflow-wrap:anywhere}
.acciones{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.acciones button{border:0;border-radius:22px;padding:18px 10px;font-family:"Fredoka",sans-serif;font-size:1.3rem;font-weight:600;cursor:pointer}
.b-pasar{background:var(--soft);color:var(--ink)}
.b-si{background:#1F8A5B;color:#fff}
.fin{text-align:center}
.fin .n{font-family:"Fredoka",sans-serif;font-size:4.5rem;font-weight:700;color:var(--teal);line-height:1;margin:6px 0 0}
.lista{list-style:none;padding:0;margin:16px 0 0;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:18px}
.lista li{padding:8px 14px;border-top:1px dashed var(--line);display:flex;gap:10px}.lista li:first-child{border-top:0}
.lista .no{color:var(--muted);text-decoration:line-through}
.sec-btn{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:12px;font:inherit;font-weight:700;cursor:pointer}
@media (prefers-reduced-motion:reduce){.barra span{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <span class="tag" id="tag">🎉 Modo fiesta</span>

  <section id="vMenu">
    <h1 class="big">Modo fiesta</h1>
    <p class="lead">Juegos para el día del intercambio. Se juegan todos juntos con un solo celular.</p>
    <div class="juegos">
      <button class="juego-card" data-ir="vInicio"><span class="e" aria-hidden="true">🎭</span><span><b>Mímica</b><small>Actúa sin hablar y que tu equipo adivine.</small></span></button>
      <button class="juego-card" disabled><span class="e" aria-hidden="true">🕵️</span><span><b>Impostor</b><small>Todos saben la palabra… menos uno.</small></span><span class="pronto">Muy pronto</span></button>
      <button class="juego-card" disabled><span class="e" aria-hidden="true">🎡</span><span><b>Ruleta</b><small>Gira y cae en alguien del intercambio.</small></span><span class="pronto">Muy pronto</span></button>
    </div>
  </section>

  <section id="vInicio" hidden>
    <h1 class="big">🎭 Mímica</h1>
    <p class="lead">Una persona actúa sin hablar y los demás adivinan. Pasa el celular en cada turno.</p>
    <p class="lbl">Categorías</p>
    <div class="cats" id="cats"></div>
    <p class="lbl">Tiempo por turno</p>
    <div class="seg" id="tiempos"><button data-t="30" aria-pressed="false">30 s</button><button data-t="60" aria-pressed="true">60 s</button><button data-t="90" aria-pressed="false">90 s</button></div>
    <button class="tb-btn grande" id="empezar">Empezar turno</button>
    <button class="sec-btn" data-ir="vMenu">← Otros juegos</button>
  </section>

  <section id="vCuenta" class="cuenta" hidden aria-live="assertive"></section>

  <section id="vJuego" class="mesa" hidden>
    <div class="barra" aria-hidden="true"><span id="barra" style="width:100%"></span></div>
    <div class="reloj"><span id="seg"></span><span id="pts">0 adivinadas</span></div>
    <div class="tarjeta" aria-live="polite"><span class="c" id="cat"></span><span class="p" id="pal"></span></div>
    <div class="acciones"><button class="b-pasar" id="pasar">✗ Pasar</button><button class="b-si" id="ok">✓ ¡Adivinaron!</button></div>
  </section>

  <section id="vFin" class="fin" hidden>
    <h1 class="big">¡Se acabó el tiempo!</h1>
    <p class="n" id="total">0</p><p class="lead">adivinadas</p>
    <ul class="lista" id="lista"></ul>
    <button class="tb-btn grande" id="otro">Siguiente turno</button>
    <button class="sec-btn" data-ir="vInicio">Cambiar categorías</button>
  </section>
</div>
<script src="tribbi-comun.js"></script>
<script>
(function(){
'use strict';
const T=window.Tribbi,{$,esc,rpc}=T;
T.montarMenu('');
const SLUG=(new URLSearchParams(location.search).get('e')||'').toLowerCase().replace(/[^a-z0-9-]/g,'');
if(SLUG)rpc('tribbi_edicion',{p_slug:SLUG}).then(r=>{if(r.ok&&r.d.nombre){$('#tag').textContent='🎉 Modo fiesta · '+r.d.nombre;document.title='Modo fiesta · '+r.d.nombre}});
const CATS={"canciones": {"e": "🎵", "n": "Canciones", "d": "Hits latinos y clásicos", "p": ["La Macarena", "Despacito", "La bamba", "Bailando", "Vivir mi vida", "Waka Waka", "Gasolina", "Livin' la vida loca", "Hips don't lie", "Mi gente", "Suavemente", "Ella baila sola", "Tusa", "La gozadera", "Danza Kuduro", "Pobre diablo", "Corazón espinado", "Rayando el sol", "Bésame mucho", "El taxi", "La vida es un carnaval", "Color esperanza", "Clavado en un bar", "Labios compartidos", "Me gustas tú", "La camisa negra", "Felices los 4", "Chantaje", "Propuesta indecente", "Provenza", "Pepas", "Oye cómo va", "Cielito lindo", "Guantanamera", "El rey", "Querida", "Baila esta cumbia", "Thriller", "YMCA", "Gangnam Style", "We will rock you", "Bohemian Rhapsody", "Dancing Queen",  "Let it go", "Despeinada", "La chica de humo", "Mi primer millón"]}, "peliculas": {"e": "🎬", "n": "Películas navideñas", "d": "Las de cada diciembre", "p": ["Mi pobre angelito", "Mi pobre angelito 2", "El Grinch", "Elf", "El expreso polar", "Klaus", "Santa Cláusula", "Los fantasmas de Scrooge", "El extraño mundo de Jack", "Milagro en la calle 34", "Duro de matar", "Gremlins", "Frozen", "Love Actually", "El regalo prometido", "Una Navidad de locos", "Cuento de Navidad", "Operación regalo", "El origen de los guardianes", "¡Socorro! Ya es Navidad", "El descanso", "Rodolfo el reno", "Frosty el muñeco de nieve", "El cascanueces", "Krampus", "Fred Claus", "Navidad con los Muppets", "Las crónicas de Navidad", "Un príncipe de Navidad", "Feliz Navidad, Charlie Brown"]}, "chapinas": {"e": "🫔", "n": "Cosas chapinas", "d": "Muy de Guatemala", "p": ["Tamales", "Ponche", "Cohetes", "Quema del diablo", "Fiambre", "Chuchitos", "Marimba", "Camioneta", "Tuk tuk", "Volcán de Fuego", "Lago de Atitlán", "Rellenitos", "Atol de elote", "Piñata", "Posada", "Champurradas", "Tortillas con frijol", "Mercado", "Barrilete gigante", "Chicharrones", "Pepián", "Tikal", "Antigua Guatemala", "Quetzal", "Pollo Campero", "Shuco", "Tostadas", "Elote loco", "Mangos con pepita", "Chocolate de Cobán", "Alfombra de Semana Santa", "Procesión", "Torito de feria", "Baile del venado", "Chapulín", "Jocotes", "Molletes", "Buñuelos", "Chocobanano", "Helado de garrafa", "Feria de Jocotenango", "Volcán de Pacaya", "Café de Guatemala", "Güipil", "Mercado de Chichicastenango"]}, "animales": {"e": "🐶", "n": "Animales y mascotas", "d": "Guiño a PetMi", "p": ["Perro persiguiendo su cola", "Gato enojado", "Loro que habla", "Tortuga", "Canguro", "Pingüino", "Perezoso", "Quetzal", "Pez en la pecera", "Conejo", "Pulpo", "Elefante", "Gallina", "Serpiente", "Mono", "Perro pidiendo comida", "Gato bañándose", "Perro al que bañan", "Hámster en su rueda", "Caballo", "Vaca", "Cerdo", "Pato", "Jirafa", "León", "Cocodrilo", "Mariposa", "Abeja", "Murciélago", "Búho", "Flamenco", "Foca", "Delfín", "Tiburón", "Cangrejo", "Rana", "Gusano", "Avestruz", "Perro que encuentra un hueso", "Gato que tira cosas de la mesa"]}};
let sel=new Set(Object.keys(CATS)),tiempo=60,mazo=[],t=0,timer=null,hechas=[],actual=null;
const vistas=['vMenu','vInicio','vCuenta','vJuego','vFin'];
const ver=v=>{vistas.forEach(x=>$('#'+x).hidden=x!==v);window.scrollTo(0,0)};
document.addEventListener('click',e=>{const b=e.target.closest('[data-ir]');if(b&&!b.disabled){clearInterval(timer);ver(b.dataset.ir)}});
function pintarCats(){$('#cats').innerHTML=Object.entries(CATS).map(([k,c])=>`<button class="cat" data-k="${k}" aria-pressed="${sel.has(k)}"><span class="e" aria-hidden="true">${c.e}</span><b>${esc(c.n)}</b><small>${esc(c.d)}</small></button>`).join('');$('#empezar').disabled=!sel.size}
$('#cats').addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(!b)return;sel.has(b.dataset.k)?sel.delete(b.dataset.k):sel.add(b.dataset.k);pintarCats()});
$('#tiempos').addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(!b)return;tiempo=+b.dataset.t;document.querySelectorAll('#tiempos button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))});
/* No repetir tarjetas en la misma noche (se guarda en este celular) */
const usadas=new Set((()=>{try{return JSON.parse(sessionStorage.getItem('tb_mimica_'+SLUG)||'[]')}catch(e){return []}})());
const guardarUsadas=()=>{try{sessionStorage.setItem('tb_mimica_'+SLUG,JSON.stringify([...usadas]))}catch(e){}};
function barajar(){mazo=[];sel.forEach(k=>CATS[k].p.forEach(p=>{if(!usadas.has(p))mazo.push({k,p})}));
  if(!mazo.length){usadas.clear();sel.forEach(k=>CATS[k].p.forEach(p=>mazo.push({k,p})))}
  for(let i=mazo.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[mazo[i],mazo[j]]=[mazo[j],mazo[i]]}}
function siguiente(){if(!mazo.length)barajar();const c=mazo.pop();usadas.add(c.p);guardarUsadas();$('#cat').textContent=CATS[c.k].e+' '+CATS[c.k].n;$('#pal').textContent=c.p;return c}
function empezar(){barajar();hechas=[];let n=3;ver('vCuenta');$('#vCuenta').textContent=n;
  const iv=setInterval(()=>{n--;if(n>0)$('#vCuenta').textContent=n;else{clearInterval(iv);jugar()}},800)}
function jugar(){ver('vJuego');t=tiempo;actual=siguiente();const b=$('#barra');b.style.transition='none';b.style.width='100%';void b.offsetWidth;b.style.transition='';pintar();
  clearInterval(timer);timer=setInterval(()=>{t--;pintar();if(t<=0)terminar()},1000)}
function pintar(){$('#seg').textContent=`⏱ ${t} s`;$('#barra').style.width=(t/tiempo*100)+'%';$('#pts').textContent=`${hechas.filter(h=>h.ok).length} adivinadas`}
function marcar(ok){if(!actual||t<=0)return;hechas.push({p:actual.p,ok});try{navigator.vibrate&&navigator.vibrate(ok?60:[30,40,30])}catch(e){}actual=siguiente();pintar()}
function terminar(){clearInterval(timer);try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}ver('vFin');const ok=hechas.filter(h=>h.ok);$('#total').textContent=ok.length;
  if(ok.length&&!T.reduced)T.confetti();
  $('#lista').innerHTML=hechas.length?hechas.map(h=>`<li>${h.ok?'✅':'⏭️'} <span class="${h.ok?'':'no'}">${esc(h.p)}</span></li>`).join(''):'<li>No hubo tarjetas en este turno.</li>'}
$('#empezar').onclick=empezar;$('#otro').onclick=empezar;$('#ok').onclick=()=>marcar(true);$('#pasar').onclick=()=>marcar(false);
pintarCats();ver('vMenu');
})();
</script>
</body>
</html>
