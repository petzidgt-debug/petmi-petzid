<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link rel="icon" href="/favico.jpg" type="image/jpeg">
<title>Perfil PetMi</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Arial,sans-serif;background:#f0f0ee;min-height:100vh}

/* Fondo de marca detrás de la tarjeta (solo visible en pantallas anchas) */
.page-bg{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:0 0 40px}

@media (min-width:600px){
  .page-bg{background:linear-gradient(160deg,#00B4B4 0%,#00B4B4 35%,#f0f0ee 35%,#f0f0ee 100%)}
  .wrap{box-shadow:0 20px 60px rgba(0,0,0,.18);border-radius:20px;overflow:hidden;margin-top:12px}
}

/* HERO FOTO */
.foto-wrap{position:relative;height:320px;background:#e0f7f7;overflow:hidden}
.foto-wrap img{width:100%;height:100%;object-fit:cover}
.foto-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:80px;background:linear-gradient(135deg,#e0f7f7,#00B4B4)}
.foto-overlay{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.65));padding:24px 16px 20px}
.foto-nombre{font-size:30px;font-weight:900;font-family:'Arial Black',Arial;color:#fff;line-height:1.1}
.foto-apodo{font-size:14px;color:rgba(255,255,255,.8);font-style:italic;margin-top:3px}
.foto-raza{font-size:13px;color:rgba(255,255,255,.7);margin-top:4px}
.badge-premium{position:absolute;top:14px;right:14px;background:#F5C842;color:#1a1a2e;font-size:10px;font-weight:700;padding:5px 12px;border-radius:999px}

/* ANGELITO — tratamiento de memorial */
.foto-wrap.es-angelito{filter:grayscale(35%)}
.badge-angelito{position:absolute;top:14px;left:14px;background:rgba(107,91,140,.92);color:#fff;font-size:10px;font-weight:700;padding:5px 12px;border-radius:999px}
.memorial-card{background:#F5F3F9;border:1.5px solid #E8E4F0;border-radius:14px;padding:16px;margin-bottom:16px;text-align:center}
.memorial-titulo{font-size:14px;font-weight:700;color:#1a1a2e;margin-bottom:6px}
.memorial-texto{font-size:12.5px;color:#666;line-height:1.7}
/* MURO DE CONDOLENCIAS */
.condolencias-titulo{font-size:14px;font-weight:700;color:#222;margin:4px 0 10px}
.condolencia-form{background:#F5F3F9;border-radius:14px;padding:14px;margin-bottom:14px}
.condolencia-form input,.condolencia-form textarea{width:100%;border:1px solid #E8E4F0;border-radius:10px;padding:10px 12px;font-family:Arial,sans-serif;font-size:13px;margin-bottom:8px;background:#fff}
.condolencia-form textarea{resize:vertical;min-height:60px}
.btn-enviar-msj{width:100%;padding:11px;background:#6B5B8C;color:#fff;border:none;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer}
.condolencia-item{background:#fff;border:1px solid #eee;border-radius:12px;padding:12px 14px;margin-bottom:8px}
.condolencia-nombre{font-size:13px;font-weight:700;color:#222}
.condolencia-fecha{font-size:10px;color:#aaa;margin-left:6px}
.condolencia-msj{font-size:13px;color:#555;line-height:1.6;margin-top:4px}
.condolencias-vacio{font-size:12.5px;color:#999;text-align:center;padding:12px}

/* INFO CARD */
.info-card{background:#fff;border-radius:20px 20px 0 0;margin-top:-20px;position:relative;z-index:2;padding:20px 16px 0}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.info-item{background:#f8f8f8;border-radius:12px;padding:12px 14px}
.info-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#aaa;margin-bottom:4px}
.info-valor{font-size:14px;font-weight:700;color:#222}

/* RESPONSABLE */
.resp-card{background:#f0f0ee;border-radius:14px;padding:14px 16px;margin-bottom:16px;display:flex;align-items:center;gap:12px}
.resp-ico{width:42px;height:42px;border-radius:10px;background:#00B4B4;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.resp-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#aaa;margin-bottom:3px}
.resp-nombre{font-size:15px;font-weight:700;color:#222}

/* BOTONES */
.btns{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
.btn-contactar{width:100%;padding:14px;background:#00B4B4;color:#fff;border:none;border-radius:14px;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-petmi{width:100%;padding:12px;background:#f0f0ee;color:#555;border:none;border-radius:14px;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}

/* NO PREMIUM */
.no-premium{text-align:center;padding:48px 20px;background:#f0f0ee;min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center}
.no-premium-ico{font-size:64px;margin-bottom:16px}
.no-premium-titulo{font-size:20px;font-weight:900;color:#222;margin-bottom:8px}
.no-premium-sub{font-size:14px;color:#888;line-height:1.7;margin-bottom:24px}

/* FOOTER (igual a galeria.html) */
.footer{background:#1a1a2e;padding:24px;text-align:center;margin-top:40px}
.footer-brand{font-size:18px;font-weight:900;font-family:'Arial Black',Arial,sans-serif;color:#fff;margin-bottom:8px}
.footer-brand span{color:#F5C842}
.footer-sub{font-size:12px;color:rgba(255,255,255,.4)}

/* SPINNER */
.spinner-wrap{min-height:60vh;display:flex;align-items:center;justify-content:center}
.spinner{width:40px;height:40px;border:3px solid #f0f0f0;border-top-color:#00B4B4;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.wrap{max-width:480px;width:100%;margin:0 auto;background:#f0f0ee}
</style>
</head>
<body>
<div class="page-bg">
  <div class="wrap" id="root">
    <div class="spinner-wrap"><div class="spinner"></div></div>
  </div>
</div>

<script>
var SUPA_URL='https://ilcreewilnkchvozicyp.supabase.co';
var SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlsY3JlZXdpbG5rY2h2b3ppY3lwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwMDU3NTIsImV4cCI6MjA5MzU4MTc1Mn0.X5QoGsMIKU0oWd0q0qvKYxlbb1tZfMvttBxOwL0BCoM';
var H={'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY};

// Obtener UID del URL: /p/UID o /p.html?uid=UID
var uid=null;
var path=window.location.pathname;
var match=path.match(/\/p\/(.+)/);
if(match) uid=match[1].split('?')[0];
else uid=new URLSearchParams(window.location.search).get('uid');

// ¿Es el dueño quien visita? (el link del correo de Angelito agrega ?owner=1)
var esVisitanteDueno=new URLSearchParams(window.location.search).get('owner')==='1';

// Sesión del visitante — para poder mandar mensaje interno (reemplaza WhatsApp)
var sessionEmailVisitante=localStorage.getItem('petzid_email')||'';
var miUidVisitante=null;
if(sessionEmailVisitante){
  fetch('/api/galeria?action=checkEmail',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({action:'checkEmail',email:sessionEmailVisitante})
  }).then(function(r){return r.json();})
  .then(function(d){
    if(d.found && d.mascotas && d.mascotas.length) miUidVisitante=d.mascotas[0].uid;
  }).catch(function(){});
}

if(!uid){
  document.getElementById('root').innerHTML='<div class="no-premium"><div class="no-premium-ico">🐾</div><div class="no-premium-titulo">Perfil no encontrado</div><div class="no-premium-sub">No se especificó una mascota.</div><a href="/galeria.html" style="color:#00B4B4;font-weight:700">Ver galería →</a></div>';
} else {
  cargarPerfil();
}

function cargarPerfil(){
  var campos = 'uid,nombre,apodo,especie,raza,sexo,fecha,zona,dueno,foto,whatsapp,premium,angelito,slug';
  // Primero busca por slug (links nuevos, ej. /p/pepe)
  fetch(SUPA_URL+'/rest/v1/mascotas?slug=eq.'+encodeURIComponent(uid.toLowerCase())+'&select='+campos,{headers:H})
  .then(function(r){return r.json();})
  .then(function(rows){
    if(rows && rows.length){ mostrarMascota(rows[0]); return; }
    // No encontrado por slug — probar como uid (links viejos ya enviados)
    return fetch(SUPA_URL+'/rest/v1/mascotas?uid=eq.'+encodeURIComponent(uid.toUpperCase())+'&select='+campos,{headers:H})
    .then(function(r2){return r2.json();})
    .then(function(rows2){ mostrarMascota(rows2 && rows2[0]); });
  }).catch(function(){
    document.getElementById('root').innerHTML='<div class="no-premium"><div class="no-premium-ico">😕</div><div class="no-premium-titulo">Error al cargar</div><a href="/galeria.html" style="color:#00B4B4;font-weight:700">Volver →</a></div>';
  });
}

function mostrarMascota(m){
  if(!m){
    document.getElementById('root').innerHTML='<div class="no-premium"><div class="no-premium-ico">🐾</div><div class="no-premium-titulo">Mascota no encontrada</div><div class="no-premium-sub">Este perfil no existe o fue eliminado.</div><a href="/galeria.html" style="color:#00B4B4;font-weight:700">Ver galería →</a></div>';
    return;
  }
  var esAngelito=m.angelito===true||m.angelito==='true'||m.angelito==='Si'||m.angelito==='si';
  if(!m.premium && !esAngelito){ renderNoPremium(m); } else { renderPerfil(m); }

  // Registrar la visita (no bloqueante, no afecta al usuario si falla)
  fetch('/api/galeria?action=registrarVisitaPerfil',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({uid_mascota:m.uid})
  }).catch(function(){});
}

function calcEdad(fecha, esAngelito){
  if(!fecha) return null;
  var d=new Date(fecha);
  if(isNaN(d.getTime())) return null;
  var hoy=new Date();
  var anos=hoy.getFullYear()-d.getFullYear();
  var meses=hoy.getMonth()-d.getMonth();
  if(meses<0||(meses===0&&hoy.getDate()<d.getDate())){anos--;}
  if(anos===0){
    var m=((hoy.getFullYear()-d.getFullYear())*12)+(hoy.getMonth()-d.getMonth());
    return m+' mes'+(m!==1?'es':'');
  }
  return anos+' año'+(anos!==1?'s':'');
}

function renderNoPremium(m){
  var emoji=m.especie&&m.especie.toLowerCase().indexOf('gato')>=0?'🐱':'🐶';
  var esAngelito=m.angelito===true||m.angelito==='true'||m.angelito==='Si'||m.angelito==='si';
  var html='<div class="foto-wrap'+(esAngelito?' es-angelito':'')+'">';
  if(m.foto&&m.foto.indexOf('http')>=0){
    html+='<img src="'+m.foto+'" alt="'+m.nombre+'">';
  } else {
    html+='<div class="foto-ph">'+emoji+'</div>';
  }
  html+='<div class="foto-overlay"><div class="foto-nombre">'+m.nombre+'</div>';
  if(m.apodo) html+='<div class="foto-apodo">"'+m.apodo+'"</div>';
  html+='</div></div>';
  html+='<div class="info-card" style="padding:24px 16px">';
  html+='<div style="text-align:center;padding:20px 0">';
  if(esAngelito){
    html+='<div style="font-size:15px;font-weight:700;color:#222;margin-bottom:8px">'+m.nombre+' siempre será parte de la familia PetMi</div>';
    html+='<div style="font-size:13px;color:#888;line-height:1.6">Las huellas que dejan quienes amamos no desaparecen. 🕊️</div>';
  } else {
    html+='<div style="font-size:15px;font-weight:700;color:#222;margin-bottom:8px">'+m.nombre+' no tiene perfil público activado</div>';
    html+='<div style="font-size:13px;color:#888;line-height:1.6;margin-bottom:20px">El perfil público es un beneficio Premium.<br>Si eres el dueño, activa Premium para compartir este perfil.</div>';
    html+='<a href="/premium.html" style="display:inline-block;padding:12px 28px;background:#00B4B4;color:#fff;border-radius:24px;font-size:14px;font-weight:700;text-decoration:none">Ver plan Premium</a>';
  }
  html+='</div></div>';
  html+=renderBrand();
  document.getElementById('root').innerHTML=html;
}

function renderPerfil(m){
  var emoji=m.especie&&m.especie.toLowerCase().indexOf('gato')>=0?'🐱':'🐶';
  var edad=calcEdad(m.fecha);
  var esAngelito=m.angelito===true||m.angelito==='true'||m.angelito==='Si'||m.angelito==='si';

  var html='<div class="foto-wrap'+(esAngelito?' es-angelito':'')+'">';
  if(m.foto&&m.foto.indexOf('http')>=0){
    html+='<img src="'+m.foto+'" alt="'+m.nombre+'">';
  } else {
    html+='<div class="foto-ph">'+emoji+'</div>';
  }
  if(esAngelito){
    html+='<div class="badge-angelito">🕊️ En memoria</div>';
  } else if(m.premium){
    html+='<div class="badge-premium">⭐ PetMi Premium</div>';
  }
  html+='<div class="foto-overlay"><div class="foto-nombre">'+m.nombre+'</div>';
  if(m.apodo) html+='<div class="foto-apodo">"'+m.apodo+'"</div>';
  if(m.raza) html+='<div class="foto-raza">'+m.raza+(m.sexo?' · '+m.sexo:'')+'</div>';
  html+='</div></div>';

  html+='<div class="info-card">';

  if(esAngelito){
    html+='<div class="memorial-card">';
    html+='<div class="memorial-titulo">'+m.nombre+' siempre será parte de la familia PetMi</div>';
    html+='<div class="memorial-texto">Las huellas que dejan quienes amamos no desaparecen. Este espacio queda como un recuerdo especial de su vida.</div>';
    html+='</div>';
  }

  // Grid de datos
  html+='<div class="info-grid">';
  html+='<div class="info-item"><div class="info-label">Especie</div><div class="info-valor">'+(m.especie||'—')+'</div></div>';
  html+='<div class="info-item"><div class="info-label">Raza</div><div class="info-valor">'+(m.raza||'—')+'</div></div>';
  if(edad) html+='<div class="info-item"><div class="info-label">'+(esAngelito?'Vivió':'Edad')+'</div><div class="info-valor">'+edad+'</div></div>';
  if(m.zona) html+='<div class="info-item"><div class="info-label">Zona</div><div class="info-valor">'+m.zona+', GT</div></div>';
  html+='</div>';

  // Responsable
  if(m.dueno){
    html+='<div class="resp-card">';
    html+='<div class="resp-ico">🐾</div>';
    html+='<div><div class="resp-label">Responsable</div><div class="resp-nombre">'+m.dueno+'</div></div>';
    html+='</div>';
  }

  // Botones
  html+='<div class="btns">';
  if(!esAngelito && !esVisitanteDueno){
    if(sessionEmailVisitante){
      html+='<div class="condolencia-form">';
      html+='<textarea id="mDuenoMsj" placeholder="Escribe un mensaje para el responsable de '+m.nombre+'..."></textarea>';
      html+='<button class="btn-enviar-msj" onclick="enviarMensajeAlDueno(\''+m.uid+'\')">💬 Enviar mensaje</button>';
      html+='</div>';
    } else {
      html+='<a href="/index.html" class="btn-contactar" style="display:block;text-align:center;text-decoration:none">🔒 Inicia sesión en PetMi para contactar</a>';
    }
  }
  html+='</div>';

  // Muro de mensajes (solo para angelito) — usa el sistema real /api/galeria,
  // la misma tabla "mensajes" que usa perfil.html (antes usaba una tabla
  // "condolencias" aparte, por eso lo que se mandaba desde otras pantallas
  // no aparecía aquí)
  if(esAngelito){
    html+='<div class="condolencias-titulo">Mensajes para '+m.nombre+'</div>';
    html+='<div id="listaCondolencias"><div class="condolencias-vacio">Cargando mensajes...</div></div>';
    if(!esVisitanteDueno){
      html+='<div class="condolencia-form">';
      html+='<input type="text" id="cNombre" placeholder="Tu nombre">';
      html+='<textarea id="cMensaje" placeholder="Deja un recuerdo o mensaje de cariño..."></textarea>';
      html+='<button class="btn-enviar-msj" onclick="enviarCondolencia(\''+m.uid+'\',\''+m.nombre.replace(/'/g,"\\'")+'\')">Enviar mensaje</button>';
      html+='</div>';
    }
  }

  html+='</div>';
  html+=renderBrand();

  document.getElementById('root').innerHTML=html;

  if(esAngelito) cargarCondolencias(m.uid);
}

// ── Muro de mensajes — usa /api/galeria (misma tabla "mensajes" que perfil.html) ──
function cargarCondolencias(uidMascota){
  fetch('/api/galeria?action=getMensajes&uid='+encodeURIComponent(uidMascota.toUpperCase()))
  .then(function(r){return r.json();})
  .then(function(data){
    var rows = (data && data.mensajes) || [];
    var el=document.getElementById('listaCondolencias');
    if(!el) return;
    if(!rows.length){
      el.innerHTML='<div class="condolencias-vacio">Sé el primero en dejar un mensaje. 🕊️</div>';
      return;
    }
    var html='';
    rows.forEach(function(c){
      var fecha=new Date(c.fecha);
      var fechaStr=isNaN(fecha.getTime())?'':fecha.toLocaleDateString('es-GT',{day:'numeric',month:'short'});
      html+='<div class="condolencia-item">';
      html+='<span class="condolencia-nombre">'+(c.autor||'Alguien')+'</span><span class="condolencia-fecha">'+fechaStr+'</span>';
      html+='<div class="condolencia-msj">'+(c.mensaje||'')+'</div>';
      html+='</div>';
    });
    el.innerHTML=html;
  }).catch(function(){
    var el=document.getElementById('listaCondolencias');
    if(el) el.innerHTML='<div class="condolencias-vacio">No se pudieron cargar los mensajes.</div>';
  });
}

function enviarMensajeAlDueno(uidReceptor){
  if(!miUidVisitante){
    alert('Un momento — todavía estamos cargando tu sesión. Intenta de nuevo en unos segundos.');
    return;
  }
  var textarea=document.getElementById('mDuenoMsj');
  var mensaje=textarea.value.trim();
  if(!mensaje){ alert('Escribe un mensaje primero.'); return; }
  fetch('/api/galeria?action=enviarMensajePrivado',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({uid_emisor:miUidVisitante, uid_receptor:uidReceptor, mensaje:mensaje})
  }).then(function(r){return r.json();})
  .then(function(d){
    if(d && d.ok){
      textarea.value='';
      alert('¡Mensaje enviado! Le llegará una notificación al responsable. 🐾');
    } else {
      alert('No se pudo enviar el mensaje. Intenta de nuevo.');
    }
  }).catch(function(){
    alert('No se pudo enviar el mensaje. Intenta de nuevo.');
  });
}

function enviarCondolencia(uidMascota, nombreMascota){
  var nombre=document.getElementById('cNombre').value.trim();
  var mensaje=document.getElementById('cMensaje').value.trim();
  if(!nombre||!mensaje){
    alert('Por favor escribe tu nombre y un mensaje.');
    return;
  }
  fetch('/api/galeria?action=addMensajePublico',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({uid:uidMascota.toUpperCase(), autor:nombre, mensaje:mensaje, nombreMascota:nombreMascota})
  }).then(function(r){return r.json();})
  .then(function(d){
    if(d && d.ok){
      document.getElementById('cNombre').value='';
      document.getElementById('cMensaje').value='';
      cargarCondolencias(uidMascota);
      // Notificar al dueño por correo (no bloqueante)
      fetch('/api/submit',{
        method:'POST', headers:{'Content-Type':'application/json'},
        body:JSON.stringify({action:'addMensaje', uid:uidMascota.toUpperCase(), autor:nombre, mensaje:mensaje, nombreMascota:nombreMascota})
      }).catch(function(){});
    } else {
      alert('No se pudo enviar el mensaje. Intenta de nuevo.');
    }
  }).catch(function(){
    alert('No se pudo enviar el mensaje. Intenta de nuevo.');
  });
}

function renderBrand(){
  return '<div class="footer"><div class="footer-brand">petz<span>ID</span></div><div class="footer-sub">PetMi Guatemala — Comunidad de mascotas</div></div>';
}
</script>
<script src="/header.js"></script>
</body>
</html>
