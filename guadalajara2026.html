function Tag({ type }) {
  const s = TAG_STYLES[type]; if (!s) return null;
  return e('span', { style:{ background:s.bg, color:s.color, fontSize:9, fontWeight:700, borderRadius:4, padding:"1px 6px", whiteSpace:"nowrap", letterSpacing:".04em" } }, s.label);
}

function DayCard({ day, isOpen, onToggle }) {
  return e('div', { style:{ borderRadius:14, overflow:"hidden", border:"1px solid rgba(0,0,0,.08)", boxShadow:isOpen?"0 4px 20px rgba(0,0,0,.1)":"0 1px 6px rgba(0,0,0,.05)", marginBottom:10 } },
    e('div', { onClick:onToggle, style:{ display:"flex", alignItems:"center", gap:12, padding:"13px 16px", background:day.color, cursor:"pointer", userSelect:"none" } },
      e('div', { style:{ fontFamily:"'Playfair Display',Georgia,serif", fontSize:28, fontWeight:900, color:GOLD, lineHeight:1, minWidth:38 } }, day.num),
      e('div', { style:{ flex:1 } },
        e('div', { style:{ fontSize:10, letterSpacing:".1em", textTransform:"uppercase", color:"rgba(255,255,255,.5)", marginBottom:1 } }, day.label),
        e('div', { style:{ fontSize:14, fontWeight:600, color:"#fff" } }, day.title)
      ),
      e('div', { style:{ background:"rgba(201,151,43,.25)", color:GOLD, borderRadius:99, padding:"2px 10px", fontSize:11, fontWeight:600, whiteSpace:"nowrap" } }, day.badge),

              e('span', { style:{ fontSize:14, fontWeight:600, color:"#1A1209" } }, a.icon + " " + a.name),
              ...a.tags.map(t => e(Tag, { key:t, type:t }))
            ),

function MapView() {
  const [active, setActive] = useState(null);
  const [dayFilter, setDayFilter] = useState("all");
  const filtered = PLACES.filter(p => dayFilter === "all" || p.day === dayFilter);

  const toXY = (lat, lng) => ({
    x: ((lng - (-103.46)) / ((-103.28) - (-103.46))) * 100,
    y: ((20.775 - lat) / (20.775 - 20.62)) * 100,
  });

  return e('div', null,
    // Filter chips
    e('div', { style:{ display:"flex", flexWrap:"wrap", gap:6, marginBottom:12 } },
      DAY_FILTERS.map(f =>
        e('button', { key:f.id, onClick:() => { setDayFilter(f.id); setActive(null); },
          style:{ padding:"5px 13px", borderRadius:99, fontSize:12, fontWeight:600, border:`1.5px solid ${dayFilter===f.id?"transparent":"rgba(0,0,0,.1)"}`,
            background:dayFilter===f.id?(DAY_COLORS[f.id]||AGAVE):"#fff",
            color:dayFilter===f.id?"#fff":"#5A4A30" }
        }, f.label)
      )
    ),
    // SVG Map
    e('div', { style:{ position:"relative", background:"#E8F0DC", borderRadius:14, overflow:"hidden", border:"2px solid rgba(0,0,0,.1)" } },
      e('svg', { viewBox:"0 0 100 100", style:{ width:"100%", display:"block" } },
        e('rect', { width:100, height:100, fill:"#EEF3E5" }),
        ...[15,25,35,45,55,65,75,85].map(v => e('line', { key:"h"+v, x1:0, y1:v, x2:100, y2:v, stroke:"rgba(255,255,255,.5)", strokeWidth:".25" })),
        ...[15,25,35,45,55,65,75,85].map(v => e('line', { key:"v"+v, x1:v, y1:0, x2:v, y2:100, stroke:"rgba(255,255,255,.5)", strokeWidth:".25" })),
        ...filtered.map((p, i) => {
          const { x, y } = toXY(p.lat, p.lng);
          const isAct = active === i;
          return e('g', { key:i, style:{ cursor:"pointer" }, onClick:() => setActive(active===i?null:i) },
            e('circle', { cx:x, cy:y, r:isAct?4:3, fill:p.color, stroke:"#fff", strokeWidth:isAct?1.5:.8 }),
            e('text', { x, y:y-4.5, textAnchor:"middle", fontSize:"3.2", style:{ pointerEvents:"none", userSelect:"none" } }, p.emoji)
          );
        })
      ),
      active !== null && filtered[active] && e('div', {
        style:{ position:"absolute", bottom:12, left:12, right:12, background:"#fff", borderRadius:10,
          padding:"10px 14px", boxShadow:"0 4px 16px rgba(0,0,0,.2)", borderLeft:`4px solid ${filtered[active].color}` }
      },
        e('div', { style:{ fontSize:14, fontWeight:700 } }, filtered[active].emoji + " " + filtered[active].title),
        e('div', { style:{ fontSize:12, color:"#7A6A50", marginTop:2, marginBottom:6 } }, filtered[active].sub),
        filtered[active].mapsUrl && e('a', { href:filtered[active].mapsUrl, target:"_blank", rel:"noopener noreferrer",
          style:{ fontSize:11.5, color:"#1A73E8", fontWeight:600, textDecoration:"none" } }, "📍 Abrir en Google Maps →")
      )
    ),
    // Legend
    e('div', { style:{ display:"flex", flexWrap:"wrap", gap:6, marginTop:10 } },
      [["#2D5016","Hotel"],["#4A7C59","Jue 25"],["#1565C0","Vie 26"],["#795548","Sáb 27"],["#E65100","Lun 29"],["#6A1B9A","Mar 30"]].map(([color,label]) =>
        e('div', { key:label, style:{ display:"flex", alignItems:"center", gap:5, background:"#fff", borderRadius:8, padding:"4px 10px", border:"1px solid rgba(0,0,0,.08)", fontSize:11, color:"#5A4A30" } },
          e('div', { style:{ width:9, height:9, borderRadius:"50%", background:color, flexShrink:0 } }),
          label
        )
      )
    ),
    e('p', { style:{ fontSize:11, color:"#9A8A70", marginTop:8, textAlign:"center" } }, "Toca cada punto · filtra por día arriba")
  );
}
