function Tag({ type }) {
  const s=TAG_STYLES[type]; if(!s)return null;
  return e('span',{style:{background:s.bg,color:s.color,fontSize:9,fontWeight:700,borderRadius:4,padding:"1px 6px",whiteSpace:"nowrap",letterSpacing:".04em"}},s.label);
}

function MatchBlock({ dayKey }) {
  const matches = MATCHES[dayKey];
  if(!matches||!matches.length) return null;
  return e('div',{style:{background:"#1A1A2E",borderRadius:10,padding:"10px 14px",marginTop:10}},
    e('div',{style:{fontSize:10,letterSpacing:".12em",textTransform:"uppercase",color:GOLD,fontWeight:700,marginBottom:8}},"⚽ Partidos del día (hora GDL)"),
    matches.map((m,i)=>
      e('div',{key:i,style:{display:"flex",gap:8,alignItems:"center",padding:"5px 0",borderBottom:i<matches.length-1?"1px solid rgba(255,255,255,.07)":"none"}},
        e('span',{style:{fontSize:11,fontWeight:700,color:GOLD,minWidth:44,flexShrink:0}},m.time),
        e('span',{style:{fontSize:12,color:m.highlight?"#FFF176":"rgba(255,255,255,.8)",fontWeight:m.highlight?700:400,flex:1}}),
        e('div',{style:{flex:1}},
          e('div',{style:{fontSize:12,color:m.highlight?"#FFF176":"rgba(255,255,255,.8)",fontWeight:m.highlight?700:400}},m.teams),
          m.note&&e('div',{style:{fontSize:10,color:GOLD,marginTop:1}},m.note)
        )
      )
    )
  );
}

function MapView() {
  const [dayFilter,setDayFilter]=useState("all");
  const mapRef = React.useRef(null);
  const leafletMap = React.useRef(null);
  const markersLayer = React.useRef(null);

  const allPlaces = [...PLACES,
    { lat:20.6731, lng:-103.4671, emoji:"🏟️", title:"Estadio Akron", sub:"Casa de las Chivas · sede Mundial", color:"#B71C1C", day:"extra", mapsUrl:"https://maps.google.com/?cid=3456789012345678" }
  ];

  React.useEffect(()=>{
    if(!window.L||leafletMap.current) return;
    const map = window.L.map(mapRef.current,{center:[20.690,-103.370],zoom:12});
    window.L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
      attribution:'© <a href="https://openstreetmap.org">OpenStreetMap</a>',maxZoom:19
    }).addTo(map);
    leafletMap.current = map;
    markersLayer.current = window.L.layerGroup().addTo(map);
  },[]);

  React.useEffect(()=>{
    if(!leafletMap.current||!window.L) return;
    markersLayer.current.clearLayers();
    const filtered = allPlaces.filter(p=>dayFilter==="all"||p.day===dayFilter||p.day==="extra");
    filtered.forEach(p=>{
      const icon = window.L.divIcon({
        className:"",
        html:`<div style="width:34px;height:34px;display:flex;align-items:center;justify-content:center;background:${p.color};border-radius:50%;border:2.5px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.35);font-size:16px">${p.emoji}</div>`,
        iconSize:[34,34],iconAnchor:[17,17],popupAnchor:[0,-18]
      });
      const popup = `<div style="font-family:Inter,sans-serif;min-width:180px">
        <strong style="font-size:13px;color:#1A1209">${p.emoji} ${p.title}</strong>
        <div style="font-size:11px;color:#7A6A50;margin:4px 0">${p.sub}</div>
        ${p.mapsUrl?`<a href="${p.mapsUrl}" target="_blank" style="font-size:11px;color:#1A73E8;font-weight:600;text-decoration:none">📍 Abrir en Google Maps →</a>`:""}
      </div>`;
      window.L.marker([p.lat,p.lng],{icon}).addTo(markersLayer.current).bindPopup(popup);
    });
    if(dayFilter!=="all"&&filtered.length>0){
      const group=window.L.featureGroup(markersLayer.current.getLayers());
      if(group.getLayers().length>0) leafletMap.current.fitBounds(group.getBounds().pad(0.3));
    } else {
      leafletMap.current.setView([20.700,-103.390],11);
    }
  },[dayFilter]);

  return e('div',null,
    e('div',{style:{display:"flex",flexWrap:"wrap",gap:6,marginBottom:12}},
      [...DAY_FILTERS,{id:"extra",label:"🏟️ Akron"}].map(f=>e('button',{key:f.id,onClick:()=>setDayFilter(f.id),
        style:{padding:"5px 13px",borderRadius:99,fontSize:12,fontWeight:600,border:`1.5px solid ${dayFilter===f.id?"transparent":"rgba(0,0,0,.1)"}`,
          background:dayFilter===f.id?(DAY_COLORS[f.id]||AGAVE):"#fff",color:dayFilter===f.id?"#fff":"#5A4A30"}},f.label))
    ),
    e('div',{ref:mapRef,style:{width:"100%",height:480,borderRadius:14,overflow:"hidden",border:"2px solid rgba(0,0,0,.1)",zIndex:1}}),
    e('div',{style:{display:"flex",flexWrap:"wrap",gap:6,marginTop:10}},
      [["#2D5016","Hotel"],["#4A7C59","Jue 25"],["#1565C0","Vie 26"],["#795548","Sáb 27"],["#E65100","Lun 29"],["#6A1B9A","Mar 30"],["#C9972B","Restaurantes"],["#B71C1C","Estadio Akron"]].map(([color,label])=>
        e('div',{key:label,style:{display:"flex",alignItems:"center",gap:5,background:"#fff",borderRadius:8,padding:"4px 10px",border:"1px solid rgba(0,0,0,.08)",fontSize:11,color:"#5A4A30"}},
          e('div',{style:{width:9,height:9,borderRadius:"50%",background:color,flexShrink:0}}),label
        )
      )
    ),
    e('p',{style:{fontSize:11,color:"#9A8A70",marginTop:8,textAlign:"center"}},"Toca cada marcador · filtra por día arriba · mapa real OpenStreetMap")
  );
}
