<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link rel="icon" href="/favico.jpg" type="image/jpeg">
<title>Agenda — PetMi</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Arial,sans-serif;background:#f0f0ee;min-height:100vh}
/* GA */
  <!-- Google Analytics GA4 - PetMi -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-22PYV5237N"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-22PYV5237N');
</script>
  
/* HERO */
.hero{background:linear-gradient(135deg,#00B4B4,#764ba2);padding:24px 20px 20px;text-align:center}
.hero h1{font-size:22px;font-weight:900;color:#fff;font-family:'Arial Black',Arial,sans-serif;margin-bottom:4px}
.hero p{font-size:13px;color:rgba(255,255,255,.75)}

/* FILTROS TIPO */
.filtros-wrap{background:#fff;padding:12px 16px;border-bottom:1px solid #eee;position:sticky;top:0;z-index:80}
.filtros-scroll{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.filtros-scroll::-webkit-scrollbar{display:none}
.filtro-btn{padding:7px 14px;border:1.5px solid #ddd;border-radius:20px;font-size:12px;font-weight:600;color:#888;background:#fff;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:all .2s}
.filtro-btn.active{border-color:#764ba2;background:#f3e8ff;color:#5a3d8a}

/* MES PICKER */
.mes-bar{background:#fff;border-bottom:1px solid #eee;padding:10px 16px;display:flex;align-items:center;gap:8px;overflow-x:auto;scrollbar-width:none}
.mes-bar::-webkit-scrollbar{display:none}
.mes-chip{padding:5px 14px;border-radius:99px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0;border:1.5px solid #eee;background:#fff;color:#888;transition:all .2s}
.mes-chip.active{background:#00B4B4;color:#fff;border-color:#00B4B4}
.mes-chip.today{border-color:#00B4B4;color:#00B4B4}

/* TABS */
.tabs{display:flex;background:#fff;border-bottom:1px solid #eee}
.tab{flex:1;padding:12px;text-align:center;font-size:13px;font-weight:700;color:#888;cursor:pointer;border-bottom:3px solid transparent;transition:all .2s}
.tab.active{color:#764ba2;border-bottom-color:#764ba2}

/* CARDS ACTIVIDADES */
.wrap{max-width:600px;margin:0 auto;padding:16px}
.act-card{background:#fff;border-radius:16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.07);overflow:hidden}
.act-card-header{height:4px}
.act-card-body{padding:14px}
.act-badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;padding:3px 9px;border-radius:99px;margin-bottom:8px}
.act-badge.oficial{background:#F5C842;color:#1a1a1a}
.act-nombre{font-size:13px;font-weight:700;color:#555;margin-bottom:2px}
.act-titulo{font-size:15px;font-weight:900;color:#222;margin-bottom:6px;line-height:1.3}
.act-meta{font-size:12px;color:#aaa;line-height:1.6;margin-bottom:10px}
.act-img{width:100%;height:160px;object-fit:cover}
.act-footer{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn-asistir{padding:8px 18px;background:#00B4B4;color:#fff;border:none;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer}
.btn-asistir.asistiendo{background:#e0f7f7;color:#007a7a}
.btn-wa{padding:8px 16px;background:#f0f0ee;color:#555;border:none;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer}
.btn-apuntar{padding:8px 18px;background:#764ba2;color:#fff;border:none;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer}
.btn-apuntar.apuntado{background:#f3e8ff;color:#764ba2}
.apuntes-wrap{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.apunte-avatar{width:24px;height:24px;border-radius:6px;object-fit:cover;border:1.5px solid #fff}

/* CARD PERDIDO */
.act-card.perdido-card{border:2px solid #c0392b}
.act-card.perdido-card .act-card-header{background:#c0392b;height:6px}

/* CARD ADOPCION */
.act-card.adopcion-card{border:2px solid #2e7d32}
.act-card.adopcion-card .act-card-header{background:#2e7d32;height:6px}

/* CARD EVENTO OFICIAL */
.act-card.evento-oficial{border:2px solid #F5C842}
.act-card.evento-oficial .act-card-header{background:linear-gradient(90deg,#F5C842,#f0a500);height:6px}

/* EMPTY */
.empty{text-align:center;padding:48px 20px}
.empty-icon{font-size:48px;margin-bottom:12px}
.empty-txt{font-size:14px;color:#888}

/* SPINNER */
.spinner{width:36px;height:36px;border:3px solid #f0f0f0;border-top-color:#764ba2;border-radius:50%;animation:spin .8s linear infinite;margin:40px auto}
@keyframes spin{to{transform:rotate(360deg)}}

/* PUBLICAR BTN */
.btn-publicar-fab{position:fixed;bottom:24px;right:20px;width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#764ba2,#E05090);color:#fff;border:none;font-size:24px;cursor:pointer;box-shadow:0 4px 16px rgba(118,75,162,.4);z-index:70;display:flex;align-items:center;justify-content:center}

/* MODAL PUBLICAR */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);z-index:200;display:none;align-items:flex-end;justify-content:center}
.modal-overlay.open{display:flex}
.modal-sheet{background:#fff;border-radius:20px 20px 0 0;padding:24px 20px;width:100%;max-width:600px;max-height:85vh;overflow-y:auto}
.modal-handle{width:40px;height:4px;background:#e0e0e0;border-radius:2px;margin:0 auto 20px}
.modal-titulo{font-size:18px;font-weight:900;color:#222;margin-bottom:16px}
.form-label{font-size:12px;font-weight:700;color:#555;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;display:block}
.form-input{width:100%;padding:12px 14px;border:1.5px solid #e0e0e0;border-radius:12px;font-size:14px;outline:none;margin-bottom:12px}
.form-input:focus{border-color:#764ba2}
.form-select{width:100%;padding:12px 14px;border:1.5px solid #e0e0e0;border-radius:12px;font-size:14px;outline:none;margin-bottom:12px;background:#fff;cursor:pointer}
.tipo-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.tipo-option{padding:12px;border:1.5px solid #e0e0e0;border-radius:12px;text-align:center;cursor:pointer;transition:all .2s;font-size:13px;font-weight:600;color:#555}
.tipo-option.selected{border-color:#764ba2;background:#f3e8ff;color:#764ba2}
.btn-publicar{width:100%;padding:14px;background:linear-gradient(135deg,#764ba2,#E05090);color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;margin-top:8px}

/* TOAST */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 20px;border-radius:24px;font-size:13px;font-weight:600;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}

/* CONTADOR APUNTADOS */
.apuntados-count{font-size:11px;color:#aaa;margin-left:auto}

/* APARECIÓ btn */
.btn-aparecio{padding:8px 16px;background:#1a7a1a;color:#fff;border:none;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer}

/* ME INTERESA btn */
.btn-interesa{padding:8px 16px;background:#2e7d32;color:#fff;border:none;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer}
</style>
</head>
<body>

<div class="hero">
  <h1>🗓️ Agenda PetMi</h1>
  <p>Planes, eventos y actividades de la comunidad</p>
</div>

<!-- TABS Actividades / Eventos -->
<div class="tabs">
  <div class="tab active" id="tabActividades" onclick="setTab('actividades')">🐾 ¿Quién se apunta?</div>
  <div class="tab" id="tabEventos" onclick="setTab('eventos')">🎪 Eventos oficiales</div>
</div>

<!-- FILTROS TIPO -->
<div class="filtros-wrap">
  <div class="filtros-scroll" id="filtrosContenedor">
    <button class="filtro-btn active" onclick="setFiltro('',this)">Todos</button>
    <button class="filtro-btn" onclick="setFiltro('plan',this)">🐾 Planes</button>
    <button class="filtro-btn" onclick="setFiltro('busco',this)">🔍 Busco</button>
    <button class="filtro-btn" onclick="setFiltro('adopcion',this)">🏠 Adopción</button>
    <button class="filtro-btn" onclick="setFiltro('perdido',this)">🚨 Perdidos</button>
  </div>
</div>

<!-- MES PICKER -->
<div class="mes-bar" id="mesBar"></div>

<div class="wrap" id="contenido">
  <div class="spinner"></div>
</div>

<!-- FAB publicar -->
<button class="btn-publicar-fab" onclick="abrirPublicar()" title="Publicar">+</button>

<!-- Modal publicar -->
<div class="modal-overlay" id="modalPublicar">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-titulo">¿Qué quieres publicar?</div>
    <div class="tipo-grid" id="tipoGrid">
      <div class="tipo-option selected" onclick="selTipo('plan',this)">🐾<br>Plan</div>
      <div class="tipo-option" onclick="selTipo('busco',this)">🔍<br>Busco</div>
      <div class="tipo-option" onclick="selTipo('adopcion',this)">🏠<br>Adopción</div>
      <div class="tipo-option" onclick="selTipo('perdido',this)">🚨<br>Me perdí</div>
    </div>
    <label class="form-label">Título *</label>
    <input type="text" class="form-input" id="pubTitulo" placeholder="Ej: Paseo por el parque las minervas">
    <label class="form-label">Descripción</label>
    <textarea class="form-input" id="pubDesc" rows="3" placeholder="Cuéntanos más..." style="resize:none"></textarea>
    <label class="form-label">Fecha (opcional)</label>
    <input type="date" class="form-input" id="pubFecha">
    <label class="form-label">Hora (opcional)</label>
    <input type="time" class="form-input" id="pubHora">
    <label class="form-label">Ubicación</label>
    <input type="text" class="form-input" id="pubUbicacion" placeholder="Zona 10, Guatemala">
    <button class="btn-publicar" onclick="publicar()">Publicar</button>
    <button onclick="cerrarPublicar()" style="width:100%;padding:12px;background:#f0f0ee;color:#666;border:none;border-radius:12px;font-size:14px;cursor:pointer;margin-top:8px">Cancelar</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var sessionEmail = localStorage.getItem('petzid_email')||'';
var miMascota    = null;
var tabActual    = 'actividades';
var filtroActual = '';
var mesActual    = '';  // '' = todos
var actividadesData = [];
var eventosData     = [];
var tipoSeleccionado = 'plan';
var apuntesCache = {};

var TIPO_COLORS = {
  plan:     {bg:'#f3e8ff', color:'#764ba2', header:'#764ba2'},
  busco:    {bg:'#e8f5e9', color:'#2e7d32', header:'#2e7d32'},
  adopcion: {bg:'#e8f5e9', color:'#2e7d32', header:'#2e7d32'},
  perdido:  {bg:'#ffebee', color:'#c0392b', header:'#c0392b'}
};
var TIPO_LABELS = {plan:'🐾 Plan', busco:'🔍 Busco', adopcion:'🏠 Adopción', perdido:'🚨 Perdido'};
var MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

// ── Cargar usuario ────────────────────────────────────────────
if(sessionEmail){
  fetch('/api/galeria?action=checkEmail',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'checkEmail',email:sessionEmail})})
    .then(function(r){return r.json();})
    .then(function(d){
      if(d.found&&d.mascotas.length){ miMascota=d.mascotas[0]; }
    });
}

// ── Mes picker ────────────────────────────────────────────────
function renderMesPicker(){
  var hoy = new Date();
  var html = '<div class="mes-chip '+(mesActual===''?'active':'')+'" onclick="setMes(\'\',this)">Todos</div>';
  for(var i=0;i<6;i++){
    var d = new Date(hoy.getFullYear(), hoy.getMonth()+i, 1);
    var key = d.getFullYear()+'-'+(d.getMonth()+1);
    var isHoy = i===0;
    html += '<div class="mes-chip '+(mesActual===key?'active':isHoy?'today':'')+'" data-mes="'+key+'" onclick="setMes(\''+key+'\',this)">'+MESES[d.getMonth()].substring(0,3)+'</div>';
  }
  document.getElementById('mesBar').innerHTML = html;
}

function setMes(mes, el){
  mesActual = mes;
  document.querySelectorAll('.mes-chip').forEach(function(c){c.classList.remove('active');});
  if(el) el.classList.add('active');
  cargar();
}

// ── Tabs ──────────────────────────────────────────────────────
function setTab(tab){
  tabActual = tab;
  document.getElementById('tabActividades').className='tab'+(tab==='actividades'?' active':'');
  document.getElementById('tabEventos').className='tab'+(tab==='eventos'?' active':'');
  // Filtros distintos por tab
  var fc = document.getElementById('filtrosContenedor');
  if(tab==='eventos'){
    fc.innerHTML = '<button class="filtro-btn active" onclick="setFiltro(\'\',this)">Todos</button>'
      +'<button class="filtro-btn" onclick="setFiltro(\'evento\',this)">🎪 Eventos</button>'
      +'<button class="filtro-btn" onclick="setFiltro(\'paseo\',this)">🚶 Paseos</button>'
      +'<button class="filtro-btn" onclick="setFiltro(\'exposicion\',this)">🏆 Exposiciones</button>';
    document.querySelector('.btn-publicar-fab').style.display='none';
  } else {
    fc.innerHTML = '<button class="filtro-btn active" onclick="setFiltro(\'\',this)">Todos</button>'
      +'<button class="filtro-btn" onclick="setFiltro(\'plan\',this)">🐾 Planes</button>'
      +'<button class="filtro-btn" onclick="setFiltro(\'busco\',this)">🔍 Busco</button>'
      +'<button class="filtro-btn" onclick="setFiltro(\'adopcion\',this)">🏠 Adopción</button>'
      +'<button class="filtro-btn" onclick="setFiltro(\'perdido\',this)">🚨 Perdidos</button>';
    document.querySelector('.btn-publicar-fab').style.display='flex';
  }
  filtroActual = '';
  cargar();
}

function setFiltro(tipo, el){
  filtroActual = tipo;
  document.querySelectorAll('.filtro-btn').forEach(function(b){b.classList.remove('active');});
  if(el) el.classList.add('active');
  renderLista();
}

// ── Cargar datos ──────────────────────────────────────────────
function cargar(){
  document.getElementById('contenido').innerHTML = '<div class="spinner"></div>';
  if(tabActual==='actividades'){
    fetch('/api/galeria?action=getActividades')
      .then(function(r){return r.json();})
      .then(function(d){
        actividadesData = d.actividades||[];
        renderLista();
      }).catch(function(){
        document.getElementById('contenido').innerHTML='<div class="empty"><div class="empty-icon">😕</div><div class="empty-txt">Error al cargar</div></div>';
      });
  } else {
    var hoy = new Date().toISOString().split('T')[0];
    fetch('/api/galeria?action=getEventos')
      .then(function(r){return r.json();})
      .then(function(d){
        eventosData = (d.eventos||[]).filter(function(e){ return !e.fecha || e.fecha >= hoy; });
        renderLista();
      }).catch(function(){
        document.getElementById('contenido').innerHTML='<div class="empty"><div class="empty-icon">😕</div><div class="empty-txt">Error al cargar</div></div>';
      });
  }
}

// ── Render lista ──────────────────────────────────────────────
function renderLista(){
  var lista = tabActual==='actividades' ? actividadesData : eventosData;

  // Filtro por tipo
  if(filtroActual){
    lista = lista.filter(function(x){ return x.tipo===filtroActual; });
  }

  // Filtro por mes
  if(mesActual){
    var parts = mesActual.split('-');
    var y = parseInt(parts[0]), m = parseInt(parts[1])-1;
    lista = lista.filter(function(x){
      if(!x.fecha) return false;
      var d = new Date(x.fecha+'T12:00:00');
      return d.getFullYear()===y && d.getMonth()===m;
    });
  }

  if(!lista.length){
    document.getElementById('contenido').innerHTML='<div class="empty"><div class="empty-icon">'+(tabActual==='actividades'?'🐾':'🎪')+'</div><div class="empty-txt">'+(mesActual?'Sin actividades este mes':'No hay publicaciones aún')+'</div></div>';
    return;
  }

  var html = '';
  lista.forEach(function(item, i){
    if(tabActual==='actividades'){
      html += renderActividad(item, i);
    } else {
      html += renderEvento(item, i);
    }
  });
  document.getElementById('contenido').innerHTML = html;

  // Cargar apuntes en background
  if(tabActual==='actividades') lista.forEach(function(a){ cargarApuntes(a.id); });
}

// ── Render actividad ──────────────────────────────────────────
function renderActividad(a, i){
  var col = TIPO_COLORS[a.tipo] || {bg:'#f0f0ee',color:'#555',header:'#888'};
  var label = TIPO_LABELS[a.tipo] || a.tipo;
  var esCreador = sessionEmail && a.email_creador && a.email_creador.toLowerCase()===sessionEmail.toLowerCase();
  var fotoAvatar = a.foto_creador&&a.foto_creador.indexOf('http')>=0
    ? '<img src="'+a.foto_creador+'" style="width:28px;height:28px;border-radius:8px;object-fit:cover">'
    : '<div style="width:28px;height:28px;border-radius:8px;background:'+col.bg+';display:flex;align-items:center;justify-content:center;font-size:14px">🐾</div>';
  var fechaTxt='', meta='';
  if(a.fecha){ var d=new Date(a.fecha+'T12:00:00'); fechaTxt='📅 '+d.toLocaleDateString('es-GT',{weekday:'short',day:'2-digit',month:'short'}); }
  if(a.hora) fechaTxt+=' '+a.hora;
  if(a.ubicacion) meta+='📍 '+a.ubicacion;
  if(fechaTxt && meta) meta = fechaTxt+' · '+meta;
  else if(fechaTxt) meta = fechaTxt;
  var extraClass = a.tipo==='perdido'?' perdido-card':a.tipo==='adopcion'?' adopcion-card':'';

  var html = '<div class="act-card'+extraClass+'" id="card-'+a.id+'">';
  html += '<div class="act-card-header" style="background:'+col.header+'"></div>';
  if(a.imagen&&a.imagen.indexOf('http')>=0) html += '<img src="'+a.imagen+'" class="act-img">';
  html += '<div class="act-card-body">';
  html += '<span class="act-badge" style="background:'+col.bg+';color:'+col.color+'">'+label+'</span>';
  html += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">'+fotoAvatar+'<div class="act-nombre">'+a.nombre_creador+'</div><span style="font-size:11px;color:#bbb;margin-left:auto">'+tiempoRelativo(a.created_at)+'</span></div>';
  html += '<div class="act-titulo">'+a.titulo+'</div>';
  if(a.descripcion) html += '<div style="font-size:13px;color:#666;margin:4px 0 8px;line-height:1.6">'+a.descripcion+'</div>';
  if(meta) html += '<div class="act-meta">'+meta+'</div>';
  // Apuntes
  html += '<div class="apuntes-wrap" id="apuntes-'+a.id+'"></div>';
  // Footer
  html += '<div class="act-footer">';
  if(a.tipo==='plan'||a.tipo==='busco'){
    html += '<button class="btn-apuntar" id="btn-apuntar-'+a.id+'" onclick="apuntarse(\''+a.id+'\',\''+a.nombre_creador+'\')">🐾 Apuntarse</button>';
  }
  if(a.tipo==='adopcion' && !esCreador && sessionEmail){
    html += '<button class="btn-interesa" onclick="contactarAdopcion(\''+a.email_creador+'\',\''+a.titulo+'\')">🏠 Me interesa</button>';
  }
  if(a.tipo==='perdido' && !esCreador && sessionEmail){
    html += '<button style="padding:8px 16px;background:#c0392b;color:#fff;border:none;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer" onclick="contactarPerdido(\''+a.email_creador+'\',\''+a.nombre_creador+'\')">📞 Tengo info</button>';
  }
  if(a.tipo==='perdido' && esCreador){
    html += '<button class="btn-aparecio" onclick="marcarAparecio(\''+a.id+'\',\''+a.nombre_creador+'\')">🎉 ¡Apareció!</button>';
  }
  if(esCreador && a.tipo!=='perdido'){
    html += '<button style="padding:8px 14px;background:#f0f0ee;color:#888;border:none;border-radius:20px;font-size:11px;cursor:pointer" onclick="eliminarActividad(\''+a.id+'\')">🗑️</button>';
  }
  var shareText = encodeURIComponent('Mira esta publicación en PetMi: '+a.titulo);
  var shareUrl  = encodeURIComponent('https://petmi-petzid.vercel.app/agenda.html');
  html += '<button class="btn-wa" onclick="window.open(\'https://wa.me/?text='+shareText+'%20'+shareUrl+'\',\'_blank\')">📲</button>';
  html += '</div></div></div>';
  return html;
}

// ── Render evento oficial ─────────────────────────────────────
function renderEvento(e, i){
  var fechaTxt = e.fecha ? new Date(e.fecha+'T12:00:00').toLocaleDateString('es-GT',{weekday:'long',day:'2-digit',month:'long',year:'numeric'}) : '';
  var html = '<div class="act-card evento-oficial">';
  html += '<div class="act-card-header"></div>';
  if(e.imagen&&e.imagen.indexOf('http')>=0) html += '<img src="'+e.imagen+'" class="act-img">';
  html += '<div class="act-card-body">';
  html += '<span class="act-badge oficial">🎪 Evento oficial</span>';
  html += '<div class="act-titulo">'+e.titulo+'</div>';
  if(fechaTxt) html += '<div class="act-meta">📅 '+fechaTxt+(e.hora?' · '+e.hora:'')+'</div>';
  if(e.lugar) html += '<div class="act-meta">📍 '+e.lugar+(e.direccion?' — '+e.direccion:'')+'</div>';
  if(e.descripcion) html += '<div style="font-size:13px;color:#666;margin:6px 0 10px;line-height:1.6">'+e.descripcion+'</div>';
  html += '<div class="act-footer">';
  if(sessionEmail){
    html += '<button class="btn-asistir" id="btn-ev-'+e.id+'" onclick="asistirEvento(\''+e.id+'\')">✅ Asistiré</button>';
  }
  if(e.link) html += '<a href="'+e.link+'" target="_blank" style="padding:8px 16px;background:#f0f0ee;color:#555;border-radius:20px;font-size:12px;font-weight:600;text-decoration:none">Más info</a>';
  html += '</div></div></div>';
  return html;
}

// ── Apuntes ───────────────────────────────────────────────────
function cargarApuntes(actId){
  fetch('/api/galeria?action=getApuntes&actividad_id='+encodeURIComponent(actId))
    .then(function(r){return r.json();})
    .then(function(d){
      var el = document.getElementById('apuntes-'+actId);
      if(!el) return;
      var apuntes = d.apuntes||[];
      if(!apuntes.length){ el.innerHTML=''; return; }
      var html = '';
      apuntes.slice(0,8).forEach(function(ap){
        var foto = ap.foto_mascota&&ap.foto_mascota.indexOf('http')>=0
          ? '<img src="'+ap.foto_mascota+'" class="apunte-avatar" title="'+ap.nombre_mascota+'">'
          : '<div class="apunte-avatar" style="background:#f3e8ff;display:flex;align-items:center;justify-content:center;font-size:12px">🐾</div>';
        html += foto;
      });
      if(apuntes.length>8) html += '<span style="font-size:11px;color:#aaa;padding:4px">+'+( apuntes.length-8)+'</span>';
      html += '<span class="apuntados-count">'+apuntes.length+' apuntado'+(apuntes.length!==1?'s':'')+'</span>';
      el.innerHTML = html;
      // Verificar si ya estoy apuntado
      if(miMascota){
        var yaApuntado = apuntes.some(function(ap){ return ap.uid_mascota===miMascota.uid; });
        var btn = document.getElementById('btn-apuntar-'+actId);
        if(btn && yaApuntado){ btn.textContent='✓ Apuntado'; btn.className='btn-apuntar apuntado'; }
      }
    });
}

function apuntarse(actId, nombreCreador){
  if(!sessionEmail||!miMascota){ mostrarToast('Inicia sesión para apuntarte'); return; }
  var btn = document.getElementById('btn-apuntar-'+actId);
  var yaApuntado = btn && btn.classList.contains('apuntado');
  var action = yaApuntado ? 'desapuntarse' : 'apuntarse';
  fetch('/api/galeria?action='+action,{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({actividad_id:actId,uid_mascota:miMascota.uid,nombre_mascota:miMascota.nombre,foto_mascota:miMascota.foto||''})
  }).then(function(r){return r.json();})
  .then(function(d){
    if(d.ok){
      if(btn){ btn.textContent=yaApuntado?'🐾 Apuntarse':'✓ Apuntado'; btn.className='btn-apuntar'+(yaApuntado?'':' apuntado'); }
      cargarApuntes(actId);
      if(!yaApuntado) mostrarToast('🐾 ¡Te apuntaste!');
    }
  });
}

function asistirEvento(eId){
  if(!sessionEmail||!miMascota){ mostrarToast('Inicia sesión para asistir'); return; }
  var btn = document.getElementById('btn-ev-'+eId);
  fetch('/api/galeria?action=asistirEvento',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({evento_id:eId,uid_mascota:miMascota.uid,email:sessionEmail})
  }).then(function(r){return r.json();})
  .then(function(d){
    if(d.ok && btn){ btn.textContent='✅ Confirmado'; btn.className='btn-asistir asistiendo'; mostrarToast('✅ ¡Nos vemos ahí!'); }
  });
}

function marcarAparecio(id, nombre){
  if(!confirm('🎉 ¿Confirmar que '+nombre+' ya apareció?')) return;
  var overlay=document.createElement('div');
  overlay.style.cssText='position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);z-index:999;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px';
  overlay.innerHTML='<div style="font-size:80px">🎉</div><div style="font-size:22px;font-weight:900;color:#fff;text-align:center">¡'+nombre+' apareció!<br><span style="font-size:16px;font-weight:400;opacity:.8">Gracias a todos los que ayudaron 🐾</span></div>';
  document.body.appendChild(overlay);
  fetch('/api/galeria?action=marcarAparecio',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({actividad_id:id})})
    .then(function(){
      setTimeout(function(){ document.body.removeChild(overlay); cargar(); mostrarToast('🎉 ¡'+nombre+' apareció!'); }, 2500);
    });
}

function eliminarActividad(id){
  if(!confirm('¿Eliminar esta publicación?')) return;
  fetch('/api/galeria?action=eliminarActividad',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({actividad_id:id})})
    .then(function(){ cargar(); mostrarToast('Publicación eliminada'); });
}

function contactarPerdido(email, nombre){
  if(!sessionEmail){ mostrarToast('Inicia sesión para contactar'); return; }
  window.location.href='mailto:'+email+'?subject=Información sobre '+nombre+' — PetMi';
}

function contactarAdopcion(email, titulo){
  if(!sessionEmail){ mostrarToast('Inicia sesión para contactar'); return; }
  fetch('/api/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'notificarInteres',emailCreador:email,tituloAnuncio:titulo,nombreMascota:miMascota?miMascota.nombre:'Alguien',emailInteresado:sessionEmail})})
    .then(function(){ mostrarToast('🏠 Mensaje enviado al publicador'); });
}

// ── Publicar ──────────────────────────────────────────────────
function abrirPublicar(){
  if(!sessionEmail){ mostrarToast('Inicia sesión para publicar'); return; }
  document.getElementById('modalPublicar').classList.add('open');
}
function cerrarPublicar(){ document.getElementById('modalPublicar').classList.remove('open'); }

function selTipo(tipo, el){
  tipoSeleccionado = tipo;
  document.querySelectorAll('.tipo-option').forEach(function(o){o.classList.remove('selected');});
  el.classList.add('selected');
}

function publicar(){
  if(!sessionEmail||!miMascota){ mostrarToast('Inicia sesión primero'); return; }
  var titulo = document.getElementById('pubTitulo').value.trim();
  if(!titulo){ mostrarToast('El título es obligatorio'); return; }
  var btn = document.querySelector('.btn-publicar');
  btn.disabled=true; btn.textContent='Publicando...';
  var activo = tipoSeleccionado==='adopcion' ? false : true;
  fetch('/api/galeria?action=publicarActividad',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      uid_creador:    miMascota.uid,
      nombre_creador: miMascota.nombre,
      foto_creador:   miMascota.foto||'',
      email_creador:  sessionEmail,
      tipo:           tipoSeleccionado,
      titulo:         titulo,
      descripcion:    document.getElementById('pubDesc').value.trim(),
      fecha:          document.getElementById('pubFecha').value||null,
      hora:           document.getElementById('pubHora').value||null,
      ubicacion:      document.getElementById('pubUbicacion').value.trim(),
      activo_override:activo
    })
  }).then(function(r){return r.json();})
  .then(function(d){
    btn.disabled=false; btn.textContent='Publicar';
    if(d.ok){
      cerrarPublicar();
      var msg = tipoSeleccionado==='adopcion'
        ? '🏠 Adopción enviada al jefe para revisión'
        : '🐾 ¡Publicado! Visible en la comunidad';
      mostrarToast(msg);
      // Mostrar imagen del jefe si es adopcion o busco
      if(tipoSeleccionado==='adopcion'){
        setTimeout(function(){
          mostrarToast('El jefe revisará tu publicación pronto 🐾');
        }, 2600);
      }
      document.getElementById('pubTitulo').value='';
      document.getElementById('pubDesc').value='';
      document.getElementById('pubFecha').value='';
      document.getElementById('pubHora').value='';
      document.getElementById('pubUbicacion').value='';
      if(tabActual==='actividades') cargar();
    }
  }).catch(function(){ btn.disabled=false; btn.textContent='Publicar'; mostrarToast('Error al publicar'); });
}

// ── Helpers ───────────────────────────────────────────────────
function tiempoRelativo(ts){
  if(!ts) return '';
  var diff=Date.now()-new Date(ts).getTime();
  var m=Math.floor(diff/60000);
  if(m<1) return 'ahora';
  if(m<60) return m+'min';
  var h=Math.floor(m/60);
  if(h<24) return h+'h';
  return Math.floor(h/24)+'d';
}

function mostrarToast(msg){
  var el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  setTimeout(function(){el.classList.remove('show');},2500);
}

renderMesPicker();
cargar();
